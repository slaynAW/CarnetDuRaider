# Compile et teste l'application à chaque push et pull request :
# - tests du module core (données du jeu, liste de courses, verdict) ;
# - contrôle de la règle des traductions (données régénérables, aucun nom exclu réintroduit) ;
# - lint Android et APK de test (onglet « Actions » → artefact « apk »).
#
# Chaîne de production : actions épinglées par empreinte de commit (tenues à jour par Dependabot),
# jeton en lecture seule.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Code de version croissant : chaque APK peut s'installer par-dessus le précédent.
  CDR_VERSION_CODE: ${{ github.run_number }}

jobs:
  android:
    name: Tests, lint et APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Valide aussi la somme de contrôle du gradle-wrapper.jar (protection de la chaîne de build).
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Version
        run: |
          base=$(grep '^cdr.versionName=' gradle.properties | cut -d= -f2)
          echo "CDR_VERSION_NAME=${base}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Tests, lint et APK
        run: ./gradlew --stacktrace :core:test :app:lintRelease :app:assembleRelease

      - name: Avertissements lint
        if: always()
        run: cat app/build/reports/lint-results-release.txt 2>/dev/null || echo "Aucun rapport texte"

      - name: Préparation de l'APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/CarnetDuRaider-${CDR_VERSION_NAME}.apk"
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: dist/
          if-no-files-found: error

      - name: Rapports (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapports
          path: |
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore
