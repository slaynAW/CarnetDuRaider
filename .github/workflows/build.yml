# Compile, teste et publie l'application.
#
# - Chaque push / pull request : tests du module core, lint Android et APK (onglet « Actions » →
#   artefact « apk »), signé avec une clé de test.
# - Push sur une branche : la pré-version « dev » est remplacée (APK signé avec une clé de test,
#   jamais proposé par les mises à jour intégrées).
# - Version officielle : onglet Actions → Build → « Run workflow » en indiquant le numéro (ex. 0.1.0),
#   ou push d'un tag « vX.Y.Z ». Le job « Publication officielle » attend ta validation
#   (environnement « publication ») : lui seul reçoit la clé de signature. Il signe l'APK et le
#   manifeste de mise à jour, atteste la provenance de chaque fichier, puis crée le tag et la Release.
#   Voir docs/MISES-A-JOUR.md et docs/SIGNATURE.md.
#
# Chaîne de production : actions épinglées par empreinte de commit (tenues à jour par Dependabot),
# jeton en lecture seule par défaut, aucun secret hors du job de publication.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version officielle à publier (ex. 0.1.0). Laisser vide pour un simple build de développement."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # Une publication officielle a son propre groupe : un push sur la branche ne l'annule pas pendant
  # qu'elle attend ta validation.
  group: build-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: true

env:
  # Code de version croissant : chaque APK peut s'installer par-dessus le précédent. C'est aussi lui
  # que l'appli compare pour proposer une mise à jour.
  CDR_VERSION_CODE: ${{ github.run_number }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      official: ${{ steps.v.outputs.official }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          base=$(grep '^cdr.versionName=' gradle.properties | cut -d= -f2)
          official=false
          if [[ -n "$RELEASE_INPUT" ]]; then
            if [[ ! "$RELEASE_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Version::« $RELEASE_INPUT » n'est pas un numéro de version valide (format attendu : 1.2.3)."
              exit 1
            fi
            name="$RELEASE_INPUT"; official=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"; official=true
            if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Version::Le tag « $GITHUB_REF_NAME » n'est pas de la forme vX.Y.Z."
              exit 1
            fi
          else
            name="${base}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "official=$official" >> "$GITHUB_OUTPUT"

  android:
    name: Tests, lint et APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CDR_VERSION_NAME: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Valide aussi la somme de contrôle du gradle-wrapper.jar (protection de la chaîne de build).
      # Version officielle compilée sans cache : rien d'un build précédent ne peut s'y glisser.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-disabled: ${{ needs.version.outputs.official == 'true' }}

      # Aucune clé de signature ici : l'APK est signé avec une clé de test. Seul le job « Publication
      # officielle » reçoit la clé définitive, après validation (docs/SIGNATURE.md).
      - name: Tests, lint et APK
        run: ./gradlew --stacktrace :core:test :app:lintRelease :app:assembleRelease

      - name: Avertissements lint
        if: always()
        run: cat app/build/reports/lint-results-release.txt 2>/dev/null || echo "Aucun rapport texte"

      # Rejoue la signature de publication (même script, même outil) avec une clé jetable : un
      # problème de signature se voit à chaque build, pas le jour d'une version officielle.
      - name: Signature de publication (essai avec une clé jetable)
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -hex 24)
          export KEYSTORE_PASSWORD
          keytool -genkeypair -keystore "$RUNNER_TEMP/essai.p12" -storetype PKCS12 -alias essai \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Essai" 2>/dev/null
          bash .github/scripts/signer-apk.sh app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/essai.apk" "$RUNNER_TEMP/essai.p12" essai

      - name: Préparation de l'APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/CarnetDuRaider-${CDR_VERSION_NAME}.apk"
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: dist/
          if-no-files-found: error

      - name: Rapports (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapports
          path: |
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore

  prerelease:
    name: Pré-version de développement
    needs: [version, android]
    # Push sur une branche ou lancement manuel sans numéro ; jamais pour une pull request, ni pour
    # Dependabot (jeton en lecture seule). Aucun secret : l'APK garde sa clé de test.
    if: >-
      needs.version.outputs.official != 'true' && startsWith(github.ref, 'refs/heads/') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # pré-version « dev » (Release et tag)
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.name }}
      OFFICIAL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk
          path: dist
      - name: Notes de version
        run: bash .github/scripts/notes-de-version.sh
      - name: Nouveautés
        run: bash .github/scripts/manifeste-mise-a-jour.sh
      - name: Publication de la pré-version
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Version de développement ${VERSION} (${GITHUB_REF_NAME})" --notes-file notes.md

  release:
    name: Publication officielle
    needs: [version, android]
    if: needs.version.outputs.official == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Seul job qui reçoit la clé de signature : l'environnement « publication » attend ta validation
    # (Settings → Environments → publication : Required reviewers) avant de lui remettre ses secrets.
    environment: publication
    permissions:
      contents: write # tag et Release
      id-token: write # attestation de provenance (Sigstore)
      attestations: write # enregistrement des attestations dans le dépôt
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.name }}
      OFFICIAL: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Numéro de version libre et plus récent
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error title=Version::La version v$VERSION existe déjà : choisissez un autre numéro."
            exit 1
          fi
          # Jamais plus ancienne que la dernière version publiée : elle deviendrait la « dernière
          # version » de GitHub, celle que proposent les mises à jour intégrées (cas d'une publication
          # validée après une autre plus récente).
          if ! latest=$(gh release view --json tagName --jq .tagName 2> "$RUNNER_TEMP/latest.err"); then
            if ! grep -q "release not found" "$RUNNER_TEMP/latest.err"; then
              cat "$RUNNER_TEMP/latest.err"
              echo "::error title=Version::Dernière version publiée illisible : relancez le job."
              exit 1
            fi
            latest="" # aucune version publiée
          fi
          latest=${latest#v}
          if [[ -n "$latest" && "$(printf '%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]]; then
            echo "::error title=Version::v$VERSION est plus ancienne que la dernière version publiée (v$latest) : choisissez un numéro plus récent."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk
          path: dist
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Signature de l'APK (clé définitive)
        env:
          KEYSTORE_BASE64: ${{ secrets.CDR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CDR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.CDR_KEY_ALIAS }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error title=Signature::Secrets CDR_KEYSTORE_BASE64 / CDR_KEYSTORE_PASSWORD absents (environnement « publication »). Voir docs/SIGNATURE.md."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$keystore"' EXIT
          # Tolère les espaces / retours à la ligne ajoutés par un copier-coller.
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$keystore"
          apk="dist/CarnetDuRaider-${VERSION}.apk"
          bash .github/scripts/signer-apk.sh "$apk" "$RUNNER_TEMP/signed.apk" "$keystore" "${KEY_ALIAS:-carnetduraider}"
          mv "$RUNNER_TEMP/signed.apk" "$apk"
      - name: Notes de version
        run: bash .github/scripts/notes-de-version.sh
      # Manifeste des mises à jour intégrées (nouveautés + empreinte), signé avec la clé de l'APK.
      # Voir docs/MISES-A-JOUR.md.
      - name: Manifeste de mise à jour
        env:
          KEYSTORE_BASE64: ${{ secrets.CDR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CDR_KEYSTORE_PASSWORD }}
        run: bash .github/scripts/manifeste-mise-a-jour.sh
      # Provenance signée (Sigstore) de chaque fichier publié : dépôt, workflow et commit qui l'ont
      # produit. Vérifiable par tous : gh attestation verify <fichier> --repo slaynAW/CarnetDuRaider.
      - name: Attestation de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Carnet du Raider $VERSION" --notes-file notes.md
          else
            # Crée le tag vX.Y.Z sur le commit compilé, puis la Release.
            gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Carnet du Raider $VERSION" --notes-file notes.md
          fi
