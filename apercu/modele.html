// ---- Où aller pour trouver ce qui manque (PreparationRaid.kt) ----
function conseilRaid(ids) {
  const cherches = [...new Set(ids)].map(id => objets.get(id)).filter(Boolean);
  const sansButin = cherches.filter(o => !o.obtention?.cartes?.length).map(o => o.id);
  const parCarte = new Map();
  for (const o of cherches) for (const c of o.obtention?.cartes || []) { if (!parCarte.has(c.carte)) parCarte.set(c.carte, []); parCarte.get(c.carte).push([o.id, c.indice]); }
  const cartesC = [...parCarte].map(([carteId, l]) => {
    const pz = new Map();
    for (const o of cherches) for (const z of (o.obtention?.zones || []).filter(z => z.carte === carteId)) { if (!pz.has(z.zone)) pz.set(z.zone, []); pz.get(z.zone).push([o.id, z.indice]); }
    const zones = [...pz].map(([zone, zl]) => ({ zone, score: zl.reduce((s, x) => s + x[1], 0) / 100, objets: [...zl].sort((a, b) => b[1] - a[1]).map(x => x[0]) }))
      .sort((a, b) => b.objets.length - a.objets.length || b.score - a.score || a.zone.localeCompare(b.zone)).slice(0, 4);
    return { carteId, score: l.reduce((s, x) => s + x[1], 0) / 100, objets: [...l].sort((a, b) => b[1] - a[1]).map(x => x[0]), meilleurePour: l.filter(x => x[1] === 100).map(x => x[0]), zones };
  }).sort((a, b) => b.score - a.score || b.objets.length - a.objets.length || a.carteId.localeCompare(b.carteId));
  // Parcours : à chaque tour, la carte qui apporte le plus de chances sur les objets pas encore couverts.
  const restants = new Set(cartesC.flatMap(c => c.objets)), parcours = [];
  while (restants.size && parcours.length < 3) {
    let meilleur = null;
    for (const [carteId, l] of parCarte) {
      if (parcours.some(e => e.carteId === carteId)) continue;
      const apport = l.filter(x => restants.has(x[0])), somme = apport.reduce((s, x) => s + x[1], 0);
      if (!meilleur || somme > meilleur.somme || (somme === meilleur.somme && (apport.length > meilleur.apport.length || (apport.length === meilleur.apport.length && carteId < meilleur.carteId)))) meilleur = { carteId, apport, somme };
    }
    if (!meilleur || !meilleur.apport.length) break;
    parcours.push({ carteId: meilleur.carteId, objets: [...meilleur.apport].sort((a, b) => b[1] - a[1]).map(x => x[0]) });
    for (const [id] of meilleur.apport) restants.delete(id);
  }
  return { cartes: cartesC, sansButin, parcours };
}
function autreMoyen(o) {
  const ob = o.obtention || {};
  if (o.lieux.includes("ARC")) return "Sur les ARC détruits";
  const a = ob.achats?.[0];
  if (a) return `Chez ${a.commercant}${a.pieces ? ` (${a.pieces} pièces)` : a.valeurObjets ? " (en échange d'objets)" : ""}`;
  const f = ob.fabrications?.[0];
  if (f) return `Fabrication${NB}: ${f.etabli ? (f.niveau ? `${f.etabli} · niveau ${f.niveau}` : f.etabli) : "pendant un raid"}`;
  const r = sourcesRecyclage(o.id)[0];
  if (r) return `En recyclant${NB}: ${nomObjet(r.id)}`;
  if (ob.recompenses?.length) return `En récompense${NB}: ${ob.recompenses[0]}`;
  return "Aucune source connue dans les données du jeu.";
}
// ---- Onglet Raid (EcranRaid.kt) : ce qu'il te faut et où aller, sans rien préparer ----
function ecranOngletRaid() {
  const objs = objectifs(), liste = aTrouver(), restants = liste.filter(x => !x.trouve), conseil = conseilRaid(restants.map(x => x.id));
  const nomC = id => cartes.get(id)?.nom ?? NOM_A_VERIFIER;
  // Cartes détaillées : celles du parcours (les cartes à faire), sinon la meilleure.
  let detaillees = conseil.parcours.map(e => conseil.cartes.find(c => c.carteId === e.carteId)).filter(Boolean);
  if (!detaillees.length) detaillees = conseil.cartes.slice(0, 1);
  const autres = conseil.cartes.filter(c => !detaillees.includes(c)), avecButin = new Set(conseil.cartes.flatMap(c => c.objets)).size;
  const couverts = conseil.parcours.reduce((n, e) => n + e.objets.length, 0), meilleure = conseil.cartes[0];
  return `${bandeauSection("RAID", restants.length ? `${pluriel(restants.length, "objet", "objets")} à trouver` : objs.length ? "Rien à chercher en raid" : "Rien à chercher pour l'instant")}
  ${restants.length ? "" : `<p class="doux" style="margin:0">${objs.length ? "Tes objectifs en cours ne demandent aucun objet à rapporter." : "Rien à chercher pour l'instant."}</p>`}
  ${meilleure ? `<div class="prochain plein${FONDS.has(meilleure.carteId) ? ` photo" style="--photo:url('fonds/${meilleure.carteId}.webp')` : ""}"><small>MEILLEURE CARTE</small><strong>${echap(nomC(meilleure.carteId))}</strong>
    <b>${meilleure.objets.length} de tes ${pluriel(restants.length, "objet", "objets")} à trouver${meilleure.zones[0] ? ` · surtout ${echap(meilleure.zones[0].zone)}` : ""}</b></div>` : ""}
  ${liste.length ? `${etiquette("Ce qu'il te faut", "--rouge", "h4")}
  ${liste.map(ligneATrouver).join("")}` : ""}
  ${restants.length ? `<button class="bouton large contour" style="--c:var(--rouge)" data-action="raid">Retour de raid${NB}: ajouter mon butin</button>` : ""}
  ${objs.length ? `<div class="ligne" style="margin-top:8px"><span class="etiquette flex" style="--c:var(--vert)">Mes objectifs</span><button class="lien" style="--c:var(--vert)" data-action="onglet" data-onglet="OBJECTIFS">Modifier</button></div>
  ${objs.map(carteObjectif).join("")}` : ""}
  ${!objs.length ? `<div class="carte" style="background:var(--releve);display:flex;flex-direction:column;gap:8px;padding:16px"><span class="doux">Indique ce que tu as en cours (quêtes, ateliers, projets, expéditions)${NB}: l'appli te dira sur quelle carte aller et où chercher.</span>
    <button class="bouton" style="--c:var(--vert);align-self:flex-start" data-action="onglet" data-onglet="OBJECTIFS">Indiquer mes objectifs</button></div>` : ""}
  <div class="ligne" style="margin-top:8px"><span class="etiquette flex" style="--c:var(--rouge)">${BUTIN}</span><button class="lien" style="--c:var(--rouge)" data-action="butin-ecran">+ Ajouter un objet</button></div>
  ${objetsRecherches().length ? objetsRecherches().map(ligneButin).join("") : `<p class="petit doux" style="margin:0">Des objets à rapporter pour toi, sans quête ni projet${NB}: ils s'ajoutent à ce qu'il te faut, se décomptent au retour de raid et quittent la liste une fois tous rapportés.</p>`}
  ${detaillees.length ? `${etiquette("Où aller", "--rouge", "h4")}
  ${conseil.parcours.length > 1 ? `<div class="carte" style="background:var(--releve);display:flex;flex-direction:column;gap:4px;padding:14px"><b style="color:var(--rouge);font-family:var(--titre)">Pour tout trouver</b>
    ${conseil.parcours.map((e, i) => `<span>${i + 1}. ${echap(nomC(e.carteId))} · ${i ? "+ " : ""}${pluriel(e.objets.length, "objet", "objets")}</span>`).join("")}
    ${couverts < avecButin ? `<span class="petit doux">${pluriel(avecButin - couverts, "autre objet", "autres objets")} sur d'autres cartes.</span>` : ""}</div>` : ""}
  ${detaillees.map(c => carteRaid(c, avecButin, c === conseil.cartes[0])).join("")}
  ${autres.length ? `<p class="doux" style="margin:0">Aussi${NB}: ${echap(autres.map(c => `${nomC(c.carteId)} (${pluriel(c.objets.length, "objet", "objets")})`).join(" · "))}</p>` : ""}
  <p class="petit discret" style="margin:0">Classement d'après les tables de butin du jeu (condition normale). Les taux de drop exacts ne sont pas publiés${NB}: le jeu tire le butin sur ses serveurs. Les conditions en cours sur chaque carte s'affichent dans l'appli Android.</p>` : ""}
  ${conseil.sansButin.length ? `${etiquette("Pas dans le butin", "--rouge", "h4")}${conseil.sansButin.map(id => `<button class="carte ligne" style="padding:10px;text-align:left" data-action="fiche" data-id="${id}">${icone(id, 36)}<span class="flex"><span class="nom">${echap(nomObjet(id))}</span><br><span class="petit doux">${echap(autreMoyen(objets.get(id)))}</span></span></button>`).join("")}` : ""}`;
}

// Un objet du butin recherché (LigneButin, EcranRaid.kt) : rapportés sur voulus, quantité, retirer.
function ligneButin(o) {
  const nom = echap(nomObjet(o.id)), r = rapportesButin(o.id);
  return `<div class="carte ligne" style="padding:8px 2px 8px 10px;gap:8px" data-butin="${o.id}"><button class="ligne flex" style="text-align:left;gap:10px" data-action="fiche" data-id="${o.id}">${icone(o.id, 40)}
    <span class="flex"><span class="nom">${nom}</span><br><span class="petit doux" style="font-weight:600">${r}/${o.quantite} rapportés</span></span></button>
    <button class="rond" style="border-radius:6px;width:40px;height:40px;background:var(--releve)" data-action="butin-moins" data-id="${o.id}" ${o.quantite > r + 1 ? "" : "disabled"} aria-label="Un de moins${NB}: ${nom}">−</button>
    <b style="font:700 16px var(--titre);color:var(--rouge);font-variant-numeric:tabular-nums">${o.quantite}</b>
    <button class="rond" style="border-radius:6px;width:40px;height:40px;background:var(--releve)" data-action="butin-plus" data-id="${o.id}" ${o.quantite < BUTIN_MAX ? "" : "disabled"} aria-label="Un de plus${NB}: ${nom}">+</button>
    <button class="retour" data-action="butin-retirer" data-id="${o.id}" aria-label="Retirer du butin recherché${NB}: ${nom}">✕</button></div>`;
}
// Ajouter un objet au butin recherché (EcranChoixButin.kt) : tout le catalogue, avec une recherche.
function ecranChoixButin() {
  const r = S.rechercheButin.trim() ? rechercher(S.rechercheButin, 200) : tous;
  return `${retour("Raid", "--rouge")}<h3>${BUTIN}</h3>
  <p class="doux" style="margin:0">Choisis un objet à rapporter. Il s'ajoute à ce qu'il te faut et se décompte au retour de raid.</p>
  <label class="recherche" style="--f:var(--rouge)"><svg class="ic" viewBox="0 0 24 24" style="color:var(--rouge)"><path d="${ONGLETS[1][3]}"/></svg><input id="recherche-butin" type="search" placeholder="Cherche un objet…" value="${echap(S.rechercheButin)}" data-champ="rechercheButin" autocomplete="off"></label>
  ${r.length ? "" : `<p class="doux">Aucun objet ne correspond.</p>`}
  ${r.map(o => `<button class="carte ligne" style="padding:10px" data-action="butin-choisir" data-id="${o.id}">${icone(o.id, 44)}
    <span class="flex"><span class="nom">${echap(o.nom)}</span><br><span class="petit doux">${echap([RARETES[o.rarete]?.[0], o.categorie].filter(Boolean).join(" · "))}</span></span>${M.butin?.[o.id] ? `<small style="color:var(--rouge);font-weight:600">Déjà${NB}: ${M.butin[o.id]}</small>` : ""}</button>`).join("")}`;
}

// Un objet à trouver : combien il en reste (le décompte, mis à jour au retour de raid), combien on en a sur
// combien il en faut, et pour quoi.
function ligneATrouver(a) {
  const nom = echap(nomObjet(a.id));
  return `<div class="carte ligne" style="padding:8px 4px 8px 10px;gap:10px"><button class="ligne flex" style="text-align:left;gap:10px" data-action="fiche" data-id="${a.id}">${icone(a.id, 40)}
    <span class="flex"><span class="nom">${nom}</span><br><span class="petit" style="font-weight:600;color:var(${a.trouve ? "--vert" : "--texte-doux"})">${a.trouves}/${a.voulu} · ${echap(pourQui(a))}</span></span></button>
    ${a.trouve ? `<span role="img" aria-label="Trouvé" style="color:var(--vert);font:700 22px var(--titre);padding:0 10px">✓</span>`
      : `<span class="reste"><b>${a.reste}</b><small>à trouver</small></span>`}</div>`;
}

// Une carte conseillée : ce qu'on y trouve et les zones où chercher (CarteRaid, EcranRaid.kt).
function carteRaid(c, total, meilleure) {
  return `<div class="carte" style="display:flex;flex-direction:column;gap:6px;padding:14px">
    <div class="ligne"><span class="flex">${meilleure ? `<small style="color:var(--rouge);font-weight:700;letter-spacing:.08em">LE MIEUX</small><br>` : ""}<span style="font:700 19px var(--titre)">${echap(cartes.get(c.carteId)?.nom ?? NOM_A_VERIFIER)}</span></span><b style="font:700 19px var(--titre);color:var(--rouge)">${c.objets.length}/${total}</b></div>
    <span class="petit doux">${pluriel(c.objets.length, "objet à trouver", "objets à trouver")}${c.meilleurePour.length ? `, dont ${c.meilleurePour.length} à leur meilleur endroit` : ""}.</span>
    <div style="display:flex;gap:4px;overflow-x:auto">${c.objets.map(id => icone(id, 32)).join("")}</div>
    ${c.zones.length ? `<h5>Où chercher</h5>${c.zones.map(z => `<button class="carte ligne" style="background:var(--releve);padding:8px 10px;text-align:left" data-action="plan-zone" data-id="${c.carteId}" data-zone="${echap(z.zone)}"><span class="flex"><b>${echap(z.zone)}</b><br><span class="petit doux">${echap(z.objets.map(nomObjet).join(" · "))}</span></span><small style="color:var(--cyan)">Plan ›</small></button>`).join("")}` : ""}</div>`;
}

// Des cases du build, deux par ligne (GrilleCases, EcranBuilds.kt).
function grilleCases(b, i, cases) {
  return `<div class="grille-2">${cases.map(([cle, nom]) => { const id = b.objets[cle]; return `<button class="case-build" data-action="build-case" data-id="${i}" data-case="${cle}">${id ? icone(id, 44) : `<span class="vide"></span>`}
    <span class="flex" style="min-width:0">${etiquette(nom, "--violet")}<br><span class="nom" style="font-size:14px;color:var(${id ? "--texte" : "--texte-discret"})">${id ? echap(nomObjet(id)) : "Choisir"}</span></span></button>`; }).join("")}</div>`;
}
// ---- Mes builds (EcranBuilds.kt) : six builds, une puce par build (deux lignes de trois), ses cases en grille ----
function ecranBuilds() {
  const liste = builds(), i = Math.min(S.build, liste.length - 1), b = liste[i];
  const mat = [...aGarderBuilds([b]).entries()].filter(([, u]) => u.every(x => !x.direct)).map(([id]) => id);
  return `${bandeauSection("BUILDS", `Mes ${liste.length} builds`)}
  <p class="doux" style="margin:0">Leurs objets, et tout ce qu'il faut pour les fabriquer, ne sont plus proposés à la vente.</p>
  <div class="grille-3">${liste.map((x, k) => pf(nomBuild(x, k), k === i, "--violet", "build", k)).join("")}</div>
  <label class="petit doux" style="font-weight:600">Nom du build<input class="champ" type="text" maxlength="30" placeholder="Build ${i + 1}" value="${echap(b.nom)}" data-build-nom="${i}" style="margin-top:4px"></label>
  ${grilleCases(b, i, CASES.filter(c => c[2] !== "DIVERS"))}
  ${etiquette("Autres", "--violet", "h4")}
  ${grilleCases(b, i, CASES.filter(c => c[2] === "DIVERS"))}
  ${mat.length ? `<div class="carte" style="display:flex;flex-direction:column;gap:6px;padding:14px 16px">${etiquette("Pour le fabriquer", "--violet")}
    <span>${echap(mat.slice(0, 6).map(nomObjet).join(" · "))}${mat.length > 6 ? ` et ${pluriel(mat.length - 6, "autre", "autres")}` : ""}</span>
    <span class="petit doux">À garder${NB}: ils ne sont plus proposés à la vente.</span></div>` : ""}`;
}
// Choix de l'objet d'une case : seulement les objets de son emplacement (EcranChoixObjetBuild).
function ecranChoixBuild() {
  const { rang, cle } = S.caseBuild, b = builds()[rang], nomCase = CASES.find(c => c[0] === cle)[1], actuel = b.objets[cle];
  const k = normaliser(S.rechercheBuild), liste = choixCase(cle).filter(o => !k || normaliser(o.nom).includes(k));
  return `${retour("Builds", "--violet")}<h3>${echap(nomBuild(b, rang))} · ${nomCase}</h3>
  <label class="recherche" style="--f:var(--violet)"><svg class="ic" viewBox="0 0 24 24" style="color:var(--violet)"><path d="${ONGLETS[1][3]}"/></svg><input id="recherche-build" type="search" placeholder="Chercher…" value="${echap(S.rechercheBuild)}" data-champ="rechercheBuild" autocomplete="off"></label>
  ${actuel ? `<div class="grille-2"><button class="carte" style="background:var(--releve)" data-action="fiche" data-id="${actuel}"><span style="color:var(--violet)">ⓘ</span> Voir la fiche</button><button class="carte doux" style="background:var(--releve)" data-action="build-choisir" data-id="">✕ Vider la case</button></div>` : ""}
  ${liste.length ? "" : `<p class="doux">Aucun objet ne correspond.</p>`}
  ${liste.map(o => `<button class="carte ligne" style="padding:10px;${o.id === actuel ? "background:var(--releve)" : ""}" data-action="build-choisir" data-id="${o.id}">${icone(o.id, 44)}
    <span class="flex"><span class="nom">${echap(o.nom)}</span><br><span class="petit doux">${echap([RARETES[o.rarete]?.[0], o.categorie].filter(Boolean).join(" · "))}</span></span>${o.id === actuel ? `<span role="img" aria-label="Choisi" style="color:var(--violet);font:700 22px var(--titre)">✓</span>` : ""}</button>`).join("")}`;
}

function ecranReglages() {
  return `${retour("Réglages", "--texte")}<h3>Réglages</h3>
  <div class="note-apercu doux">Ceci est l'<b>aperçu web</b> du Carnet du Raider, tenu à jour avec l'appli Android. Les mises à jour intégrées, le calendrier en direct et les alertes ne fonctionnent que dans l'appli Android.</div>
  <h4>Tes données dans l'aperçu</h4>
  <p class="petit doux" style="margin:0">${stockage === "compte" ? "Ce que tu as en cours, ce que tu as rapporté et tes builds sont gardés avec ton compte claude.ai, visibles de toi seul." : "Ce que tu as en cours, ce que tu as rapporté et tes builds sont gardés dans ce navigateur."} Elles sont séparées de celles de l'appli sur ton téléphone.</p>
  <button class="lien" style="--c:var(--rouge);align-self:flex-start;padding-left:0" data-action="effacer">Effacer mes données de l'aperçu</button>
  <h4>Sauvegarde</h4>
  <p class="petit doux" style="margin:0">Dans l'appli Android, tes données sont sauvegardées automatiquement dans un fichier chiffré avec ton mot de passe, rangé où tu veux (Google Drive pour les retrouver sur un autre téléphone). Propre à l'appli Android.</p>
  <h4>À propos</h4>
  <p class="petit discret" style="margin:0">Projet de fan, non officiel. ARC Raiders est une marque d'Embark Studios AB${NB}; cette appli n'est ni affiliée à Embark Studios ni approuvée par Embark Studios. Noms et icônes du jeu © Embark Studios AB.</p>`;
}

// ---- Animation de fin de retour de raid (CelebrationRaid.kt). Un objectif terminé de lui-même est validé à
// la manière d'ARC Raiders : une bande verte balaie l'écran, « OBJECTIF TERMINÉ » s'y resserre, puis chaque
// objectif reçoit son tampon « VALIDÉ ». Quand toute la liste est trouvée, une gerbe de bandes ----
const GERBE = (() => {
  let g = 7;
  const hasard = () => (g = (g * 16807) % 2147483647) / 2147483647;
  const couleurs = ["--cyan", "--vert", "--or", "--rouge"];
  return Array.from({ length: 40 }, (_, i) => {
    const a = hasard() * 2 * Math.PI, v = 30 + hasard() * 45;
    return `<i style="--c:var(${couleurs[i % 4]});--dx:${(Math.cos(a) * v).toFixed(1)}vmin;--dy:${(Math.sin(a) * v).toFixed(1)}vmin;--r:${Math.round(180 + hasard() * 360)}deg"></i>`;
  }).join("");
})();
function celebration() {
  const b = S.celebration;
  if (!b) return "";
  const restants = aTrouver().length, objectifsMontres = b.termines.slice(0, 3), montres = b.atteints.slice(0, 5);
  const autres = b.termines.length - objectifsMontres.length + b.atteints.length - montres.length;
  const nomTitre = b.termines.length ? (b.termines.length > 1 ? "Objectifs terminés" : "Objectif terminé") : b.termine ? "Raid terminé" : "Objets trouvés";
  const titre = b.termines.length
    ? `<div class="banniere"><h2>${nomTitre.toUpperCase()}</h2></div><p class="sous ${b.termine ? "" : "doux"}" style="font-size:15px">${b.termine ? `Raid terminé, objets trouvés${NB}! ` : "Tout est rapporté. "}La suite s'ajoute à tes objectifs.</p>`
    : b.termine ? `<svg class="pop" width="70" height="40" viewBox="0 0 35 20" aria-hidden="true"><path d="M0 20h5l7.2-20h-5z" fill="#3CC4D8"/><path d="M7.5 20h5l7.2-20h-5z" fill="#6CCB5F"/><path d="M15 20h5l7.2-20h-5z" fill="#F2B233"/><path d="M22.5 20h5l7.2-20h-5z" fill="#F0544A"/></svg>
      <h2 class="pop">Raid terminé</h2><p class="sous" style="color:var(--vert)">Objets trouvés${NB}!</p>`
    : `<h2 class="pop" style="color:var(--vert)">Objets trouvés</h2><p class="sous doux">${restants ? `Encore ${pluriel(restants, "objet", "objets")} à trouver.` : "Tout est trouvé."}</p>`;
  // Les objectifs terminés d'abord (avec leur tampon), puis les objets qui ont atteint leur nombre.
  const lignes = [
    ...objectifsMontres.map((o, i) => [`<span class="flex"><span class="nom">${echap(libelle(o))}</span><br><span class="petit" style="color:var(--vert);font-weight:600">Tout est rapporté</span></span>
      <span class="tampon" style="animation-delay:${900 + i * 250}ms">VALIDÉ</span>`, "objectif-termine"]),
    ...montres.map(a => [`<span class="coche-icone">${icone(a.id, 44)}<i>✓</i></span>
      <span class="flex"><span class="nom">${echap(nomObjet(a.id))}</span><br><span class="petit doux">${Math.min(a.trouves, a.voulu)}/${a.voulu} · ${echap(pourQui(a))}</span></span>`, ""]),
  ].map(([contenu, classe], i) => `<div class="carte ligne atteint ${classe}" style="animation-delay:${350 + i * 150}ms">${contenu}</div>`);
  return `<div class="celebration" data-action="fin-celebration" role="dialog" aria-modal="true" aria-label="${nomTitre}" tabindex="-1">
    ${b.termine ? `<div class="gerbe" aria-hidden="true">${GERBE}</div>` : ""}
    <div class="celebration-in" aria-live="polite">${titre}
      <div class="atteints">${lignes.join("")}</div>
      ${autres > 0 ? `<p class="petit doux" style="margin:0">Et ${pluriel(autres, "autre", "autres")}.</p>` : ""}
      <p class="petit discret" style="margin:8px 0 0">Touche l'écran pour continuer</p>
    </div></div>`;
}

// ---- Validation en une touche, annulable (BandeauValidation, CarnetApp.kt) ----
function bandeauValidation() {
  const v = S.validation;
  if (!v || S.celebration) return "";
  const detail = v.objetsNotes ? `${pluriel(v.objetsNotes, "objet noté", "objets notés")}${v.termines.length ? `, ${pluriel(v.termines.length, "objectif terminé", "objectifs terminés")}` : ""}.`
    : v.termines.length ? `Tout était rapporté aussi pour${NB}: ${v.termines.map(libelle).join(", ")}.` : "La suite s'ajoute à tes objectifs.";
  return `<div class="bandeau-validation" role="status"><div><div class="flex" style="min-width:0">${etiquette(v.objetsNotes && !v.termines.length ? "Validé" : "Objectif terminé", "--sur-couleur")}<br><b style="font:600 14px var(--titre)">${echap(v.titre)}</b><br><span class="petit">${echap(detail)}</span></div>
  <button class="lien" data-action="annuler-validation">Annuler</button></div></div>`;
}
let minuterieValidation = null;
function montrerValidation(v) {
  S.validation = { objetsNotes: 0, termines: [], ...v };
  clearTimeout(minuterieValidation);
  minuterieValidation = setTimeout(() => { S.validation = null; rendre(); }, 8000);
}
// Objectif fait en jeu (« C'est fait »), même sans tout avoir noté (une quête sans objet à rapporter, par
// exemple) : la suite s'ajoute, ce qui avait été rapporté pour lui est oublié ; la suite peut être déjà complète.
function valider(o) {
  const avant = JSON.stringify(M);
  terminerObjectif(o);
  delete M.apports[cleObjectif(o)];
  montrerValidation({ titre: libelle(o), avant, termines: terminerLesComplets() });
}


// ---- Rendu ----
let celebrationAffichee = null;
function rendre() {
  // Retour de raid quitté (Valider, retour, autre onglet, réglages) : il est validé.
  if (S.raid && S.ecran !== "raid") validerRetour();
  const champ = document.activeElement?.dataset?.champ, pos = document.activeElement?.selectionStart;
  const e = S.ecran;
  document.getElementById("contenu").innerHTML =
    e?.type === "fiche" ? ecranFiche(e.id) : e === "plan" ? ecranPlan() : e === "quetes" ? ecranQuetes() : e === "ateliers" ? ecranAteliers()
    : e === "projets" ? ecranProjets(false) : e === "expeditions" ? ecranProjets(true) : e === "choix-build" ? ecranChoixBuild()
    : e === "raid" ? ecranRaid() : e === "reglages" ? ecranReglages() : e === "choix-butin" ? ecranChoixButin()
    : { ACCUEIL: ecranAccueil, OBJETS: ecranObjets, RAID: ecranOngletRaid, CARTES: ecranCartes, OBJECTIFS: ecranObjectifs, BUILDS: ecranBuilds }[S.onglet]();
  document.getElementById("nav").innerHTML = ONGLETS.map(([k, t, c, d]) => `<button data-action="onglet" data-onglet="${k}" style="--c:var(${c})" ${S.onglet === k && !S.ecran ? 'aria-current="page"' : ""}><span class="pastille"><svg class="ic" viewBox="0 0 24 24"><path d="${d}"/></svg></span>${t}</button>`).join("");
  document.getElementById("dialogue").innerHTML = bandeauValidation();
  if (S.celebration !== celebrationAffichee) {
    celebrationAffichee = S.celebration;
    document.getElementById("celebration").innerHTML = celebration();
    document.querySelector(".celebration")?.focus();
  }
  if (e === "plan") brancherPlan();
  S.balayage = null;
  document.getElementById("bouton-reglages").style.color = S.ecran === "reglages" ? "var(--or)" : "var(--texte-doux)";
  if (champ) { const el = document.querySelector(`[data-champ="${champ}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (_) {} } }
}
function ouvrir(ecran) { S.ecran = ecran; rendre(); window.scrollTo(0, 0); }

// ---- Actions ----
function objectifDepuisCle(cle) {
  const [t, id, n] = cle.split(":");
  return t === "etabli" ? { type: "etabli", id, niveau: +n } : t === "projet" ? { type: "projet", id, etape: +n } : { type: "quete", id };
}
function changerBuild(rang, f) {
  const liste = builds();
  f(liste[rang]);
  M.builds = liste;
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-action]");
  if (!b || b.disabled) return;
  const id = b.dataset.id;
  switch (b.dataset.action) {
    case "onglet": S.onglet = b.dataset.onglet; S.ecran = null; rendre(); window.scrollTo(0, 0); return;
    case "fiche": S.precedent = S.ecran; return ouvrir({ type: "fiche", id });
    case "fermer": S.ecran = S.ecran === "plan" && P.depuis ? P.depuis : S.ecran?.type === "fiche" && S.precedent ? S.precedent : null; P.depuis = null; S.precedent = null; rendre(); return;
    case "reglages": return ouvrir("reglages");
    case "en-cours": S.choix = null; S.rechercheQuetes = ""; return ouvrir(id);
    case "raid":
      // État à l'ouverture (bilan, annulation) ; la liste est figée : un objet qui atteint son nombre ne disparaît pas sous le doigt.
      S.raid = { avant: JSON.parse(JSON.stringify(M.apports || {})), liste: listeDuRaid(), saisis: {} };
      return ouvrir("raid");
    case "noter": noter(id, +b.dataset.d); break;
    case "annuler-raid": M.apports = JSON.parse(JSON.stringify(S.raid.avant)); S.raid.saisis = {}; break;
    case "valider-retour": S.ecran = null; break;
    case "fin-celebration": S.celebration = null; if (S.validation) montrerValidation(S.validation); rendre(); return;
    case "region": M.region = id; break;
    case "filtre": S.filtre = id; rendre(); return;
    case "build": S.build = +id; rendre(); return;
    case "butin-ecran": S.rechercheButin = ""; return ouvrir("choix-butin");
    case "butin-choisir": changerButin(id, (M.butin?.[id] ?? 0) + 1); S.ecran = null; break;
    case "butin-ajouter": changerButin(id, (M.butin?.[id] ?? 0) + 1); break;
    case "butin-plus": changerButin(id, (M.butin?.[id] ?? 0) + 1); break;
    case "butin-moins": changerButin(id, (M.butin?.[id] ?? 0) - 1); break;
    case "butin-retirer": changerButin(id, 0); break;
    case "niveau-en-cours": indiquerNiveau(etablis.get(id), b.dataset.n === "" ? null : +b.dataset.n); break;
    case "etape-en-cours": indiquerEtape(projets.get(id), b.dataset.n === "" ? null : +b.dataset.n); break;
    case "etabli-termine": if (!etabliTermine(etablis.get(id))) S.balayage = `etabli:${id}`; indiquerEtabliTermine(etablis.get(id)); break;
    case "projet-termine": if (!projetTermine(projets.get(id))) S.balayage = `projet:${id}`; indiquerProjetTermine(projets.get(id)); break;
    case "valider-objectif": valider(objectifDepuisCle(b.dataset.cle)); break;
    case "build-case": S.caseBuild = { rang: +id, cle: b.dataset.case }; S.rechercheBuild = ""; return ouvrir("choix-build");
    case "build-choisir": { const { rang, cle } = S.caseBuild; changerBuild(rang, x => { if (id) x.objets[cle] = id; else delete x.objets[cle]; }); S.ecran = null; break; }
    case "annuler-validation": if (S.validation) { charger(S.validation.avant); S.validation = null; } break;
    case "plan": Object.assign(P, { id, e: 1, dx: 0, dy: 0, depuis: null }); S.recherchePlan = ""; return ouvrir("plan");
    case "plan-chercher": S.recherchePlan = id; rendre(); return;
    case "plan-zone": Object.assign(P, { id, e: 1, dx: 0, dy: 0, depuis: S.ecran }); S.recherchePlan = b.dataset.zone; return ouvrir("plan");
    case "plan-zones": P.zones = !P.zones; rendre(); return;
    case "plan-sorties": P.sorties = !P.sorties; rendre(); return;
    case "plan-entier": Object.assign(P, { e: 1, dx: 0, dy: 0 }); rendre(); return;
    case "cocher": S.choix.has(id) ? S.choix.delete(id) : S.choix.add(id); rendre(); return;
    case "valider-quetes": indiquerQuetes(S.choix); S.ecran = null; S.onglet = "OBJECTIFS"; break;
    case "effacer": Object.assign(M, ETAT_VIDE()); break;
    default: return;
  }
  enregistrer();
  rendre();
});
document.addEventListener("input", ev => {
  // Nom d'un build : enregistré sans tout redessiner (le champ garde la main).
  const rang = ev.target.dataset?.buildNom;
  if (rang != null) { changerBuild(+rang, x => { x.nom = ev.target.value.slice(0, 30); }); enregistrer(); return; }
  const c = ev.target.dataset?.champ;
  if (!c) return;
  S[c] = ev.target.value;
  rendre();
});
document.addEventListener("keydown", ev => {
  if (ev.key !== "Escape") return;
  if (S.celebration) S.celebration = null; else if (S.ecran) S.ecran = null; else return;
  rendre();
});

// ---- Sauvegarde : compte claude.ai (privé) si disponible, sinon ce navigateur ----
let stockage = "navigateur", docCompte = null, minuterie = null, ecriture = Promise.resolve();
function enregistrer() {
  const copie = JSON.parse(JSON.stringify(M));
  try { localStorage.setItem("carnet", JSON.stringify(copie)); } catch (_) {}
  if (!docCompte) return;
  clearTimeout(minuterie);
  minuterie = setTimeout(() => { ecriture = ecriture.then(() => docCompte.set({ etat: JSON.stringify(copie) })).catch(() => {}); }, 700);
}
// Version 0.10 (Memoire.nouveauDepart) : tout est fait d'office sauf ce qui est indiqué en cours. Ce qui avait été
// saisi avant (établis suivis, objectifs ajoutés à la main, réserve, liste de raid) repart de zéro, une seule fois.
function charger(texte) {
  let lu = {};
  try { lu = JSON.parse(texte) || {}; } catch (_) {}
  // État d'une version précédente : seuls les réglages (région) et les builds sont gardés.
  if ((lu.modele ?? 0) < 2) lu = Object.fromEntries(Object.entries({ region: lu.region, builds: lu.builds }).filter(([, v]) => v != null));
  for (const cle of ["reserve", "manuels", "raid", "raidTrouves"]) delete lu[cle];
  for (const cle of Object.keys(M)) delete M[cle];
  Object.assign(M, ETAT_VIDE(), lu);
}
