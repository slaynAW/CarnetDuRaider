    <span class="flex"><span class="nom" style="font:600 14px var(--titre)">Garder, recycler ou vendre${NB}?</span><br><span class="doux">Cherche un objet…</span></span></button>
  ${prochainRaid()}
  <button class="carte" data-action="onglet" data-onglet="CARTES" style="display:flex;flex-direction:column;gap:4px;padding:12px 16px"><b style="font:600 14px var(--titre);color:var(--cyan)">Conditions de la carte</b><span class="petit doux">Dans l'appli Android, les conditions en cours et à venir s'affichent ici avec leur minuteur.</span></button>
  ${mesObjectifs()}
  <p class="petit discret">Données du jeu ${echap(D.versionJeu)}, noms français officiels uniquement.</p>`;
}

// Où aller au prochain raid pour trouver ce qui manque (ProchainRaid, EcranAccueil.kt).
function prochainRaid() {
  const restants = aTrouver().filter(x => !x.trouve), conseil = conseilRaid(restants.map(x => x.id)), premiere = conseil.cartes[0];
  const nomC = id => cartes.get(id)?.nom ?? NOM_A_VERIFIER;
  const contenu = premiere ? `<strong>Va sur ${echap(nomC(premiere.carteId))}</strong>
      <b>${premiere.objets.length} de tes ${pluriel(restants.length, "objet", "objets")} à trouver${premiere.zones[0] ? ` · surtout ${echap(premiere.zones[0].zone)}` : ""}</b>
      ${conseil.parcours.length > 1 ? `<span class="petit">Puis ${echap(conseil.parcours.slice(1).map(e => nomC(e.carteId)).join(", "))} pour tout trouver.</span>` : ""}`
    : restants.length ? `<strong>Rien dans le butin des cartes</strong><span class="doux">Ce qu'il te faut s'obtient autrement${NB}: regarde l'onglet Raid.</span>`
    : objectifs().length ? `<strong>Rien à chercher en raid</strong><span class="doux">Tes objectifs en cours ne demandent aucun objet${NB}: valide-les quand c'est fait en jeu.</span>`
    : `<strong>Rien à chercher pour l'instant</strong><span class="doux">Indique ce que tu as en cours (quêtes, ateliers, projets, expéditions)${NB}: l'appli te dira où aller.</span>`;
  return `<button class="prochain ${premiere ? "plein" : ""}${premiere && FONDS.has(premiere.carteId) ? ` photo" style="--photo:url('fonds/${premiere.carteId}.webp')` : ""}" data-action="onglet" data-onglet="${restants.length || objectifs().length ? "RAID" : "OBJECTIFS"}"><small>TON PROCHAIN RAID</small>${contenu}</button>`;
}

// Où en sont les objectifs en cours (MesObjectifs, EcranAccueil.kt).
function mesObjectifs() {
  const objs = objectifs(), l = listeDeCourses();
  return `<button class="carte" data-action="onglet" data-onglet="OBJECTIFS" style="display:flex;flex-direction:column;gap:8px;padding:14px 16px">
    <b style="font:600 14px var(--titre);color:var(--vert)">Objectifs</b>
    ${objs.length ? `<span>${pluriel(objs.length, "objectif en cours", "objectifs en cours")} · ${pluriel(l.lignes.filter(x => !x.complet).length, "objet", "objets")} à trouver</span><span class="barre" style="--c:var(--vert)"><i style="width:${l.progression * 100}%"></i></span>`
      : `<span class="doux">Rien en cours. Touche ici pour indiquer tes quêtes, ateliers, projets ou expéditions en cours.</span>`}</button>`;
}

// Le verdict en un mot, pour la liste (PuceVerdict, EcranObjets.kt) : Garder (objectifs), Build, Vendre ou Recycler, encadré de sa couleur.
function puceVerdict(v) {
  const [texte, c] = v.type === "garder" ? ["Garder", "--vert"] : v.type === "build" ? ["Build", "--violet"] : v.sortie === "VENDRE" ? ["Vendre", "--or"] : ["Recycler", "--cyan"];
  return `<span class="pv" style="--p:var(${c})">${texte}</span>`;
}
// Pourquoi ce verdict, en une ligne : pour quel objectif ou quel build, ou ce qu'il rapporte.
function raisonVerdict(o, v) {
  if (v.type === "garder") return v.pour.length ? `${v.pour[0].o.type === "butin" ? "Dans ton butin recherché" : `Pour ${v.pour[0].libelle}`}${v.pour.length > 1 ? ` et ${pluriel(v.pour.length - 1, "autre", "autres")}` : ""}` : "Pour tes objectifs en cours";
  if (v.type === "build") return `Pour le build «${NB}${v.builds[0].build}${NB}»`;
  return v.sortie === "RECYCLER" ? `Ses matériaux valent ${valeurRecyclage(o)} pièces` : `Se vend ${o.valeur} pièces`;
}
// Filtres de la liste d'après le verdict (FiltreVerdict, Verdict.kt) : « Garder » compte aussi les objets des builds.
const FILTRES = [["TOUS", "Tous"], ["GARDER", "Garder"], ["VENDRE", "Vendre"], ["RECYCLER", "Recycler"]];
// « Recycler » seulement si au moins un objet rapporte plus recyclé que vendu (Conseiller.filtres) : jamais de filtre vide.
const filtresObjets = () => FILTRES.filter(([k]) => k !== "RECYCLER" || tous.some(o => meilleureSortie(o) === "RECYCLER"));
const accepte = (f, v) => f === "TOUS" || (f === "GARDER" ? v.type !== "inutile" : v.type === "inutile" && v.sortie === (f === "VENDRE" ? "VENDRE" : "RECYCLER"));

// Première lettre du nom, sans accent ; « # » pour un chiffre ou un signe.
const initiale = nom => { const c = normaliser(nom).trim()[0]?.toUpperCase(); return c && /[A-Z]/.test(c) ? c : "#"; };
const ligneObjet = (o, v) => `<button class="carte ligne" style="padding:7px 10px" data-action="fiche" data-id="${o.id}">${icone(o.id, 40)}
    <span class="flex" style="min-width:0"><span class="nom" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${echap(o.nom)}</span><span class="petit doux" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${echap(raisonVerdict(o, v))}</span></span>
    ${puceVerdict(v)}</button>`;
function ecranObjets() {
  const objs = objectifsDuRaid(), pourBuilds = aGarderBuilds();
  const resultats = (S.recherche.trim() ? rechercher(S.recherche, 200) : tous).map(o => [o, verdict(o.id, objs, pourBuilds)]);
  const r = resultats.filter(([, v]) => accepte(S.filtre, v));
  // Sans recherche ni filtre : ce qui est à garder d'abord, puis le reste par lettre.
  const parSections = !S.recherche.trim() && S.filtre === "TOUS";
  const aGarder = parSections ? r.filter(([, v]) => v.type !== "inutile") : [], reste = parSections ? r.filter(([, v]) => v.type === "inutile") : r;
  const lettres = [];
  if (parSections) for (const x of reste) { const l = initiale(x[0].nom); if (lettres.at(-1)?.[0] !== l) lettres.push([l, []]); lettres.at(-1)[1].push(x); }
  return `${bandeauSection("OBJETS", "Garder, vendre ou recycler")}
  <label class="recherche"><svg class="ic" viewBox="0 0 24 24" style="color:var(--or)"><path d="${ONGLETS[1][3]}"/></svg>
  <input id="recherche-objets" type="search" placeholder="Cherche un objet…" value="${echap(S.recherche)}" data-champ="recherche" autocomplete="off"></label>
  <div class="chips">${filtresObjets().map(([k, t]) => pf(`${t} · ${k === "TOUS" ? resultats.length : resultats.filter(([, v]) => accepte(k, v)).length}`, S.filtre === k, "--or", "filtre", k)).join("")}</div>
  ${!r.length ? `<p class="doux" style="margin:0">Aucun objet ne correspond.</p>` : !parSections ? `<p class="petit discret" style="margin:0">${pluriel(r.length, "objet trouvé", "objets trouvés")}</p>` : ""}
  <div id="liste-objets" style="display:flex;flex-direction:column;gap:6px">
  ${aGarder.length ? `${etiquette(`À garder · ${aGarder.length}`, "--vert", "h4")}${aGarder.map(([o, v]) => ligneObjet(o, v)).join("")}` : ""}
  ${parSections && reste.length ? `${etiquette(`À vendre ou recycler · ${reste.length}`, "--or", "h4")}${lettres.map(([l, xs]) => `<h5 class="lettre">${l}</h5>${xs.map(([o, v]) => ligneObjet(o, v)).join("")}`).join("")}` : reste.map(([o, v]) => ligneObjet(o, v)).join("")}</div>`;
}

// Fiche d'un objet, dans l'ordre où le joueur se pose les questions : verdict, à quoi il peut servir, où le trouver, ce qu'il rapporte.
function ecranFiche(id) {
  // Nom français officiel pas encore vérifié : l'objet est exclu des données, jamais affiché avec un nom inventé.
  if (!objets.has(id)) return `${retour("Objet", "--or")}<h3>${NOM_A_VERIFIER}</h3>
  <p class="doux" style="margin:0">Le nom français officiel de cet objet n'est pas encore vérifié${NB}: l'appli ne l'affiche pas, pour ne jamais inventer de nom. Il le sera dès qu'il aura été vérifié dans le jeu en français.</p>`;
  const o = objets.get(id), v = verdict(id), u = usages(id), vr = valeurRecyclage(o), rar = RARETES[o.rarete];
  const sortie = s => s === "RECYCLER" ? `recycle-le${NB}: ses matériaux valent ${vr} pièces, plus que l'objet (${o.valeur}).`
    : !o.recyclage.length ? `vends-le${NB}: il vaut ${o.valeur} pièces et ne se recycle pas.` : `vends-le${NB}: il vaut ${o.valeur} pièces, plus que ses matériaux (${vr}).`;
  const pourButin = v.type === "garder" ? v.pour.filter(b => b.o.type === "butin").length : 0;
  const c = v.type === "garder" ? { titre: "Garde-le", texte: `Il en faut encore ${v.manquant} pour ${pourButin === v.pour.length ? "ton butin recherché" : pourButin ? "tes objectifs en cours et ton butin recherché" : "tes objectifs en cours"}.`, fond: "--vert", pour: v.pour, builds: v.builds }
    : v.type === "build" ? { titre: "Garde-le", texte: v.builds.every(b => b.direct) ? "Il fait partie de tes builds." : "Il sert à fabriquer ce qu'il y a dans tes builds.", fond: "--violet", builds: v.builds }
    : { titre: v.sortie === "VENDRE" ? "Vends-le" : "Recycle-le", texte: `Aucun objectif en cours ni aucun build n'en a besoin${NB}: ${sortie(v.sortie)}`, fond: "--releve",
      note: u.aucun ? null : `Il peut quand même servir${NB}: ${resumeUsages(u).join(", ")}. Le détail est plus bas.` };
  const lignesBuilds = (c.builds || []).map(b => `<b>Build «${NB}${echap(b.build)}${NB}»${b.direct ? "" : `${NB}: pour ${echap(nomObjet(b.objet))}`}</b>`).join("");
  return `${retour("Objet", "--or")}
  <div class="ligne" style="gap:14px">${icone(id, 64)}<div class="flex"><h3 style="font-size:22px">${echap(o.nom)}</h3>
    <span class="petit doux">${echap([rar?.[0], o.categorie, `se vend ${o.valeur}`].filter(Boolean).join(" · "))}</span></div></div>
  <div class="verdict ${c.fond === "--releve" ? "neutre" : ""}" style="--v:var(${c.fond})"><small>VERDICT</small><h3>${c.titre}</h3><b>${c.texte}</b>
    ${c.pour?.length || c.builds?.length ? `<hr>${(c.pour || []).map(b => `<div class="ligne"><b class="flex">${echap(b.libelle)}</b><b>${Math.min(b.apporte, b.quantite)}/${b.quantite}</b></div>`).join("")}${lignesBuilds}` : ""}
    ${c.note ? `<span class="petit">${c.note}</span>` : ""}</div>
  <button class="bouton large contour" style="--c:var(--rouge);padding:12px" data-action="butin-ajouter" data-id="${id}">+ ${M.butin?.[id] ? `${BUTIN}${NB}: ${M.butin[id]} · en ajouter un` : "Ajouter au butin recherché"}</button>
  ${sectionUsages(u)}
  ${commentLObtenir(o)}
  ${section("Vente et recyclage", `Se vend ${o.valeur} pièces · ${o.recyclage.length ? "se recycle" : "ne se recycle pas"}`, `<p style="margin:0">Se vend ${o.valeur} pièces l'unité.</p>
  ${o.recyclage.length ? `<p class="doux" style="margin:0">Recyclage en (matériaux${NB}: ${vr} pièces)${NB}:</p>${o.recyclage.map(ligneQte).join("")}` : `<p class="doux" style="margin:0">Ne se recycle pas.</p>`}`)}`;
}

// À quoi peut servir l'objet (SectionUsages, EcranObjets.kt) : description officielle, puis tout ce qui le demande.
const abrege = (noms, n = 3) => noms.slice(0, n).join(", ") + (noms.length > n ? ` et ${noms.length - n} autres` : "");
// Une partie de la fiche, en accordéon (Section, EcranObjets.kt) : la fiche tient sur un écran.
const section = (titre, resume, contenu) => `<div>${accordeon(titre, titre, resume, "--or")}${ouvert(titre) ? `<div class="detail-accordeon">${contenu}</div>` : ""}</div>`;
function sectionUsages(u) {
  const ut = u.ut, ligne = (titre, texte) => `<div class="usage"><b>${titre}</b><br>${echap(texte)}</div>`;
  let h = "";
  if (u.description) h += `<p style="margin:0">${echap(u.description)}</p>`;
  if (u.aucun) h += `<p class="doux" style="margin:0">Rien d'autre que la vente ou le recyclage, d'après les données du jeu.</p>`;
  if (ut.cle) h += ligne("Clé", `Elle ouvre une porte ou une salle${NB}: voir la description.`);
  if (ut.equipement) h += ligne("Équipement", "Il s'utilise en raid.");
  if (u.ameliorations.length) h += ligne("Établis", u.ameliorations.map(a => `${a.etabli.nom} niveau ${a.niveau} (${a.quantite})`).join(" · "));
  if (u.quetes.length) h += ligne("Quêtes", u.quetes.map(q => `«${NB}${q.quete.nom}${NB}» (${q.quantite})`).join(" · "));
  if (u.projets.length) h += ligne("Projets", u.projets.map(p => `${p.projet.nom}, ${nomEtape(p.projet, p.etape)} (${p.quantite})`).join(" · "));
  if (ut.fabrication.length) {
    h += `<h5>Sert à fabriquer</h5>${ut.fabrication.slice(0, 6).map(f => `<button class="ligne" data-action="fiche" data-id="${f.objet}" style="text-align:left">${icone(f.objet, 32)}<span class="flex">${echap(nomObjet(f.objet))}</span><small class="doux">${echap(f.etabli ? (f.niveau ? `${f.etabli} · niv. ${f.niveau}` : f.etabli) : "en raid")}</small></button>`).join("")}`;
    if (ut.fabrication.length > 6) h += `<p class="petit doux" style="margin:0">Et ${pluriel(ut.fabrication.length - 6, "autre objet", "autres objets")}.</p>`;
  }
  if (ut.amplification.length) h += ligne("Amplification", ut.amplification.map(nomObjet).join(" · "));
  if (ut.aApprendre) { const quoi = [...ut.debloque.map(nomObjet), ...ut.meubles]; h += ligne("À apprendre", quoi.length ? `Il débloque${NB}: ${quoi.join(", ")}.` : "Il débloque une fabrication."); }
  if (ut.apparence) h += ligne("Apparence", "Une apparence à débloquer.");
  if (ut.recherches.length) h += ligne("Station de recherche", abrege(ut.recherches));
  if (ut.avantPoste.length) h += ligne("Avant-poste", abrege(ut.avantPoste));
  if (ut.echanges.length) h += ligne("Échanges", ut.echanges.slice(0, 4).map(e => `${e.commercant}${NB}: ${e.donne} contre ${e.quantite} × ${nomObjet(e.objet)}`).join(" · ") + (ut.echanges.length > 4 ? ` · et ${ut.echanges.length - 4} autres` : ""));
  if (ut.echangesValeur.length) h += ligne("Échanges", `${ut.echangesValeur.join(", ")} l'accepte en échange, au prix de sa valeur.`);
  const resume = resumeUsages(u).join(", ");
  return section("À quoi il peut servir", resume ? resume[0].toUpperCase() + resume.slice(1) : "Vente ou recyclage seulement", h);
}

// Comment obtenir l'objet (CommentLObtenir, EcranObjets.kt) : butin, commerçants, fabrication, recyclage, récompenses.
const sourcesRecyclage = (() => {
  const m = new Map();
  for (const o of D.objets) for (const q of o.recyclage) { if (!m.has(q.id)) m.set(q.id, []); m.get(q.id).push({ id: o.id, quantite: q.quantite }); }
  for (const l of m.values()) l.sort((a, b) => b.quantite - a.quantite || normaliser(nomObjet(a.id)).localeCompare(normaliser(nomObjet(b.id))));
  return id => m.get(id) || [];
})();
const ligneQte = q => `<div class="ligne">${icone(q.id, 32)}<span>${q.quantite} × ${echap(nomObjet(q.id))}</span></div>`;
const ligneIndice = (nom, sous, indice, action) => `<${action ? `button ${action}` : "div"} class="indice"><span class="ligne"><span class="flex">${echap(nom)}${sous ? `<br><small class="doux">${echap(sous)}</small>` : ""}</span><b>${indice}</b>${action ? `<small style="color:var(--cyan)">Plan ›</small>` : ""}</span><i><i style="width:${indice}%"></i></i></${action ? "button" : "div"}>`;
function commentLObtenir(o) {
  const ob = o.obtention || {}, rec = sourcesRecyclage(o.id);
  let h = "";
  if (o.lieux.length || ob.cartes?.length || ob.zones?.length) {
    let c = "";
    if (o.lieux.length) c += `<p style="margin:0">Dans les zones${NB}: ${echap(o.lieux.join(" · "))}</p>`;
    if (ob.cartes?.length) c += `<h5>Meilleures cartes</h5>${ob.cartes.map(x => ligneIndice(cartes.get(x.carte)?.nom ?? NOM_A_VERIFIER, null, x.indice)).join("")}`;
    if (ob.zones?.length) c += `<h5>Meilleures zones</h5>${ob.zones.slice(0, 5).map(z => ligneIndice(z.zone, cartes.get(z.carte)?.nom, z.indice, `data-action="plan-zone" data-id="${z.carte}" data-zone="${echap(z.zone)}"`)).join("")}
      <p class="petit doux" style="margin:0">Classement d'après les tables de butin du jeu (condition normale), 100 pour le meilleur endroit. Les taux de drop exacts ne sont pas publiés${NB}: le jeu tire le butin sur ses serveurs.</p>`;
    h += section("Où le trouver", ob.cartes?.length ? `Surtout ${cartes.get(ob.cartes[0].carte)?.nom ?? NOM_A_VERIFIER}` : o.lieux.join(" · "), c);
  }
  if (ob.achats?.length) h += section("Chez les commerçants", [...new Set(ob.achats.map(a => a.commercant))].join(" · "), ob.achats.map(a => {
    const prix = [a.pieces ? `${a.pieces} pièces` : "", a.valeurObjets ? `des objets valant ${a.valeurObjets} pièces` : ""].filter(Boolean).join(" + ");
    return `<div style="display:flex;flex-direction:column;gap:2px"><span>${echap(a.commercant)}${prix ? `${NB}: ${a.quantite > 1 ? `${a.quantite} pour ` : ""}${prix}` : ""}</span>${(a.objets || []).map(ligneQte).join("")}${a.limite ? `<small class="doux">${a.parJour ? `${a.limite} par jour au plus` : pluriel(a.limite, "achat possible", "achats possibles")}</small>` : ""}</div>`;
  }).join(""));
  const ou = f => f.etabli ? (f.niveau ? `${f.etabli} · niveau ${f.niveau}` : f.etabli) : "Pendant un raid";
  if (ob.fabrications?.length) h += section("Fabrication", ou(ob.fabrications[0]), ob.fabrications.map(f =>
    `<div style="display:flex;flex-direction:column;gap:2px"><span>${echap(f.quantite > 1 ? `${ou(f)} (en donne ${f.quantite})` : ou(f))}</span>${f.plan ? `<small class="doux">Plan à débloquer${NB}: ${echap(f.plan)}</small>` : ""}${f.ingredients.map(ligneQte).join("")}</div>`).join(""));
  if (rec.length) h += section("En recyclant", pluriel(rec.length, "objet en donne", "objets en donnent"), `${rec.slice(0, 6).map(q => `<button class="ligne" data-action="fiche" data-id="${q.id}" style="text-align:left">${icone(q.id, 32)}<span class="flex">${echap(nomObjet(q.id))}</span><small class="doux">en donne ${q.quantite}</small></button>`).join("")}${rec.length > 6 ? `<p class="petit doux" style="margin:0">Et ${pluriel(rec.length - 6, "autre objet", "autres objets")}.</p>` : ""}`);
  if (ob.recompenses?.length) h += section("En récompense", pluriel(ob.recompenses.length, "quête", "quêtes"), ob.recompenses.map(r => `<p style="margin:0">${echap(r)}</p>`).join(""));
  return h;
}

// Une carte pliée, en traits (IconeCarte, EcranCartes.kt).
const iconeCarte = c => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(${c})" stroke-width="2" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>`;
function ecranCartes() {
  const regions = [["EUROPE", "Europe"], ["AMERIQUE_DU_NORD", "Amérique du Nord"], ["AMERIQUE_DU_SUD", "Amérique du Sud"], ["ASIE", "Asie"], ["OCEANIE", "Océanie"]];
  return `${bandeauSection("CARTES", "Plans, zones et conditions")}
  <div class="ligne" style="gap:8px"><span class="petit discret flex">Calendrier officiel d'Embark${NB}: en direct dans l'appli Android</span>
    <select class="pastille-region" data-region aria-label="Région du calendrier">${regions.map(([k, n]) => `<option value="${k}" ${M.region === k ? "selected" : ""}>${n}</option>`).join("")}</select></div>
  <a class="lien" style="--c:var(--cyan);padding:0;align-self:flex-start" href="https://arcraiders.com/map-conditions" target="_blank" rel="noopener">Ouvrir le calendrier officiel</a>
  <div class="onglets-vue" role="tablist">${[[false, "En ce moment"], [true, "À venir"]].map(([v, t]) => `<button role="tab" aria-selected="${S.aVenir === v}" data-action="vue-cartes" data-id="${v}">${t}</button>`).join("")}</div>
  ${!S.aVenir ? D.cartes.map(c => `<button class="carte-photo" data-action="plan" data-id="${c.id}"${FONDS.has(c.id) ? ` style="--photo:url('fonds/${c.id}.webp')"` : ""}><span class="flex" style="display:flex;flex-direction:column;gap:6px"><strong>${echap(c.nom)}</strong><span class="petit discret">Conditions en cours${NB}: dans l'appli Android</span></span><span class="bouton-plan">${iconeCarte("--cyan")}Plan</span></button>`).join("")
    : `<div class="note-apercu petit doux">Dans l'appli Android, cette vue lit le calendrier officiel d'Embark${NB}: les prochaines heures et la prochaine fois de chaque condition, avec une cloche par ligne pour être prévenu. L'aperçu web ne peut pas joindre le site d'Embark.</div>
  ${etiquette("Toutes les conditions", "--cyan", "h4")}${[...D.conditions].sort((a, b) => b.majeure - a.majeure || a.nom.localeCompare(b.nom)).map(c => `<div class="carte ligne"><span class="puce" style="--r:var(${c.majeure ? "--rouge" : "--cyan"});background:none;padding:0"><i></i></span><span class="nom flex">${echap(c.nom)}</span></div>`).join("")}`}`;
}

// ---- Plan interactif d'une carte (EcranPlan.kt) ----
const P = { id: null, e: 1, dx: 0, dy: 0, zones: true, sorties: true };

// Recherche sur le plan (RecherchePlan.kt) : sans accents, articles ni pluriel ; mots du nom ou famille.
const MOTS_VIDES = new Set(["le", "la", "les", "l", "de", "des", "du", "d", "un", "une", "a", "au", "aux", "et", "ou", "en", "sur"]);
const FAMILLE_SORTIES = ["sortie", "extraction", "evacuation"];
const FAMILLES_TYPE = { trappe: ["trappe"], ascenseur: ["ascenseur"], metro: ["metro", "station"], conduit: ["conduit", "aeration"], telepherique: ["telepherique", "gondole", "terminal"] };
const FAMILLE_ARC = ["arc", "ennemi", "robot"], FAMILLE_ZONES = ["zone", "lieu"];
const motsPlan = t => normaliser(t).split(/[^\p{L}\p{N}]+/u).filter(m => m && !MOTS_VIDES.has(m)).map(m => m.length > 3 && /[sx]$/.test(m) ? m.slice(0, -1) : m);
function correspondPlan(cherches, nom, famille) {
  const mn = nom ? motsPlan(nom) : [];
  return cherches.every(m => famille.includes(m) || famille.some(f => m.length >= 3 && f.startsWith(m)) || mn.some(w => w.startsWith(m)));
}
function chercherPlan(plan, requete) {
  const mots = motsPlan(requete);
  if (!mots.length) return null;
  return {
    zones: plan.zones.filter(z => correspondPlan(mots, z.nom, FAMILLE_ZONES)),
    sorties: plan.sorties.filter(s => correspondPlan(mots, s.nom, [...FAMILLE_SORTIES, ...FAMILLES_TYPE[s.type]])),
    arcs: (plan.arcs || []).filter(a => correspondPlan(mots, a.nom, FAMILLE_ARC)),
  };
}
function resumePlan(r) {
  if (!r.zones.length && !r.sorties.length && !r.arcs.length) return "Rien de ce nom sur cette carte.";
  const parties = [];
  if (r.sorties.length) parties.push(pluriel(r.sorties.length, "sortie", "sorties"));
  if (r.zones.length) parties.push(pluriel(r.zones.length, "lieu", "lieux"));
  if (r.arcs.length === 1) parties.push(`${r.arcs[0].nom} · ${pluriel(r.arcs[0].points.length, "point d'apparition", "points d'apparition")}`);
  else if (r.arcs.length > 1) parties.push(`${r.arcs.length} ARC (${pluriel(r.arcs.reduce((n, a) => n + a.points.length, 0), "point", "points")})`);
  return parties.join(" · ");
}

function ecranPlan() {
  const c = cartes.get(P.id), r = chercherPlan(c.plan, S.recherchePlan);
  return `${retour("Plan", "--cyan")}<h3>${echap(c.nom)}</h3>
  <p class="petit doux" style="margin:0">Molette ou deux doigts pour zoomer, glisser pour déplacer, double-clic pour zoomer. Les petits lieux apparaissent en zoomant. Les conditions en cours et leur minuteur s'affichent ici dans l'appli Android.</p>
  <label class="recherche"><svg class="ic" viewBox="0 0 24 24" style="color:var(--cyan)"><path d="${ONGLETS[1][3]}"/></svg><input id="recherche-plan" type="search" placeholder="Trappes, bondisseurs, un lieu…" value="${echap(S.recherchePlan)}" data-champ="recherchePlan" autocomplete="off"></label>
  <div class="chips">${r ? `<span class="petit" style="align-self:center;${r.zones.length || r.sorties.length || r.arcs.length ? "" : "color:var(--texte-doux)"}">${echap(resumePlan(r))}</span>`
    : `<button class="chip" aria-pressed="${P.zones}" data-action="plan-zones">Zones</button>${c.plan.sorties.length ? `<button class="chip" aria-pressed="${P.sorties}" data-action="plan-sorties">Sorties</button>` : ""}<button class="chip" data-action="plan-chercher" data-id="trappes">Trappes</button>${(c.plan.arcs || []).map(a => `<button class="chip" data-action="plan-chercher" data-id="${echap(a.nom)}">${echap(a.nom)}</button>`).join("")}`}${P.e > 1 ? `<button class="lien" style="--c:var(--cyan)" data-action="plan-entier">Vue entière</button>` : ""}</div>
  <div class="plan-vue" id="plan-vue"><img id="plan-img" src="cartes/${c.id}.webp" alt="Plan en jeu${NB}: ${echap(c.nom)}" draggable="false"><div id="plan-calque"></div></div>`;
}
function placerPlan() {
  const vue = document.getElementById("plan-vue"), img = document.getElementById("plan-img"), calque = document.getElementById("plan-calque");
  if (!vue) return;
  const c = cartes.get(P.id), w = vue.clientWidth, h = vue.clientHeight, cote = Math.min(w, h), ox = (w - cote) / 2, oy = (h - cote) / 2;
  // Le plan couvre toujours le centre de la vue.
  P.dx = Math.min(Math.max(P.dx, w / 2 - ox - cote * P.e), w / 2 - ox);
  P.dy = Math.min(Math.max(P.dy, h / 2 - oy - cote * P.e), h / 2 - oy);
  img.style.width = cote + "px";
  img.style.transform = `translate(${ox + P.dx}px, ${oy + P.dy}px) scale(${P.e})`;
  const ecran = (u, v) => [ox + P.dx + u * cote * P.e, oy + P.dy + v * cote * P.e];
  // Sans recherche : zones (les petites en zoomant) et sorties selon les interrupteurs ; avec : ce qui est trouvé.
  const r = chercherPlan(c.plan, S.recherchePlan);
  const zones = r ? r.zones : P.zones ? c.plan.zones.filter(z => z.detail === 0 || (z.detail === 1 && P.e >= 1.8) || (z.detail === 2 && P.e >= 3)) : [];
  const sorties = r ? r.sorties : P.sorties ? c.plan.sorties : [];
  let html = "";
  if (r) for (const a of r.arcs) for (const [u, v] of a.points) { const [x, y] = ecran(u, v); html += `<i class="arc" style="left:${x}px;top:${y}px"></i>`; }
  for (const s of sorties) { const [x, y] = ecran(s.x, s.y); html += `<i class="sortie" style="left:${x}px;top:${y}px"></i>`; if (s.nom && (r || P.e >= 3)) html += `<span class="etq" style="left:${x}px;top:${y + 20}px;color:var(--cyan)">${echap(s.nom)}</span>`; }
  for (const z of zones) { const [x, y] = ecran(z.x, z.y); html += `<span class="etq ${z.detail === 0 ? "grande" : ""}" style="left:${x}px;top:${y}px">${echap(z.nom)}</span>`; }
  calque.innerHTML = html;
}
function zoomer(nouvelle, px, py) {
  const vue = document.getElementById("plan-vue"), w = vue.clientWidth, h = vue.clientHeight, cote = Math.min(w, h), ox = (w - cote) / 2, oy = (h - cote) / 2;
  nouvelle = Math.min(Math.max(nouvelle, 1), 6);
  const u = (px - ox - P.dx) / P.e, v = (py - oy - P.dy) / P.e;
  P.dx = px - ox - u * nouvelle; P.dy = py - oy - v * nouvelle; P.e = nouvelle;
  if (P.e === 1) { P.dx = 0; P.dy = 0; }
  placerPlan();
}
function brancherPlan() {
  const vue = document.getElementById("plan-vue");
  if (!vue) return;
  const doigts = new Map(); let avant = null;
  const local = ev => { const r = vue.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
  vue.addEventListener("pointerdown", ev => { vue.setPointerCapture(ev.pointerId); doigts.set(ev.pointerId, local(ev)); avant = null; });
  vue.addEventListener("pointermove", ev => {
    if (!doigts.has(ev.pointerId)) return;
    doigts.set(ev.pointerId, local(ev));
    const pts = [...doigts.values()];
    if (pts.length === 1) { const [x, y] = pts[0]; if (avant) { P.dx += x - avant.x; P.dy += y - avant.y; placerPlan(); } avant = { x, y }; }
    else if (pts.length >= 2) {
      const [a, b] = pts, mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (avant?.d) { P.dx += mx - avant.x; P.dy += my - avant.y; zoomer(P.e * d / avant.d, mx, my); }
      avant = { x: mx, y: my, d };
    }
  });
  const fin = ev => { doigts.delete(ev.pointerId); avant = null; };
  vue.addEventListener("pointerup", fin); vue.addEventListener("pointercancel", fin);
  vue.addEventListener("wheel", ev => { ev.preventDefault(); const [x, y] = local(ev); zoomer(P.e * (ev.deltaY < 0 ? 1.25 : 0.8), x, y); }, { passive: false });
  vue.addEventListener("dblclick", ev => { const [x, y] = local(ev); zoomer(P.e >= 4.5 ? 1 : P.e * 2, x, y); });
  placerPlan();
}
addEventListener("resize", () => { if (S.ecran === "plan") placerPlan(); });

// ---- Onglet Objectifs (EcranObjectifs.kt) : tout est fait d'office, sauf ce que le joueur indique en cours.
// Au départ, il n'y a que les quatre boutons ; ce qui est en cours s'affiche dessous ----
const CHOIX_EN_COURS = [["quetes", "Indiquer mes quêtes en cours", "Quêtes"], ["ateliers", "Indiquer mes ateliers en cours", "Ateliers"],
  ["projets", "Indiquer mes projets en cours", "Projets"], ["expeditions", "Indiquer mes expéditions en cours", "Expéditions"]];
// Le groupe d'un objectif dans l'onglet Objectifs : ateliers, projets, Expéditions, puis quêtes.
const groupeObjectif = o => o.type === "etabli" ? "ateliers" : o.type === "projet" ? (estExpedition(projets.get(o.id) || { id: "" }) ? "expeditions" : "projets") : "quetes";
const ORDRE_GROUPES = [["ateliers", "Ateliers"], ["projets", "Projets"], ["expeditions", "Expéditions"], ["quetes", "Quêtes"]];
function nombreEnCours(choix) {
  if (choix === "quetes") return quetesEnCours().length;
  if (choix === "ateliers") return D.etablis.filter(e => niveauEnCours(e) != null).length;
  return (D.projets || []).filter(p => estExpedition(p) === (choix === "expeditions") && etapeEnCours(p) != null).length;
}
const coche = `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
function ecranObjectifs() {
  const l = listeDeCourses(), objs = objectifs();
  const total = l.lignes.reduce((n, x) => n + x.besoin, 0), apporte = l.lignes.reduce((n, x) => n + x.apporte, 0), aTrouverN = l.lignes.filter(x => !x.complet).length;
  return `${bandeauSection("OBJECTIFS", objs.length ? pluriel(objs.length, "objectif en cours", "objectifs en cours") : "Rien en cours")}
  <div class="tuiles">${CHOIX_EN_COURS.map(([cle, bouton, court]) => { const n = nombreEnCours(cle); return `<button class="tuile" style="--c:var(${n ? "--vert" : "--texte-discret"})" data-action="en-cours" data-id="${cle}" aria-label="${bouton}, ${n} en cours"><b>${n}</b><span>${court}</span></button>`; }).join("")}</div>
  ${!objs.length ? `<p class="doux" style="margin:0">Tout ce que tu n'indiques pas est considéré comme déjà fait. Touche une tuile pour indiquer ce que tu as en cours.</p>` : `
  <button class="carte ligne" data-action="onglet" data-onglet="RAID" style="padding:12px 14px"><span class="flex"><b style="font:600 14px var(--titre)">${aTrouverN ? `${pluriel(aTrouverN, "objet", "objets")} à trouver en raid` : "Rien à trouver en raid"}</b>${total ? `<br><span class="petit doux">${apporte} sur ${total} rapportés</span>` : ""}</span>
    <span class="bouton" style="--c:var(--rouge);padding:9px 12px;font-size:13px">Préparer le raid ›</span></button>
  ${ORDRE_GROUPES.map(([g, titre]) => { const dedans = objs.filter(o => groupeObjectif(o) === g); return dedans.length ? `${etiquette(titre, "--vert", "h4")}${dedans.map(carteObjectif).join("")}` : ""; }).join("")}`}`;
}
// Un objectif en cours (CarteObjectif) : la même carte dans l'onglet Objectifs et dans l'onglet Raid ; les objets
// demandés en pastilles (icône, rapportés/voulus).
function carteObjectif(o) {
  const q = o.type === "quete" ? quetes.get(o.id) : null, autres = o.type === "projet" ? projets.get(o.id)?.etapes[o.etape]?.autresObjectifs : 0, b = besoins(o), vide = !b.length;
  const voulu = b.reduce((n, x) => n + x.quantite, 0), rapporte = b.reduce((n, x) => n + Math.min(apporteDe(o, x.id), x.quantite), 0);
  const detail = q?.commercant || (vide ? `Rien à rapporter${NB}: valide-le quand c'est fait en jeu.` : "");
  return `<div class="carte" style="display:flex;flex-direction:column;gap:8px"><span class="ligne" style="align-items:flex-start;gap:8px"><span class="flex"><span class="nom">${echap(libelle(o))}</span>${detail ? `<br><span class="petit doux" style="font-weight:600">${echap(detail)}</span>` : ""}</span>${voulu ? `<b style="font:600 14px var(--titre);color:var(--vert);font-variant-numeric:tabular-nums">${rapporte}/${voulu}</b>` : ""}</span>
    ${voulu ? `<span class="barre" style="height:4px;--c:var(--vert)"><i style="width:${rapporte / voulu * 100}%"></i></span>
    <div class="pastilles">${b.map(x => { const n = Math.min(apporteDe(o, x.id), x.quantite); return `<span class="pastille-objet${n >= x.quantite ? " complet" : ""}" aria-label="${echap(nomObjet(x.id))}${NB}: ${n}/${x.quantite}">${icone(x.id, 24)}${n}/${x.quantite}</span>`; }).join("")}</div>` : ""}
    ${autres ? `<span class="petit doux">Et d'autres conditions à remplir en jeu.</span>` : ""}
    <button class="valider contour" data-action="valider-objectif" data-cle="${cleObjectif(o)}" aria-label="C'est fait${NB}: ${echap(libelle(o))}">${coche}C'est fait</button></div>`;
}

// Mes quêtes en cours : cochées dans le journal de quêtes ; tout le reste est fait d'office.
function ecranQuetes() {
  if (!S.choix) {
    S.choix = new Set(quetesEnCours().map(q => q.id));
    // Ordre figé à l'ouverture (cochées d'abord) : une quête cochée ne saute pas sous le doigt.
    S.ordreQuetes = [...histoire].sort((a, b) => (!S.choix.has(a.id)) - (!S.choix.has(b.id)) || (a.commercant || "").localeCompare(b.commercant || "") || a.nom.localeCompare(b.nom));
  }
  const cle = normaliser(S.rechercheQuetes);
  const liste = S.ordreQuetes.filter(q => !cle || normaliser(q.nom).includes(cle) || normaliser(q.commercant || "").includes(cle));
  return `${enTeteChoix("Mes quêtes en cours", pluriel(S.choix.size, "quête cochée", "quêtes cochées"))}
  <p class="petit discret" style="margin:0">Coche les quêtes en cours dans ton journal de quêtes. Les autres sont considérées comme faites${NB}; celles qui viennent après s'ajouteront toutes seules.</p>
  <label class="recherche"><input id="recherche-quetes" type="search" placeholder="Chercher une quête ou un commerçant" value="${echap(S.rechercheQuetes)}" data-champ="rechercheQuetes" autocomplete="off"></label>
  ${liste.map(q => { const c = S.choix.has(q.id), detail = [q.commercant, detailCout(q.objets)].filter(Boolean).join(" · "); return `<button class="carte ligne" data-action="cocher" data-id="${q.id}" aria-pressed="${c}"${c ? ` style="background:color-mix(in srgb, var(--vert) 12%, var(--surface))"` : ""}><span class="case ${c ? "coche" : ""}">${c ? "✓" : ""}</span>
    <span class="flex"><span class="nom">${echap(q.nom)}</span>${detail ? `<br><span class="petit doux">${detail}</span>` : ""}</span></button>`; }).join("")}
  ${actionFixe(`Valider · ${pluriel(S.choix.size, "quête", "quêtes")}`, "--vert", "valider-quetes")}`;
}

// Le balayage ne joue qu'au passage à « Terminé » (S.balayage, le temps du passage de la ligne), puis la carte se
// replie (S.repli, effacé au rendu suivant) ; jamais à l'ouverture de la liste.
function passerTermine(cle) {
  S.balayage = cle; S.ouverts.delete(`fin:${cle}`);
  setTimeout(() => { if (S.balayage === cle) { S.balayage = null; S.repli = cle; rendre(); } }, 760);
}
// Carte d'un établi ou d'un projet (CarteChoix, EcranObjectifs.kt) : nom, état, piste ; terminé, une ligne sobre
// « ✓ Terminé » et « Modifier », qui rouvre la piste.
function carteChoix(cle, nom, fin, etat, contenu) {
  if (fin && S.balayage !== cle) {
    const o = ouvert(`fin:${cle}`);
    return `<div class="carte ligne-fin${S.repli === cle ? " repli" : ""}"><div class="ligne" style="min-height:44px;gap:8px"><span class="nom flex">${echap(nom)}</span><span class="fin" style="color:var(--vert);font:600 13px var(--titre)">✓ Terminé</span>
      <button class="lien" style="--c:var(--texte-doux);font-weight:400" data-action="basculer" data-id="fin:${cle}" aria-expanded="${o}" aria-label="${o ? "Fermer" : "Modifier"}${NB}: ${echap(nom)}">${o ? "Fermer" : "Modifier"}</button></div>
      ${o ? `<div style="display:flex;flex-direction:column;gap:8px;padding:0 8px 10px 0">${contenu}</div>` : ""}</div>`;
  }
  return `<div class="carte choix${fin ? " balaie" : ""}" style="display:flex;flex-direction:column;gap:10px"><div class="ligne"><span class="nom flex">${echap(nom)}</span>${fin ? "" : etiquette(etat || "Pas en cours", etat ? "--vert" : "--texte-discret")}</div>${contenu}</div>`;
}
// En-tête des écrans de choix : retour, titre et résumé d'une ligne.
const enTeteChoix = (titre, resume) => `<div class="ligne" style="gap:4px"><button class="retour" data-action="fermer" aria-label="Retour aux objectifs"><svg class="ic" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button><span class="flex"><h3 style="font-size:22px">${titre}</h3><span class="petit doux">${echap(resume)}</span></span></div>`;
// Piste « — 1 2 3 ✓ » (Piste, EcranObjectifs.kt) : seul le choix est plein de vert.
const piste = (nom, choix, choisi, fin, action, actionFin, id) => `<div class="piste" role="radiogroup" aria-label="${echap(nom)}">
  <button role="radio" aria-checked="${choisi == null && !fin}" data-action="${action}" data-id="${id}" data-n="" aria-label="${echap(nom)}${NB}: rien en cours">—</button>
  ${choix.map(([n, court, desc], i) => `<button role="radio" aria-checked="${choisi === n}" data-action="${action}" data-id="${id}" data-n="${n}" aria-label="${echap(nom)}${NB}: ${echap(desc)}">${court}</button>`).join("")}
  <button role="radio" aria-checked="${fin}" data-action="${actionFin}" data-id="${id}" aria-label="${echap(nom)}${NB}: terminé">✓</button></div>`;
// Mes ateliers en cours : le niveau en cours de chaque établi, « Aucun » ou « Terminé ». Chaque choix s'applique tout de suite.
function ecranAteliers() {
  const liste = [...D.etablis].sort((a, b) => a.nom.localeCompare(b.nom));
  const enCours = liste.filter(e => niveauEnCours(e) != null).length, finis = liste.filter(etabliTermine).length;
  return `${enTeteChoix("Mes ateliers en cours", `${enCours} en cours · ${pluriel(finis, "terminé", "terminés")}`)}
  <p class="petit discret" style="margin:0">Touche le niveau que tu améliores. Quand tout est rapporté, le suivant s'ajoute tout seul.</p>
  ${liste.map(e => { const n = niveauEnCours(e), fin = etabliTermine(e), niv = [...e.niveaux].sort((a, b) => a.niveau - b.niveau);
    return carteChoix(`etabli:${e.id}`, e.nom, fin, n != null ? `Niveau ${n} en cours` : null,
      `${piste(e.nom, niv.map(x => [x.niveau, `${x.niveau}`, `niveau ${x.niveau} en cours`]), n, fin, "niveau-en-cours", "etabli-termine", e.id)}
    ${n != null ? `<span class="petit doux">Il faut${NB}: ${detailAvancement({ type: "etabli", id: e.id, niveau: n })}</span>` : ""}`); }).join("")}`;
}

// Mes projets (ou mes Expéditions) en cours : l'étape en cours de chacun, sur une piste.
function ecranProjets(expeditions) {
  const liste = (D.projets || []).filter(p => estExpedition(p) === expeditions);
  const enCours = liste.filter(p => etapeEnCours(p) != null).length, finis = liste.filter(projetTermine).length;
  return `${enTeteChoix(expeditions ? "Mes expéditions en cours" : "Mes projets en cours", `${enCours} en cours · ${pluriel(finis, "terminé", "terminés")}`)}
  <p class="petit discret" style="margin:0">Touche l'étape en cours. Quand tout est rapporté, la suivante s'ajoute toute seule.</p>
  ${liste.map(p => { const e = etapeEnCours(p), et = e != null ? p.etapes[e] : null, fin = projetTermine(p);
    return carteChoix(`projet:${p.id}`, p.nom, fin, e != null ? `Étape ${e + 1} en cours` : null, `${piste(p.nom, p.etapes.map((_, i) => [i, `${i + 1}`, `${nomEtape(p, i)} en cours`]), e, fin, "etape-en-cours", "projet-termine", p.id)}
    ${et ? `<span class="petit doux" style="font-weight:600">${echap(nomEtape(p, e))}</span>${et.cout.length ? `<span class="petit doux">Il faut${NB}: ${detailAvancement({ type: "projet", id: p.id, etape: e })}</span>` : ""}${et.autresObjectifs ? `<span class="petit doux">Et d'autres conditions à remplir en jeu.</span>` : ""}` : ""}`); }).join("")}`;
}

// ---- Où aller pour trouver ce qui manque (PreparationRaid.kt) ----
function conseilRaid(ids) {
  const cherches = [...new Set(ids)].map(id => objets.get(id)).filter(Boolean);
  const sansButin = cherches.filter(o => !o.obtention?.cartes?.length).map(o => o.id);
  const parCarte = new Map();
  for (const o of cherches) for (const c of o.obtention?.cartes || []) { if (!parCarte.has(c.carte)) parCarte.set(c.carte, []); parCarte.get(c.carte).push([o.id, c.indice]); }
  const cartesC = [...parCarte].map(([carteId, l]) => {
    const pz = new Map();
    for (const o of cherches) for (const z of (o.obtention?.zones || []).filter(z => z.carte === carteId)) { if (!pz.has(z.zone)) pz.set(z.zone, []); pz.get(z.zone).push([o.id, z.indice]); }
    const zones = [...pz].map(([zone, zl]) => ({ zone, score: zl.reduce((s, x) => s + x[1], 0) / 100, objets: [...zl].sort((a, b) => b[1] - a[1]).map(x => x[0]) }))
      .sort((a, b) => b.objets.length - a.objets.length || b.score - a.score || a.zone.localeCompare(b.zone)).slice(0, 4);
    return { carteId, score: l.reduce((s, x) => s + x[1], 0) / 100, objets: [...l].sort((a, b) => b[1] - a[1]).map(x => x[0]), meilleurePour: l.filter(x => x[1] === 100).map(x => x[0]), zones };
  }).sort((a, b) => b.score - a.score || b.objets.length - a.objets.length || a.carteId.localeCompare(b.carteId));
  // Parcours : à chaque tour, la carte qui apporte le plus de chances sur les objets pas encore couverts.
  const restants = new Set(cartesC.flatMap(c => c.objets)), parcours = [];
  while (restants.size && parcours.length < 3) {
    let meilleur = null;
    for (const [carteId, l] of parCarte) {
      if (parcours.some(e => e.carteId === carteId)) continue;
      const apport = l.filter(x => restants.has(x[0])), somme = apport.reduce((s, x) => s + x[1], 0);
      if (!meilleur || somme > meilleur.somme || (somme === meilleur.somme && (apport.length > meilleur.apport.length || (apport.length === meilleur.apport.length && carteId < meilleur.carteId)))) meilleur = { carteId, apport, somme };
    }
    if (!meilleur || !meilleur.apport.length) break;
    parcours.push({ carteId: meilleur.carteId, objets: [...meilleur.apport].sort((a, b) => b[1] - a[1]).map(x => x[0]) });
    for (const [id] of meilleur.apport) restants.delete(id);
  }
  return { cartes: cartesC, sansButin, parcours };
}
function autreMoyen(o) {
  const ob = o.obtention || {};
  if (o.lieux.includes("ARC")) return "Sur les ARC détruits";
  const a = ob.achats?.[0];
  if (a) return `Chez ${a.commercant}${a.pieces ? ` (${a.pieces} pièces)` : a.valeurObjets ? " (en échange d'objets)" : ""}`;
  const f = ob.fabrications?.[0];
  if (f) return `Fabrication${NB}: ${f.etabli ? (f.niveau ? `${f.etabli} · niveau ${f.niveau}` : f.etabli) : "pendant un raid"}`;
  const r = sourcesRecyclage(o.id)[0];
  if (r) return `En recyclant${NB}: ${nomObjet(r.id)}`;
  if (ob.recompenses?.length) return `En récompense${NB}: ${ob.recompenses[0]}`;
  return "Aucune source connue dans les données du jeu.";
}

    <button class="icone-bouton" style="color:var(${b.prefere ? "--violet" : "--texte-discret"})" data-action="build-prefere" data-id="${i}" aria-pressed="${b.prefere}" aria-label="${b.prefere ? "Ne plus en faire mon build préféré" : "En faire mon build préféré"}">${ETOILE}</button>

  ${GROUPES_CASES.map(([titre, cles]) => `${etiquette(titre, "--violet", "h4")}${grilleCases(b, i, cles.map(k => CASES.find(c => c[0] === k)))}`).join("")}
  ${accordeon(`build:${i}:autres`, "Autres", `${autres.filter(c => b.objets[c[0]]).length} sur ${autres.length}`, "--violet")}
  ${ouvert(`build:${i}:autres`) ? grilleCases(b, i, autres) : ""}
  ${mat.length ? `<div class="carte materiaux"><div class="ligne"><b class="flex" style="font:600 15px var(--titre)">Pour le fabriquer</b><span class="petit doux">${pluriel(mat.length, "matériau", "matériaux")}</span></div>
    <div class="pastilles">${(tous6 ? mat : mat.slice(0, 6)).map(([id, n]) => `<span class="pastille-objet">${icone(id, 24)}${echap(nomObjet(id))} ×${n}</span>`).join("")}</div>
    ${mat.length > 6 ? `<button class="lien" style="--c:var(--violet);align-self:flex-start;padding:0" data-action="basculer" data-id="build:${i}:materiaux">${tous6 ? "Voir moins" : `Voir les ${mat.length} matériaux`}</button>` : ""}
    <span class="petit discret">Ces objets passent en «${NB}Garder${NB}» dans la liste des objets.</span></div>`
  : !Object.keys(b.objets).length ? `<p class="doux carte" style="margin:0;background:none;border:1.5px dashed var(--trait)">Touche une case pour choisir un objet. Ce qu'il faut pour le fabriquer s'affiche ici.</p>` : ""}`;
}
// Choix de l'objet d'une case : seulement les objets de son emplacement (EcranChoixObjetBuild).

}

// ---- Animation de fin de retour de raid (CelebrationRaid.kt). Un objectif terminé de lui-même est validé à
// la manière d'ARC Raiders : une bande verte balaie l'écran, « OBJECTIF TERMINÉ » s'y resserre, puis chaque
// objectif reçoit son tampon « VALIDÉ ». Quand toute la liste est trouvée, une gerbe de bandes ----
const GERBE = (() => {
  let g = 7;
  const hasard = () => (g = (g * 16807) % 2147483647) / 2147483647;
  const couleurs = ["--cyan", "--vert", "--or", "--rouge"];
  return Array.from({ length: 40 }, (_, i) => {
    const a = hasard() * 2 * Math.PI, v = 30 + hasard() * 45;
    return `<i style="--c:var(${couleurs[i % 4]});--dx:${(Math.cos(a) * v).toFixed(1)}vmin;--dy:${(Math.sin(a) * v).toFixed(1)}vmin;--r:${Math.round(180 + hasard() * 360)}deg"></i>`;
  }).join("");
})();
function celebration() {
  const b = S.celebration;
  if (!b) return "";
  const restants = aTrouver().length, objectifsMontres = b.termines.slice(0, 3), montres = b.atteints.slice(0, 5);
  const autres = b.termines.length - objectifsMontres.length + b.atteints.length - montres.length;
  const nomTitre = b.termines.length ? (b.termines.length > 1 ? "Objectifs terminés" : "Objectif terminé") : b.termine ? "Raid terminé" : "Objets trouvés";
  const titre = b.termines.length
    ? `<div class="banniere"><h2>${nomTitre.toUpperCase()}</h2></div><p class="sous ${b.termine ? "" : "doux"}" style="font-size:15px">${b.termine ? `Raid terminé, objets trouvés${NB}! ` : "Tout est rapporté. "}La suite s'ajoute à tes objectifs.</p>`
    : b.termine ? `<svg class="pop" width="70" height="40" viewBox="0 0 35 20" aria-hidden="true"><path d="M0 20h5l7.2-20h-5z" fill="#3CC4D8"/><path d="M7.5 20h5l7.2-20h-5z" fill="#6CCB5F"/><path d="M15 20h5l7.2-20h-5z" fill="#F2B233"/><path d="M22.5 20h5l7.2-20h-5z" fill="#F0544A"/></svg>
      <h2 class="pop">Raid terminé</h2><p class="sous" style="color:var(--vert)">Objets trouvés${NB}!</p>`
    : `<h2 class="pop" style="color:var(--vert)">Objets trouvés</h2><p class="sous doux">${restants ? `Encore ${pluriel(restants, "objet", "objets")} à trouver.` : "Tout est trouvé."}</p>`;
  // Les objectifs terminés d'abord (avec leur tampon), puis les objets qui ont atteint leur nombre.
  const lignes = [
    ...objectifsMontres.map((o, i) => [`<span class="flex"><span class="nom">${echap(libelle(o))}</span><br><span class="petit" style="color:var(--vert);font-weight:600">Tout est rapporté</span></span>
      <span class="tampon" style="animation-delay:${900 + i * 250}ms">VALIDÉ</span>`, "objectif-termine"]),
    ...montres.map(a => [`<span class="coche-icone">${icone(a.id, 44)}<i>✓</i></span>
      <span class="flex"><span class="nom">${echap(nomObjet(a.id))}</span><br><span class="petit doux">${Math.min(a.trouves, a.voulu)}/${a.voulu} · ${echap(pourQui(a))}</span></span>`, ""]),
  ].map(([contenu, classe], i) => `<div class="carte ligne atteint ${classe}" style="animation-delay:${350 + i * 150}ms">${contenu}</div>`);
  return `<div class="celebration" data-action="fin-celebration" role="dialog" aria-modal="true" aria-label="${nomTitre}" tabindex="-1">
    ${b.termine ? `<div class="gerbe" aria-hidden="true">${GERBE}</div>` : ""}
    <div class="celebration-in" aria-live="polite">${titre}
      <div class="atteints">${lignes.join("")}</div>
      ${autres > 0 ? `<p class="petit doux" style="margin:0">Et ${pluriel(autres, "autre", "autres")}.</p>` : ""}
      <p class="petit discret" style="margin:8px 0 0">Touche l'écran pour continuer</p>
    </div></div>`;
}

// ---- Validation en une touche, annulable (BandeauValidation, CarnetApp.kt) ----
function bandeauValidation() {
  const v = S.validation;
  if (!v || S.celebration) return "";
  const detail = v.objetsNotes ? `${pluriel(v.objetsNotes, "objet noté", "objets notés")}${v.termines.length ? `, ${pluriel(v.termines.length, "objectif terminé", "objectifs terminés")}` : ""}.`
    : v.termines.length ? `Tout était rapporté aussi pour${NB}: ${v.termines.map(libelle).join(", ")}.` : "La suite s'ajoute à tes objectifs.";
  return `<div class="bandeau-validation" role="status"><div><div class="flex" style="min-width:0">${etiquette(v.objetsNotes && !v.termines.length ? "Validé" : "Objectif terminé", "--sur-couleur")}<br><b style="font:600 14px var(--titre)">${echap(v.titre)}</b><br><span class="petit">${echap(detail)}</span></div>
  <button class="lien" data-action="annuler-validation">Annuler</button></div></div>`;
}
let minuterieValidation = null;
function montrerValidation(v) {
  S.validation = { objetsNotes: 0, termines: [], ...v };
  clearTimeout(minuterieValidation);
  minuterieValidation = setTimeout(() => { S.validation = null; rendre(); }, 8000);
}
// Objectif fait en jeu (« C'est fait »), même sans tout avoir noté (une quête sans objet à rapporter, par
// exemple) : la suite s'ajoute, ce qui avait été rapporté pour lui est oublié ; la suite peut être déjà complète.
function valider(o) {
  const avant = JSON.stringify(M);
  terminerObjectif(o);
  delete M.apports[cleObjectif(o)];
  montrerValidation({ titre: libelle(o), avant, termines: terminerLesComplets() });
}


// ---- Rendu ----
let celebrationAffichee = null;
// Bandeau replié dès que la page défile (au-delà de 24 px), déplié tout en haut (sous 4 px) : pas d'aller-retour.
let replie = false;
addEventListener("scroll", () => {
  const r = replie ? scrollY > 4 : scrollY > 24;
  if (r !== replie) { replie = r; document.querySelector(".section")?.classList.toggle("replie", r); }
}, { passive: true });
function rendre() {
  // Retour de raid quitté (Valider, retour, autre onglet, réglages) : il est validé.
  if (S.raid && S.ecran !== "raid") validerRetour();
  const champ = document.activeElement?.dataset?.champ, pos = document.activeElement?.selectionStart;
  const e = S.ecran;
  document.getElementById("contenu").innerHTML =
    e?.type === "fiche" ? ecranFiche(e.id) : e === "plan" ? ecranPlan() : e === "quetes" ? ecranQuetes() : e === "ateliers" ? ecranAteliers()
    : e === "projets" ? ecranProjets(false) : e === "expeditions" ? ecranProjets(true) : e === "choix-build" ? ecranChoixBuild()
    : e === "raid" ? ecranRaid() : e === "reglages" ? ecranReglages() : e === "choix-butin" ? ecranChoixButin()
    : { ACCUEIL: ecranAccueil, OBJETS: ecranObjets, RAID: ecranOngletRaid, CARTES: ecranCartes, OBJECTIFS: ecranObjectifs, BUILDS: ecranBuilds }[S.onglet]();
  document.getElementById("nav").innerHTML = ONGLETS.map(([k, t, c, d]) => `<button data-action="onglet" data-onglet="${k}" style="--c:var(${c})" ${S.onglet === k && !S.ecran ? 'aria-current="page"' : ""}><span class="pastille"><svg class="ic" viewBox="0 0 24 24"><path d="${d}"/></svg></span>${t}</button>`).join("");
  document.getElementById("dialogue").innerHTML = bandeauValidation();
  if (S.celebration !== celebrationAffichee) {
    celebrationAffichee = S.celebration;
    document.getElementById("celebration").innerHTML = celebration();
    document.querySelector(".celebration")?.focus();
  }
  if (e === "plan") brancherPlan();
  S.repli = null;
  document.documentElement.style.setProperty("--haut-entete", `${document.querySelector(".entete").offsetHeight}px`);
  document.getElementById("bouton-reglages").style.color = S.ecran === "reglages" ? "var(--or)" : "var(--texte-doux)";
  if (champ) { const el = document.querySelector(`[data-champ="${champ}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (_) {} } }
}
function ouvrir(ecran) { S.ecran = ecran; replie = false; rendre(); window.scrollTo(0, 0); }

// ---- Actions ----
function objectifDepuisCle(cle) {
  const [t, id, n] = cle.split(":");
  return t === "etabli" ? { type: "etabli", id, niveau: +n } : t === "projet" ? { type: "projet", id, etape: +n } : { type: "quete", id };
}
function changerBuild(rang, f) {
  const liste = builds();
  f(liste[rang]);
  M.builds = liste;
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-action]");
  if (!b || b.disabled) return;
  const id = b.dataset.id;
  switch (b.dataset.action) {
    case "onglet": if (b.dataset.onglet === "BUILDS" && S.onglet !== "BUILDS") S.build = null; S.onglet = b.dataset.onglet; S.ecran = null; replie = false; S.renommer = false; rendre(); window.scrollTo(0, 0); return;
    case "basculer": S.ouverts.has(id) ? S.ouverts.delete(id) : S.ouverts.add(id); rendre(); return;
    case "vue-cartes": S.aVenir = id === "true"; rendre(); return;
    case "build-prefere": changerBuild(+id, () => {}); M.builds = builds().map((x, k) => ({ ...x, prefere: k === +id ? !x.prefere : false })); break;
    case "build-renommer": S.renommer = !S.renommer; rendre(); if (S.renommer) document.querySelector("[data-build-nom]")?.focus(); return;
    case "fiche": S.precedent = S.ecran; return ouvrir({ type: "fiche", id });
    case "fermer": S.ecran = S.ecran === "plan" && P.depuis ? P.depuis : S.ecran?.type === "fiche" && S.precedent ? S.precedent : null; P.depuis = null; S.precedent = null; rendre(); return;
    case "reglages": return ouvrir("reglages");
    case "en-cours": S.choix = null; S.rechercheQuetes = ""; return ouvrir(id);
    case "raid":
      // État à l'ouverture (bilan, annulation) ; la liste est figée : un objet qui atteint son nombre ne disparaît pas sous le doigt.
      S.raid = { avant: JSON.parse(JSON.stringify(M.apports || {})), liste: listeDuRaid(), saisis: {} };
      return ouvrir("raid");
    case "noter": noter(id, +b.dataset.d); break;
    case "annuler-raid": M.apports = JSON.parse(JSON.stringify(S.raid.avant)); S.raid.saisis = {}; break;
    case "valider-retour": S.ecran = null; break;
    case "fin-celebration": S.celebration = null; if (S.validation) montrerValidation(S.validation); rendre(); return;
    case "region": M.region = id; break;
    case "filtre": S.filtre = id; rendre(); return;
    case "build": S.build = +id; S.renommer = false; rendre(); return;
    case "butin-ecran": S.rechercheButin = ""; return ouvrir("choix-butin");
    case "butin-choisir": changerButin(id, (M.butin?.[id] ?? 0) + 1); S.ecran = null; break;
    case "butin-ajouter": changerButin(id, (M.butin?.[id] ?? 0) + 1); break;
    case "butin-plus": changerButin(id, (M.butin?.[id] ?? 0) + 1); break;
    case "butin-moins": changerButin(id, (M.butin?.[id] ?? 0) - 1); break;
    case "butin-retirer": changerButin(id, 0); break;
    case "niveau-en-cours": indiquerNiveau(etablis.get(id), b.dataset.n === "" ? null : +b.dataset.n); break;
    case "etape-en-cours": indiquerEtape(projets.get(id), b.dataset.n === "" ? null : +b.dataset.n); break;
    case "etabli-termine": if (!etabliTermine(etablis.get(id))) passerTermine(`etabli:${id}`); indiquerEtabliTermine(etablis.get(id)); break;
    case "projet-termine": if (!projetTermine(projets.get(id))) passerTermine(`projet:${id}`); indiquerProjetTermine(projets.get(id)); break;
    case "valider-objectif": valider(objectifDepuisCle(b.dataset.cle)); break;
    case "build-case": S.caseBuild = { rang: +id, cle: b.dataset.case }; S.rechercheBuild = ""; return ouvrir("choix-build");
    case "build-choisir": { const { rang, cle } = S.caseBuild; changerBuild(rang, x => { if (id) x.objets[cle] = id; else delete x.objets[cle]; }); S.ecran = null; break; }
    case "annuler-validation": if (S.validation) { charger(S.validation.avant); S.validation = null; } break;
    case "plan": Object.assign(P, { id, e: 1, dx: 0, dy: 0, depuis: null }); S.recherchePlan = ""; return ouvrir("plan");
    case "plan-chercher": S.recherchePlan = id; rendre(); return;
    case "plan-zone": Object.assign(P, { id, e: 1, dx: 0, dy: 0, depuis: S.ecran }); S.recherchePlan = b.dataset.zone; return ouvrir("plan");
    case "plan-zones": P.zones = !P.zones; rendre(); return;
    case "plan-sorties": P.sorties = !P.sorties; rendre(); return;
    case "plan-entier": Object.assign(P, { e: 1, dx: 0, dy: 0 }); rendre(); return;
    case "cocher": S.choix.has(id) ? S.choix.delete(id) : S.choix.add(id); rendre(); return;
    case "valider-quetes": indiquerQuetes(S.choix); S.ecran = null; S.onglet = "OBJECTIFS"; break;
    case "effacer": Object.assign(M, ETAT_VIDE()); break;
    default: return;
  }
  enregistrer();
  rendre();
});
// Région du calendrier (pastille « Europe ▾ »).
document.addEventListener("change", ev => {
  if (!ev.target.matches?.("[data-region]")) return;
  M.region = ev.target.value; enregistrer(); rendre();
});
// Appui long sur l'icône d'un objet du retour de raid : cinq d'un coup (le clic qui suit est ignoré).
let appuiLong = null, appuiFait = false;
document.addEventListener("pointerdown", ev => {
  const b = ev.target.closest("[data-appui-long]");
  if (!b || b.disabled) return;
  appuiFait = false;
  appuiLong = setTimeout(() => { appuiFait = true; noter(b.dataset.id, +b.dataset.appuiLong); enregistrer(); rendre(); }, 500);
});
for (const t of ["pointerup", "pointercancel", "pointerleave"]) document.addEventListener(t, () => clearTimeout(appuiLong));
document.addEventListener("click", ev => { if (appuiFait && ev.target.closest("[data-appui-long]")) { appuiFait = false; ev.stopImmediatePropagation(); } }, true);
document.addEventListener("contextmenu", ev => { if (ev.target.closest("[data-appui-long]")) ev.preventDefault(); });
document.addEventListener("input", ev => {
  // Nom d'un build : enregistré sans tout redessiner (le champ garde la main).
  const rang = ev.target.dataset?.buildNom;
  if (rang != null) { changerBuild(+rang, x => { x.nom = ev.target.value.slice(0, 30); }); enregistrer(); return; }
  const c = ev.target.dataset?.champ;
  if (!c) return;
  S[c] = ev.target.value;
  rendre();
});
document.addEventListener("keydown", ev => {
  if (ev.key !== "Escape") return;
  if (S.celebration) S.celebration = null; else if (S.ecran) S.ecran = null; else return;
  rendre();
});

// ---- Sauvegarde : compte claude.ai (privé) si disponible, sinon ce navigateur ----
let stockage = "navigateur", docCompte = null, minuterie = null, ecriture = Promise.resolve();
function enregistrer() {
  const copie = JSON.parse(JSON.stringify(M));
  try { localStorage.setItem("carnet", JSON.stringify(copie)); } catch (_) {}
  if (!docCompte) return;
  clearTimeout(minuterie);
  minuterie = setTimeout(() => { ecriture = ecriture.then(() => docCompte.set({ etat: JSON.stringify(copie) })).catch(() => {}); }, 700);
}
// Version 0.10 (Memoire.nouveauDepart) : tout est fait d'office sauf ce qui est indiqué en cours. Ce qui avait été
// saisi avant (établis suivis, objectifs ajoutés à la main, réserve, liste de raid) repart de zéro, une seule fois.
function charger(texte) {
  let lu = {};
  try { lu = JSON.parse(texte) || {}; } catch (_) {}
  // État d'une version précédente : seuls les réglages (région) et les builds sont gardés.
  if ((lu.modele ?? 0) < 2) lu = Object.fromEntries(Object.entries({ region: lu.region, builds: lu.builds }).filter(([, v]) => v != null));
  for (const cle of ["reserve", "manuels", "raid", "raidTrouves"]) delete lu[cle];
  for (const cle of Object.keys(M)) delete M[cle];
  Object.assign(M, ETAT_VIDE(), lu);
}
try { const t = localStorage.getItem("carnet"); if (t) charger(t); } catch (_) {}
rendre();

(async () => {
  try {
    const [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]);
    const id = db && user ? await user.id() : null;
    if (!id) return;
    docCompte = db.collection("data/users/" + id).doc("carnet");
    const snap = await docCompte.get();
    stockage = "compte";
    if (snap.exists && snap.data()?.etat) { charger(snap.data().etat); rendre(); }
    else enregistrer();
  } catch (_) { /* aperçu utilisable sans compte : données dans ce navigateur */ }
})();

fetch("icones.json").then(r => r.ok ? r.json() : null).then(j => { if (j) { icones = j; rendre(); } }).catch(() => {});
