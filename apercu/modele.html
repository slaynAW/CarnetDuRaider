<title>Carnet du Raider</title>

<style>
/* Style « Signal » de l'appli Android : toujours sombre, une couleur par domaine
   (or : objets, cyan : cartes, vert : objectifs, rouge : raid et ARC). Colonne de téléphone centrée. */
:root {
  --fond: #141417; --surface: #1E1E23; --releve: #28282F; --trait: #34343C;
  --texte: #F3EEE4; --texte-doux: #ABA69C; --texte-discret: #8A867E; --sur-couleur: #141417;
  --or: #F2B233; --cyan: #3CC4D8; --vert: #6CCB5F; --rouge: #F0544A;
  --commun: #B4B4B4; --rare: #4FA3F7; --epique: #D46BE0;
  --titre: "Prompt", "Segoe UI", system-ui, sans-serif;
  --corps: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--fond); color: var(--texte); }
body { font-family: var(--corps); font-size: 15px; line-height: 1.4; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--fond); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
.app { max-width: 460px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; position: relative; }
.entete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--fond);
  display: flex; align-items: center; gap: 12px; padding-block: 10px 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.entete h1 { font: 700 20px/1.2 var(--titre); margin: 0; flex: 1; }
.contenu { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-block: 8px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 460px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 12px; color: var(--texte-doux); font-size: 13px; }
.nav .pastille { width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
.nav button[aria-current="page"] { color: var(--texte); }
.nav button[aria-current="page"] .pastille { background: var(--c); color: var(--sur-couleur); }
svg.ic { width: 22px; height: 22px; fill: currentColor; }
h2 { font: 800 30px/1.1 var(--titre); margin: 0; text-wrap: balance; }
h3 { font: 700 26px/1.15 var(--titre); margin: 0; text-wrap: balance; }
h4 { font: 700 16px/1.3 var(--titre); margin: 8px 0 0; }
.doux { color: var(--texte-doux); } .discret { color: var(--texte-discret); } .petit { font-size: 13px; }
.bandeau { align-self: flex-start; font: 700 11px/1 var(--titre); letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--sur-couleur); background: var(--c, var(--texte)); padding: 6px 10px; border-radius: 99px; }
.carte { background: var(--surface); border-radius: 18px; padding: 12px 14px; }
.ligne { display: flex; align-items: center; gap: 12px; }
.ligne > .flex { flex: 1; min-width: 0; }
.nom { font-weight: 600; font-size: 16px; }
button.carte { text-align: left; width: 100%; }
button.carte:hover { background: var(--releve); }
.recherche { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--trait);
  border-radius: 26px; padding: 12px 16px; }
.recherche:focus-within { border-color: var(--f, var(--or)); }
.recherche input { flex: 1; min-width: 0; background: none; border: 0; color: var(--texte); font: inherit; font-size: 16px; outline: none; }
.icone { flex: none; display: grid; place-items: center; border-radius: 22%; overflow: hidden;
  background: linear-gradient(180deg, color-mix(in srgb, var(--r) 8%, transparent), color-mix(in srgb, var(--r) 32%, transparent));
  border: 1.5px solid color-mix(in srgb, var(--r) 60%, transparent); }
.icone img { width: 86%; height: 86%; object-fit: contain; }
.puce { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border-radius: 99px; padding: 5px 10px; font-size: 13px; font-weight: 600; }
.puce i { width: 8px; height: 8px; border-radius: 50%; background: var(--r); }
.bouton { border-radius: 99px; padding: 11px 18px; font: 700 15px/1 var(--titre); background: var(--c, var(--or)); color: var(--sur-couleur); }
.bouton.large { width: 100%; border-radius: 20px; padding: 17px; }
.lien { color: var(--c, var(--or)); font-weight: 600; padding: 8px 6px; }
.rond { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font: 700 20px/1 var(--titre); background: var(--surface); flex: none; }
.rond.plein { background: var(--c, var(--or)); color: var(--sur-couleur); }
.rond:disabled { opacity: .35; cursor: default; }
.compteur { display: flex; align-items: center; gap: 6px; flex: none; }
.compteur b { width: 44px; text-align: center; font: 700 20px var(--titre); font-variant-numeric: tabular-nums; }
.barre { height: 6px; border-radius: 99px; background: var(--trait); overflow: hidden; }
.barre i { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--or)); }
.prochain { display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: left; border-radius: 24px; padding: 16px 18px; background: var(--surface); }
.prochain.plein { background: var(--rouge); color: var(--sur-couleur); }
.prochain:hover { filter: brightness(1.08); }
.prochain small { font: 700 11px var(--titre); letter-spacing: 1.5px; }
.prochain strong { font: 700 22px/1.2 var(--titre); }
.verdict { background: var(--v, var(--or)); color: var(--sur-couleur); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 6px; }
.verdict.neutre { color: var(--texte); }
.verdict small { font: 700 11px var(--titre); letter-spacing: 1.5px; }
.verdict h3 { font-size: 30px; } .verdict hr { border: 0; border-top: 1px solid color-mix(in srgb, currentColor 30%, transparent); margin: 6px 0; width: 100%; }
.pv { font: 700 12px/1 var(--titre); padding: 5px 9px; border-radius: 99px; white-space: nowrap; background: var(--p); color: var(--sur-couleur); }
.pv.neutre { color: var(--texte-doux); }
.usage b { font: 600 14px var(--titre); color: var(--cyan); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.chip { border: 1px solid var(--trait); border-radius: 8px; padding: 7px 12px; color: var(--texte-doux); white-space: nowrap; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--c, var(--cyan)); color: var(--sur-couleur); border-color: transparent; }
.retour { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.retour:hover { background: var(--surface); }
.case { width: 20px; height: 20px; border-radius: 4px; border: 2px solid var(--texte-doux); flex: none; display: grid; place-items: center; }
.case.coche { background: var(--vert); border-color: var(--vert); color: var(--sur-couleur); font-weight: 700; font-size: 14px; }
.note-apercu { border: 1px dashed var(--trait); border-radius: 16px; padding: 10px 14px; }
.valider { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 9px 14px; font: 700 14px/1 var(--titre); background: var(--vert); color: var(--sur-couleur); align-self: flex-start; }
.bandeau-validation { position: fixed; left: 0; right: 0; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 6; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bandeau-validation > div { pointer-events: auto; max-width: 428px; margin: 0 auto; background: var(--releve); border-radius: 16px; padding: 8px 8px 8px 16px; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.apercus { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.apercus button { flex: none; width: 132px; background: var(--surface); border-radius: 16px; overflow: hidden; text-align: left; }
.apercus img { display: block; width: 132px; height: 96px; object-fit: cover; background: var(--releve); }
.apercus span { display: block; padding: 8px 10px; font-size: 13px; font-weight: 600; }
.plan-vue { position: relative; width: min(100%, 70vh); aspect-ratio: 1; margin: 0 auto; border-radius: 16px; overflow: hidden; background: var(--fond); touch-action: none; cursor: grab; user-select: none; }
.plan-vue img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; pointer-events: none; }
.plan-vue .etq { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; background: rgba(20,20,23,.72); border-radius: 6px; padding: 2px 6px; font-size: 12px; font-weight: 600; pointer-events: none; }
.plan-vue .etq.grande { font: 700 14px var(--titre); }
h5 { margin: 6px 0 0; font: 600 14px var(--titre); color: var(--or); }
.indice { display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: left; padding: 4px 0; }
.indice > i { display: block; height: 4px; border-radius: 2px; background: var(--releve); overflow: hidden; }
.indice > i > i { display: block; height: 100%; background: var(--or); }
.indice b { font-variant-numeric: tabular-nums; color: var(--or); margin-left: 8px; }
.indice small { margin-left: 8px; }
.plan-vue .arc { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--rouge); border: 2px solid var(--fond); pointer-events: none; }
.plan-vue .sortie { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--cyan); border: 3px solid var(--fond); pointer-events: none; }
@media (prefers-reduced-motion: no-preference) { button { transition: background-color .15s; } }
</style>

<script id="donnees-jeu" type="application/json">/*DONNEES*/</script>
<script>
"use strict";
// Aperçu web du Carnet du Raider : mêmes données du jeu (noms français officiels), mêmes règles
// que l'appli Android (core/), réécrites ici en JavaScript.
const D = JSON.parse(document.getElementById("donnees-jeu").textContent);
const NB = " ";
const NOM_A_VERIFIER = "Nom à vérifier en jeu";
const RARETES = { COMMUN: ["Commun", "--commun"], INHABITUEL: ["Inhabituel", "--vert"], RARE: ["Rare", "--rare"], EPIQUE: ["Épique", "--epique"], LEGENDAIRE: ["Légendaire", "--or"] };
const echap = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pluriel = (n, s, p) => `${n} ${n > 1 ? p : s}`;
const normaliser = t => t.trim().toLowerCase().normalize("NFD").replace(/\p{Mn}+/gu, "").replace(/’/g, "'").replace(/[\u00a0\u202f]/g, " ");

// ---- Catalogue (core/Catalogue.kt) ----
const objets = new Map(D.objets.map(o => [o.id, o]));
const etablis = new Map(D.etablis.map(e => [e.id, e]));
const quetes = new Map(D.quetes.map(q => [q.id, q]));
const index = D.objets.map(o => [o, normaliser(o.nom)]);
const tous = [...index].sort((a, b) => a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : a[0].nom.localeCompare(b[0].nom)).map(x => x[0]);
const nomObjet = id => objets.get(id)?.nom ?? NOM_A_VERIFIER;
function rechercher(saisie, limite) {
  const cle = normaliser(saisie);
  if (!cle) return [];
  return index.filter(([, n]) => n.includes(cle))
    .sort((a, b) => (!a[1].startsWith(cle)) - (!b[1].startsWith(cle)) || a[0].nom.length - b[0].nom.length || a[0].nom.localeCompare(b[0].nom))
    .slice(0, limite).map(x => x[0]);
}
const valeurRecyclage = o => o.recyclage.reduce((s, q) => s + (objets.get(q.id)?.valeur ?? 0) * q.quantite, 0);

// ---- Mémoire du joueur (comme Memoire.kt), gardée pour ce compte ----
const M = { reserve: {}, niveaux: {}, terminees: [], suivis: [], manuels: [], quetesIndiquees: false, region: "EUROPE", etapesProjets: {}, projetsSuivis: [], raid: {} };
const projets = new Map((D.projets || []).map(p => [p.id, p]));
const cartes = new Map(D.cartes.map(c => [c.id, c]));

// ---- Progression (core/Progression.kt) ----
const histoire = D.quetes.filter(q => q.histoire);
const suites = new Map();
for (const q of histoire) for (const r of q.requiert) suites.set(r, [...(suites.get(r) || []), q.id]);
const niveauDepart = e => Math.min(...e.niveaux.map(n => n.niveau)) - 1;
const niveauMax = e => Math.max(...e.niveaux.map(n => n.niveau));
const niveau = e => Math.min(Math.max(M.niveaux[e.id] ?? niveauDepart(e), niveauDepart(e)), niveauMax(e));
const prochainNiveau = e => e.niveaux.filter(n => n.niveau > niveau(e)).sort((a, b) => a.niveau - b.niveau)[0] ?? null;
const quetesEnCours = () => { const t = new Set(M.terminees); return histoire.filter(q => !t.has(q.id) && q.requiert.every(r => t.has(r))); };
function parcourir(depart, voisins) {
  const vus = new Set(), aVoir = [...voisins(depart)];
  while (aVoir.length) { const id = aVoir.shift(); if (!vus.has(id)) { vus.add(id); aVoir.push(...voisins(id)); } }
  vus.delete(depart); return vus;
}
const precedentes = id => parcourir(id, x => quetes.get(x)?.requiert ?? []);
const suivantes = id => parcourir(id, x => suites.get(x) ?? []);
const cleObjectif = o => o.type === "etabli" ? `etabli:${o.id}:${o.niveau}` : o.type === "projet" ? `projet:${o.id}:${o.etape}` : `quete:${o.id}`;
const prochaineEtape = p => { const n = M.etapesProjets[p.id] ?? 0; return n < p.etapes.length ? n : null; };
const nomEtape = (p, i) => p?.etapes[i]?.nom ?? `étape ${i + 1}`;
function objectifsAuto() {
  const liste = [];
  // Rien n'est suivi à l'installation : établis choisis un par un, quêtes une fois indiquées (Progression.kt).
  for (const e of D.etablis) { if (!(M.suivis || []).includes(e.id)) continue; const p = prochainNiveau(e); if (p) liste.push({ type: "etabli", id: e.id, niveau: p.niveau }); }
  if (M.quetesIndiquees) for (const q of quetesEnCours()) if (q.objets.length) liste.push({ type: "quete", id: q.id });
  for (const p of D.projets || []) { if (!(M.projetsSuivis || []).includes(p.id)) continue; const e = prochaineEtape(p); if (e != null) liste.push({ type: "projet", id: p.id, etape: e }); }
  return liste;
}
function objectifs() {
  const vus = new Set(), liste = [];
  for (const o of [...objectifsAuto(), ...M.manuels]) { const k = cleObjectif(o); if (!vus.has(k)) { vus.add(k); liste.push(o); } }
  return liste;
}

// ---- Liste de courses et verdict (core/ListeDeCourses.kt, core/Verdict.kt) ----
const libelle = o => o.type === "etabli" ? `${etablis.get(o.id)?.nom ?? NOM_A_VERIFIER} · niveau ${o.niveau}`
  : o.type === "projet" ? `${projets.get(o.id)?.nom ?? NOM_A_VERIFIER} · ${nomEtape(projets.get(o.id), o.etape)}`
  : `Quête «${NB}${quetes.get(o.id)?.nom ?? NOM_A_VERIFIER}${NB}»`;
const besoins = o => o.type === "etabli" ? (etablis.get(o.id)?.niveaux.find(n => n.niveau === o.niveau)?.cout ?? [])
  : o.type === "projet" ? (projets.get(o.id)?.etapes[o.etape]?.cout ?? []) : (quetes.get(o.id)?.objets ?? []);
const besoinsPourObjet = (id, objs) => objs.map(o => ({ o, libelle: libelle(o), quantite: besoins(o).filter(q => q.id === id).reduce((s, q) => s + q.quantite, 0) })).filter(b => b.quantite > 0);
const possede = id => M.reserve[id] ?? 0;
function listeDeCourses() {
  const objs = objectifs();
  const ids = [...new Set(objs.flatMap(o => besoins(o).map(q => q.id)))];
  const lignes = ids.map(id => { const pour = besoinsPourObjet(id, objs); const besoin = pour.reduce((s, b) => s + b.quantite, 0); return { id, nom: nomObjet(id), besoin, possede: possede(id), pour }; })
    .map(l => ({ ...l, manquant: Math.max(0, l.besoin - l.possede), complet: l.possede >= l.besoin }));
  lignes.sort((a, b) => a.complet - b.complet || b.manquant - a.manquant || a.nom.localeCompare(b.nom));
  const total = lignes.reduce((s, l) => s + l.besoin, 0);
  return { lignes, manquants: lignes.reduce((s, l) => s + l.manquant, 0), progression: total ? lignes.reduce((s, l) => s + Math.min(l.possede, l.besoin), 0) / total : 1 };
}
// Tout ce qu'il reste à trouver : ce qui manque pour les objectifs, puis les objets ajoutés par le joueur (M.raid).
function aTrouver() {
  const pourObjectifs = listeDeCourses().lignes.filter(x => !x.complet).map(x => ({ id: x.id, possede: x.possede, voulu: x.besoin, pour: x.pour }));
  const deja = new Set(pourObjectifs.map(x => x.id));
  const ajoutes = Object.entries(M.raid || {}).filter(([id]) => !deja.has(id)).map(([id, voulu]) => ({ id, possede: possede(id), voulu, pour: [] }));
  return [...pourObjectifs, ...ajoutes].map(x => ({ ...x, ajoute: !x.pour.length, trouve: x.possede >= x.voulu }));
}

// ---- À quoi sert un objet (core/Usages.kt) : données du jeu, plus établis, quêtes et projets pas encore faits ----
const UTILISATIONS_VIDES = { fabrication: [], recherches: [], avantPoste: [], echanges: [], echangesValeur: [], amplification: [], aApprendre: false, debloque: [], meubles: [], apparence: false, cle: false, equipement: false };
function usages(id) {
  const o = objets.get(id), ut = { ...UTILISATIONS_VIDES, ...(o?.utilisations || {}) }, t = new Set(M.terminees);
  const qte = cout => cout.filter(q => q.id === id).reduce((s, q) => s + q.quantite, 0);
  const ameliorations = D.etablis.flatMap(e => e.niveaux.filter(n => n.niveau > niveau(e)).map(n => ({ etabli: e, niveau: n.niveau, quantite: qte(n.cout) }))).filter(x => x.quantite > 0);
  const quetesU = D.quetes.filter(q => !t.has(q.id)).map(q => ({ quete: q, quantite: qte(q.objets) })).filter(x => x.quantite > 0);
  const projetsU = (D.projets || []).flatMap(p => p.etapes.map((e, i) => ({ projet: p, etape: i, quantite: qte(e.cout) })).slice(M.etapesProjets[p.id] ?? 0)).filter(x => x.quantite > 0);
  const aucun = Object.entries(UTILISATIONS_VIDES).every(([k, v]) => Array.isArray(v) ? !ut[k].length : !ut[k]) && !ameliorations.length && !quetesU.length && !projetsU.length;
  return { description: o?.description ?? null, ut, ameliorations, quetes: quetesU, projets: projetsU, aucun };
}
// Résumé court, du plus utile au moins utile (UsagesObjet.resume).
function resumeUsages(u) {
  const ut = u.ut;
  return [[ut.cle, "clé"], [ut.equipement, "équipement"], [u.ameliorations.length, "établis"], [u.quetes.length, "quêtes"], [u.projets.length, "projets"],
    [ut.fabrication.length, "fabrication"], [ut.amplification.length, "amplification"], [ut.aApprendre, "à apprendre"], [ut.apparence, "apparence"],
    [ut.recherches.length, "recherche"], [ut.avantPoste.length, "Avant-poste"], [ut.echanges.length || ut.echangesValeur.length, "échanges"]].filter(x => x[0]).map(x => x[1]);
}

// Verdict (core/Verdict.kt) : un objet voulu (objectifs ou liste de raid) ou utile n'est jamais proposé à la vente.
function meilleureSortie(o) { return !o?.recyclage.length ? "VENDRE" : valeurRecyclage(o) > o.valeur ? "RECYCLER" : "VENDRE"; }
function verdict(id, objs = objectifs()) {
  const pour = besoinsPourObjet(id, objs), besoin = pour.reduce((s, b) => s + b.quantite, 0), p = possede(id), voulu = M.raid?.[id];
  if (besoin > p) return { type: "garder", manquant: besoin - p, besoin, pour };
  if (voulu != null) return { type: "cherche", voulu, possede: p };
  if (besoin > 0) return { type: "suffisant", surplus: p - besoin, besoin, pour };
  const u = usages(id), sortie = meilleureSortie(objets.get(id));
  return u.aucun ? { type: "inutile", sortie } : { type: "utile", usages: u, sortie };
}

// ---- Icônes officielles des objets (chargées à part : icones.json) ----
let icones = null;
function icone(id, taille) {
  const o = objets.get(id), r = RARETES[o?.rarete]?.[1] ?? "--texte-discret", src = icones?.[id];
  return `<span class="icone" style="--r:var(${r});width:${taille}px;height:${taille}px">${src ? `<img src="${src}" alt="" loading="lazy">` : ""}</span>`;
}

// ---- État de l'écran ----
const ONGLETS = [
  ["ACCUEIL", "Accueil", "--texte", "M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"],
  ["OBJETS", "Objets", "--or", "M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"],
  ["RAID", "Raid", "--rouge", "M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42a.25.25 0 0 1-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"],
  ["CARTES", "Cartes", "--cyan", "M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"],
  ["OBJECTIFS", "Objectifs", "--vert", "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"],
];
const S = { onglet: "ACCUEIL", ecran: null, recherche: "", rechercheRaid: "", rechercheQuetes: "", recherchePlan: "", rechercheAjout: "", choix: null, validation: null, raid: null };

// ---- Écrans ----
const bandeau = (texte, c) => `<span class="bandeau" style="--c:var(${c})">${echap(texte)}</span>`;
const retour = (texte, c) => `<div class="ligne"><button class="retour" data-action="fermer" aria-label="Retour"><svg class="ic" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></button>${bandeau(texte, c)}</div>`;
const compteur = id => `<div class="compteur"><button class="rond" data-action="qte" data-id="${id}" data-d="-1" ${possede(id) ? "" : "disabled"} aria-label="En retirer un${NB}: ${echap(nomObjet(id))}">−</button><b>${possede(id)}</b><button class="rond plein" data-action="qte" data-id="${id}" data-d="1" aria-label="Ajouter un ${echap(nomObjet(id))}">+</button></div>`;
const detailCout = cout => cout.map(q => `${q.quantite} × ${echap(nomObjet(q.id))}`).join(" · ");

function ecranAccueil() {
  const h = new Date().getHours();
  return `<h3>${h >= 18 || h < 5 ? "Bonsoir" : "Bonjour"}, Raider</h3>
  <button class="carte ligne" data-action="onglet" data-onglet="OBJETS" style="border-radius:26px;padding:15px 18px">
    <svg class="ic" viewBox="0 0 24 24" style="color:var(--or)"><path d="${ONGLETS[1][3]}"/></svg>
    <span class="flex"><span class="nom" style="font:600 14px var(--titre)">Garder, recycler ou vendre${NB}?</span><br><span class="doux">Cherche un objet…</span></span></button>
  ${prochainRaid()}
  <button class="carte" data-action="onglet" data-onglet="CARTES" style="display:flex;flex-direction:column;gap:4px;padding:12px 16px"><b style="font:600 14px var(--titre);color:var(--cyan)">Conditions de la carte</b><span class="petit doux">Dans l'appli Android, les conditions en cours et à venir s'affichent ici avec leur minuteur.</span></button>
  ${mesObjectifs()}
  <p class="petit discret">Données du jeu ${echap(D.versionJeu)}, noms français officiels uniquement.</p>`;
}

// Où aller au prochain raid pour trouver ce qui manque (ProchainRaid, EcranAccueil.kt).
function prochainRaid() {
  const restants = aTrouver().filter(x => !x.trouve), conseil = conseilRaid(restants.map(x => x.id)), premiere = conseil.cartes[0];
  const nomC = id => cartes.get(id)?.nom ?? NOM_A_VERIFIER;
  const contenu = premiere ? `<strong>Va sur ${echap(nomC(premiere.carteId))}</strong>
      <b>${premiere.objets.length} de tes ${pluriel(restants.length, "objet", "objets")} à trouver${premiere.zones[0] ? ` · surtout ${echap(premiere.zones[0].zone)}` : ""}</b>
      ${conseil.parcours.length > 1 ? `<span class="petit">Puis ${echap(conseil.parcours.slice(1).map(e => nomC(e.carteId)).join(", "))} pour tout trouver.</span>` : ""}`
    : restants.length ? `<strong>Rien dans le butin des cartes</strong><span class="doux">Ce qu'il te faut s'obtient autrement${NB}: regarde l'onglet Raid.</span>`
    : `<strong>Rien à chercher pour l'instant</strong><span class="doux">Choisis ce que tu veux faire avancer (établis, quêtes, projets)${NB}: l'appli te dira où aller.</span>`;
  return `<button class="prochain ${premiere ? "plein" : ""}" data-action="onglet" data-onglet="${restants.length ? "RAID" : "OBJECTIFS"}"><small>TON PROCHAIN RAID</small>${contenu}</button>`;
}

// Où en sont les objectifs suivis (MesObjectifs, EcranAccueil.kt).
function mesObjectifs() {
  const objs = objectifs(), l = listeDeCourses();
  return `<button class="carte" data-action="onglet" data-onglet="OBJECTIFS" style="display:flex;flex-direction:column;gap:8px;padding:14px 16px">
    <b style="font:600 14px var(--titre);color:var(--vert)">Objectifs</b>
    ${objs.length ? `<span>${pluriel(objs.length, "objectif suivi", "objectifs suivis")} · ${pluriel(l.lignes.filter(x => !x.complet).length, "objet", "objets")} à trouver</span><span class="barre" style="--c:var(--vert)"><i style="width:${l.progression * 100}%"></i></span>`
      : `<span class="doux">Aucun objectif suivi. Touche ici pour suivre tes établis, tes quêtes ou un projet.</span>`}</button>`;
}

// Le verdict en un mot, pour la liste (PuceVerdict, EcranObjets.kt).
function puceVerdict(v) {
  if (v.type === "inutile") return `<span class="pv neutre" style="--p:var(--releve)">${v.sortie === "VENDRE" ? "Vendre" : "Recycler"}</span>`;
  const [texte, c] = { garder: ["Garder", "--or"], cherche: ["Garder", "--or"], suffisant: ["Assez", "--vert"], utile: ["Utile", "--cyan"] }[v.type];
  return `<span class="pv" style="--p:var(${c})">${texte}</span>`;
}

function ecranObjets() {
  const r = S.recherche.trim() ? rechercher(S.recherche, 200) : tous, objs = objectifs();
  const info = !S.recherche.trim() ? `${pluriel(r.length, "objet", "objets")} par ordre alphabétique. Touche un objet pour savoir à quoi il sert et où le trouver.`
    : r.length ? pluriel(r.length, "objet trouvé", "objets trouvés") : "Aucun objet ne correspond.";
  return `${bandeau("Objets", "--or")}<h3>Garder, recycler ou vendre${NB}?</h3>
  <label class="recherche"><svg class="ic" viewBox="0 0 24 24" style="color:var(--or)"><path d="${ONGLETS[1][3]}"/></svg>
  <input id="recherche-objets" type="search" placeholder="Cherche un objet…" value="${echap(S.recherche)}" data-champ="recherche" autocomplete="off"></label>
  <p class="doux">${info}</p>
  <div id="liste-objets" style="display:flex;flex-direction:column;gap:8px">${r.map(o => `<button class="carte ligne" style="padding:10px 12px" data-action="fiche" data-id="${o.id}">${icone(o.id, 48)}
    <span class="flex"><span class="nom">${echap(o.nom)}</span><br><span class="petit doux">${echap([RARETES[o.rarete]?.[0], o.categorie].filter(Boolean).join(" · "))}</span></span>
    <span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">${puceVerdict(verdict(o.id, objs))}${possede(o.id) ? `<b style="color:var(--or);font-family:var(--titre)">× ${possede(o.id)}</b>` : ""}</span></button>`).join("")}</div>`;
}

// Fiche d'un objet, dans l'ordre où le joueur se pose les questions : verdict, à quoi il sert, où le trouver, ce qu'il rapporte.
function ecranFiche(id) {
  const o = objets.get(id), v = verdict(id), vr = valeurRecyclage(o), rar = RARETES[o.rarete], cherche = id in (M.raid || {});
  const sortie = s => s === "RECYCLER" ? `recycle-le${NB}: ses matériaux valent ${vr} pièces, plus que l'objet (${o.valeur}).`
    : !o.recyclage.length ? `vends-le${NB}: il vaut ${o.valeur} pièces et ne se recycle pas.` : `vends-le${NB}: il vaut ${o.valeur} pièces, plus que ses matériaux (${vr}).`;
  const c = v.type === "garder" ? { titre: "Garde-le", texte: `Il t'en manque ${v.manquant} pour tes objectifs.`, fond: "--or", pour: v.pour }
    : v.type === "cherche" ? { titre: "Garde-le", texte: v.possede < v.voulu ? `Tu le cherches pour ton raid (encore ${v.voulu - v.possede}).` : `Tu le cherchais pour ton raid${NB}: tu en as assez.`, fond: "--or" }
    : v.type === "suffisant" ? { titre: "Tu en as assez", texte: v.surplus === 0 ? "Pile ce qu'il faut pour tes objectifs." : `Tes objectifs sont couverts, avec ${v.surplus} en plus.`, fond: "--vert", pour: v.pour }
    : v.type === "utile" ? { titre: "Il peut servir", texte: `Aucun de tes objectifs n'en demande, mais il sert${NB}: ${resumeUsages(v.usages).join(", ")}. Le détail est plus bas.`, fond: "--cyan", note: `Si tu n'en as pas l'usage, ${sortie(v.sortie)}` }
    : { titre: v.sortie === "VENDRE" ? "Vends-le" : "Recycle-le", texte: `Il ne sert à rien d'autre dans le jeu${NB}: ${sortie(v.sortie)}`, fond: "--releve" };
  return `${retour("Objet", "--or")}
  <div class="ligne" style="gap:16px">${icone(id, 104)}<div class="flex" style="display:flex;flex-direction:column;gap:8px">
    <h3>${echap(o.nom)}</h3>${rar ? `<span class="puce" style="--r:var(${rar[1]});align-self:flex-start"><i></i>${rar[0]}</span>` : ""}
    ${o.categorie ? `<span class="puce doux" style="align-self:flex-start">${echap(o.categorie)}</span>` : ""}</div></div>
  <div class="verdict ${c.fond === "--releve" ? "neutre" : ""}" style="--v:var(${c.fond})"><small>VERDICT</small><h3>${c.titre}</h3><b>${c.texte}</b>
    ${c.pour?.length ? `<hr>${c.pour.map(b => `<div class="ligne"><b class="flex">${echap(b.libelle)}</b><b>× ${b.quantite}</b></div>`).join("")}` : ""}
    ${c.note ? `<span class="petit">${c.note}</span>` : ""}</div>
  <div class="ligne"><span class="flex" style="font:600 14px var(--titre)">Dans ta réserve</span>${compteur(id)}</div>
  ${v.type !== "garder" ? `<button class="lien" style="--c:var(${cherche ? "--texte-doux" : "--rouge"});align-self:flex-start;padding-left:0" data-action="raid-basculer" data-id="${id}">${cherche ? "Dans ce que tu cherches · le retirer" : "Le chercher au prochain raid"}</button>` : ""}
  ${sectionUsages(usages(id))}
  ${commentLObtenir(o)}
  <h4>Vente et recyclage</h4><p style="margin:0">Se vend ${o.valeur} pièces l'unité.</p>
  ${o.recyclage.length ? `<p class="doux" style="margin:0">Recyclage en (matériaux${NB}: ${vr} pièces)${NB}:</p>${o.recyclage.map(ligneQte).join("")}` : `<p class="doux" style="margin:0">Ne se recycle pas.</p>`}`;
}

// À quoi sert l'objet (SectionUsages, EcranObjets.kt) : description officielle, puis tout ce qui le demande encore.
const abrege = (noms, n = 3) => noms.slice(0, n).join(", ") + (noms.length > n ? ` et ${noms.length - n} autres` : "");
function sectionUsages(u) {
  const ut = u.ut, ligne = (titre, texte) => `<div class="usage"><b>${titre}</b><br>${echap(texte)}</div>`;
  let h = `<h4>À quoi il sert</h4>`;
  if (u.description) h += `<p style="margin:0">${echap(u.description)}</p>`;
  if (u.aucun) h += `<p class="doux" style="margin:0">Rien d'autre que la vente ou le recyclage, d'après les données du jeu.</p>`;
  if (ut.cle) h += ligne("Clé", `Elle ouvre une porte ou une salle${NB}: voir la description.`);
  if (ut.equipement) h += ligne("Équipement", "Il s'utilise en raid.");
  if (u.ameliorations.length) h += ligne("Établis", u.ameliorations.map(a => `${a.etabli.nom} niveau ${a.niveau} (${a.quantite})`).join(" · "));
  if (u.quetes.length) h += ligne("Quêtes", u.quetes.map(q => `«${NB}${q.quete.nom}${NB}» (${q.quantite})`).join(" · "));
  if (u.projets.length) h += ligne("Projets", u.projets.map(p => `${p.projet.nom}, ${nomEtape(p.projet, p.etape)} (${p.quantite})`).join(" · "));
  if (ut.fabrication.length) {
    h += `<h5>Sert à fabriquer</h5>${ut.fabrication.slice(0, 6).map(f => `<button class="ligne" data-action="fiche" data-id="${f.objet}" style="text-align:left">${icone(f.objet, 32)}<span class="flex">${echap(nomObjet(f.objet))}</span><small class="doux">${echap(f.etabli ? (f.niveau ? `${f.etabli} · niv. ${f.niveau}` : f.etabli) : "en raid")}</small></button>`).join("")}`;
    if (ut.fabrication.length > 6) h += `<p class="petit doux" style="margin:0">Et ${pluriel(ut.fabrication.length - 6, "autre objet", "autres objets")}.</p>`;
  }
  if (ut.amplification.length) h += ligne("Amplification", ut.amplification.map(nomObjet).join(" · "));
  if (ut.aApprendre) { const quoi = [...ut.debloque.map(nomObjet), ...ut.meubles]; h += ligne("À apprendre", quoi.length ? `Il débloque${NB}: ${quoi.join(", ")}.` : "Il débloque une fabrication."); }
  if (ut.apparence) h += ligne("Apparence", "Une apparence à débloquer.");
  if (ut.recherches.length) h += ligne("Station de recherche", abrege(ut.recherches));
  if (ut.avantPoste.length) h += ligne("Avant-poste", abrege(ut.avantPoste));
  if (ut.echanges.length) h += ligne("Échanges", ut.echanges.slice(0, 4).map(e => `${e.commercant}${NB}: ${e.donne} contre ${e.quantite} × ${nomObjet(e.objet)}`).join(" · ") + (ut.echanges.length > 4 ? ` · et ${ut.echanges.length - 4} autres` : ""));
  if (ut.echangesValeur.length) h += ligne("Échanges", `${ut.echangesValeur.join(", ")} l'accepte en échange, au prix de sa valeur.`);
  return h;
}

// Comment obtenir l'objet (CommentLObtenir, EcranObjets.kt) : butin, commerçants, fabrication, recyclage, récompenses.
const sourcesRecyclage = (() => {
  const m = new Map();
  for (const o of D.objets) for (const q of o.recyclage) { if (!m.has(q.id)) m.set(q.id, []); m.get(q.id).push({ id: o.id, quantite: q.quantite }); }
  for (const l of m.values()) l.sort((a, b) => b.quantite - a.quantite || normaliser(nomObjet(a.id)).localeCompare(normaliser(nomObjet(b.id))));
  return id => m.get(id) || [];
})();
const ligneQte = q => `<div class="ligne">${icone(q.id, 32)}<span>${q.quantite} × ${echap(nomObjet(q.id))}</span></div>`;
const ligneIndice = (nom, sous, indice, action) => `<${action ? `button ${action}` : "div"} class="indice"><span class="ligne"><span class="flex">${echap(nom)}${sous ? `<br><small class="doux">${echap(sous)}</small>` : ""}</span><b>${indice}</b>${action ? `<small style="color:var(--cyan)">Plan ›</small>` : ""}</span><i><i style="width:${indice}%"></i></i></${action ? "button" : "div"}>`;
function commentLObtenir(o) {
  const ob = o.obtention || {}, rec = sourcesRecyclage(o.id);
  let h = "";
  if (o.lieux.length || ob.cartes?.length || ob.zones?.length) {
    h += `<h4>Où le trouver</h4>`;
    if (o.lieux.length) h += `<p style="margin:0">Dans les zones${NB}: ${echap(o.lieux.join(" · "))}</p>`;
    if (ob.cartes?.length) h += `<h5>Meilleures cartes</h5>${ob.cartes.map(c => ligneIndice(cartes.get(c.carte)?.nom ?? NOM_A_VERIFIER, null, c.indice)).join("")}`;
    if (ob.zones?.length) h += `<h5>Meilleures zones</h5>${ob.zones.slice(0, 5).map(z => ligneIndice(z.zone, cartes.get(z.carte)?.nom, z.indice, `data-action="plan-zone" data-id="${z.carte}" data-zone="${echap(z.zone)}"`)).join("")}
      <p class="petit doux" style="margin:0">Classement d'après les tables de butin du jeu (condition normale), 100 pour le meilleur endroit. Les taux de drop exacts ne sont pas publiés${NB}: le jeu tire le butin sur ses serveurs.</p>`;
  }
  if (ob.achats?.length) h += `<h4>Chez les commerçants</h4>${ob.achats.map(a => {
    const prix = [a.pieces ? `${a.pieces} pièces` : "", a.valeurObjets ? `des objets valant ${a.valeurObjets} pièces` : ""].filter(Boolean).join(" + ");
    return `<div style="display:flex;flex-direction:column;gap:2px"><span>${echap(a.commercant)}${prix ? `${NB}: ${a.quantite > 1 ? `${a.quantite} pour ` : ""}${prix}` : ""}</span>${(a.objets || []).map(ligneQte).join("")}${a.limite ? `<small class="doux">${a.parJour ? `${a.limite} par jour au plus` : pluriel(a.limite, "achat possible", "achats possibles")}</small>` : ""}</div>`;
  }).join("")}`;
  if (ob.fabrications?.length) h += `<h4>Fabrication</h4>${ob.fabrications.map(f => {
    const ou = f.etabli ? (f.niveau ? `${f.etabli} · niveau ${f.niveau}` : f.etabli) : "Pendant un raid";
    return `<div style="display:flex;flex-direction:column;gap:2px"><span>${echap(f.quantite > 1 ? `${ou} (en donne ${f.quantite})` : ou)}</span>${f.plan ? `<small class="doux">Plan à débloquer${NB}: ${echap(f.plan)}</small>` : ""}${f.ingredients.map(ligneQte).join("")}</div>`;
  }).join("")}`;
  if (rec.length) h += `<h4>En recyclant</h4>${rec.slice(0, 6).map(q => `<button class="ligne" data-action="fiche" data-id="${q.id}" style="text-align:left">${icone(q.id, 32)}<span class="flex">${echap(nomObjet(q.id))}</span><small class="doux">en donne ${q.quantite}</small></button>`).join("")}${rec.length > 6 ? `<p class="petit doux" style="margin:0">Et ${pluriel(rec.length - 6, "autre objet", "autres objets")}.</p>` : ""}`;
  if (ob.recompenses?.length) h += `<h4>En récompense</h4>${ob.recompenses.map(r => `<p style="margin:0">${echap(r)}</p>`).join("")}`;
  return h;
}

function ecranCartes() {
  const regions = [["EUROPE", "Europe"], ["AMERIQUE_DU_NORD", "Amérique du Nord"], ["AMERIQUE_DU_SUD", "Amérique du Sud"], ["ASIE", "Asie"], ["OCEANIE", "Océanie"]];
  return `${bandeau("Cartes", "--cyan")}<h2>Conditions de la carte</h2>
  <div class="chips">${regions.map(([k, n]) => `<button class="chip" aria-pressed="${M.region === k}" data-action="region" data-region="${k}">${n}</button>`).join("")}</div>
  <div class="note-apercu petit doux">Dans l'appli Android, cet onglet lit le calendrier officiel d'Embark (en cours, prochaines heures, prochaine fois, alertes). L'aperçu web ne peut pas joindre le site d'Embark${NB}: ouvre-le directement.</div>
  <a class="lien" style="--c:var(--cyan)" href="https://arcraiders.com/map-conditions" target="_blank" rel="noopener">Ouvrir le calendrier officiel</a>
  <h4>Plans des cartes</h4><div class="apercus">${D.cartes.map(c => `<button data-action="plan" data-id="${c.id}"><img src="cartes/${c.id}.webp" alt="" loading="lazy"><span>${echap(c.nom)}</span></button>`).join("")}</div>
  <h4>Conditions</h4>${[...D.conditions].sort((a, b) => b.majeure - a.majeure || a.nom.localeCompare(b.nom)).map(c => `<div class="carte ligne"><span class="puce" style="--r:var(${c.majeure ? "--rouge" : "--cyan"});background:none;padding:0"><i></i></span><span class="nom flex">${echap(c.nom)}</span></div>`).join("")}`;
}

// ---- Plan interactif d'une carte (EcranPlan.kt) ----
const P = { id: null, e: 1, dx: 0, dy: 0, zones: true, sorties: true };

// Recherche sur le plan (RecherchePlan.kt) : sans accents, articles ni pluriel ; mots du nom ou famille.
const MOTS_VIDES = new Set(["le", "la", "les", "l", "de", "des", "du", "d", "un", "une", "a", "au", "aux", "et", "ou", "en", "sur"]);
const FAMILLE_SORTIES = ["sortie", "extraction", "evacuation"];
const FAMILLES_TYPE = { trappe: ["trappe"], ascenseur: ["ascenseur"], metro: ["metro", "station"], conduit: ["conduit", "aeration"], telepherique: ["telepherique", "gondole", "terminal"] };
const FAMILLE_ARC = ["arc", "ennemi", "robot"], FAMILLE_ZONES = ["zone", "lieu"];
const motsPlan = t => normaliser(t).split(/[^\p{L}\p{N}]+/u).filter(m => m && !MOTS_VIDES.has(m)).map(m => m.length > 3 && /[sx]$/.test(m) ? m.slice(0, -1) : m);
function correspondPlan(cherches, nom, famille) {
  const mn = nom ? motsPlan(nom) : [];
  return cherches.every(m => famille.includes(m) || famille.some(f => m.length >= 3 && f.startsWith(m)) || mn.some(w => w.startsWith(m)));
}
function chercherPlan(plan, requete) {
  const mots = motsPlan(requete);
  if (!mots.length) return null;
  return {
    zones: plan.zones.filter(z => correspondPlan(mots, z.nom, FAMILLE_ZONES)),
    sorties: plan.sorties.filter(s => correspondPlan(mots, s.nom, [...FAMILLE_SORTIES, ...FAMILLES_TYPE[s.type]])),
    arcs: (plan.arcs || []).filter(a => correspondPlan(mots, a.nom, FAMILLE_ARC)),
  };
}
function resumePlan(r) {
  if (!r.zones.length && !r.sorties.length && !r.arcs.length) return "Rien de ce nom sur cette carte.";
  const parties = [];
  if (r.sorties.length) parties.push(pluriel(r.sorties.length, "sortie", "sorties"));
  if (r.zones.length) parties.push(pluriel(r.zones.length, "lieu", "lieux"));
  if (r.arcs.length === 1) parties.push(`${r.arcs[0].nom} · ${pluriel(r.arcs[0].points.length, "point d'apparition", "points d'apparition")}`);
  else if (r.arcs.length > 1) parties.push(`${r.arcs.length} ARC (${pluriel(r.arcs.reduce((n, a) => n + a.points.length, 0), "point", "points")})`);
  return parties.join(" · ");
}

function ecranPlan() {
  const c = cartes.get(P.id), r = chercherPlan(c.plan, S.recherchePlan);
  return `${retour("Plan", "--cyan")}<h3>${echap(c.nom)}</h3>
  <p class="petit doux" style="margin:0">Molette ou deux doigts pour zoomer, glisser pour déplacer, double-clic pour zoomer. Les petits lieux apparaissent en zoomant. Les conditions en cours et leur minuteur s'affichent ici dans l'appli Android.</p>
  <label class="recherche"><svg class="ic" viewBox="0 0 24 24" style="color:var(--cyan)"><path d="${ONGLETS[1][3]}"/></svg><input id="recherche-plan" type="search" placeholder="Trappes, bondisseurs, un lieu…" value="${echap(S.recherchePlan)}" data-champ="recherchePlan" autocomplete="off"></label>
  <div class="chips">${r ? `<span class="petit" style="align-self:center;${r.zones.length || r.sorties.length || r.arcs.length ? "" : "color:var(--texte-doux)"}">${echap(resumePlan(r))}</span>`
    : `<button class="chip" aria-pressed="${P.zones}" data-action="plan-zones">Zones</button>${c.plan.sorties.length ? `<button class="chip" aria-pressed="${P.sorties}" data-action="plan-sorties">Sorties</button>` : ""}<button class="chip" data-action="plan-chercher" data-id="trappes">Trappes</button>${(c.plan.arcs || []).map(a => `<button class="chip" data-action="plan-chercher" data-id="${echap(a.nom)}">${echap(a.nom)}</button>`).join("")}`}${P.e > 1 ? `<button class="lien" style="--c:var(--cyan)" data-action="plan-entier">Vue entière</button>` : ""}</div>
  <div class="plan-vue" id="plan-vue"><img id="plan-img" src="cartes/${c.id}.webp" alt="Plan en jeu${NB}: ${echap(c.nom)}" draggable="false"><div id="plan-calque"></div></div>`;
}
function placerPlan() {
  const vue = document.getElementById("plan-vue"), img = document.getElementById("plan-img"), calque = document.getElementById("plan-calque");
  if (!vue) return;
  const c = cartes.get(P.id), w = vue.clientWidth, h = vue.clientHeight, cote = Math.min(w, h), ox = (w - cote) / 2, oy = (h - cote) / 2;
  // Le plan couvre toujours le centre de la vue.
  P.dx = Math.min(Math.max(P.dx, w / 2 - ox - cote * P.e), w / 2 - ox);
  P.dy = Math.min(Math.max(P.dy, h / 2 - oy - cote * P.e), h / 2 - oy);
  img.style.width = cote + "px";
  img.style.transform = `translate(${ox + P.dx}px, ${oy + P.dy}px) scale(${P.e})`;
  const ecran = (u, v) => [ox + P.dx + u * cote * P.e, oy + P.dy + v * cote * P.e];
  // Sans recherche : zones (les petites en zoomant) et sorties selon les interrupteurs ; avec : ce qui est trouvé.
  const r = chercherPlan(c.plan, S.recherchePlan);
  const zones = r ? r.zones : P.zones ? c.plan.zones.filter(z => z.detail === 0 || (z.detail === 1 && P.e >= 1.8) || (z.detail === 2 && P.e >= 3)) : [];
  const sorties = r ? r.sorties : P.sorties ? c.plan.sorties : [];
  let html = "";
  if (r) for (const a of r.arcs) for (const [u, v] of a.points) { const [x, y] = ecran(u, v); html += `<i class="arc" style="left:${x}px;top:${y}px"></i>`; }
  for (const s of sorties) { const [x, y] = ecran(s.x, s.y); html += `<i class="sortie" style="left:${x}px;top:${y}px"></i>`; if (s.nom && (r || P.e >= 3)) html += `<span class="etq" style="left:${x}px;top:${y + 20}px;color:var(--cyan)">${echap(s.nom)}</span>`; }
  for (const z of zones) { const [x, y] = ecran(z.x, z.y); html += `<span class="etq ${z.detail === 0 ? "grande" : ""}" style="left:${x}px;top:${y}px">${echap(z.nom)}</span>`; }
  calque.innerHTML = html;
}
function zoomer(nouvelle, px, py) {
  const vue = document.getElementById("plan-vue"), w = vue.clientWidth, h = vue.clientHeight, cote = Math.min(w, h), ox = (w - cote) / 2, oy = (h - cote) / 2;
  nouvelle = Math.min(Math.max(nouvelle, 1), 6);
  const u = (px - ox - P.dx) / P.e, v = (py - oy - P.dy) / P.e;
  P.dx = px - ox - u * nouvelle; P.dy = py - oy - v * nouvelle; P.e = nouvelle;
  if (P.e === 1) { P.dx = 0; P.dy = 0; }
  placerPlan();
}
function brancherPlan() {
  const vue = document.getElementById("plan-vue");
  if (!vue) return;
  const doigts = new Map(); let avant = null;
  const local = ev => { const r = vue.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
  vue.addEventListener("pointerdown", ev => { vue.setPointerCapture(ev.pointerId); doigts.set(ev.pointerId, local(ev)); avant = null; });
  vue.addEventListener("pointermove", ev => {
    if (!doigts.has(ev.pointerId)) return;
    doigts.set(ev.pointerId, local(ev));
    const pts = [...doigts.values()];
    if (pts.length === 1) { const [x, y] = pts[0]; if (avant) { P.dx += x - avant.x; P.dy += y - avant.y; placerPlan(); } avant = { x, y }; }
    else if (pts.length >= 2) {
      const [a, b] = pts, mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (avant?.d) { P.dx += mx - avant.x; P.dy += my - avant.y; zoomer(P.e * d / avant.d, mx, my); }
      avant = { x: mx, y: my, d };
    }
  });
  const fin = ev => { doigts.delete(ev.pointerId); avant = null; };
  vue.addEventListener("pointerup", fin); vue.addEventListener("pointercancel", fin);
  vue.addEventListener("wheel", ev => { ev.preventDefault(); const [x, y] = local(ev); zoomer(P.e * (ev.deltaY < 0 ? 1.25 : 0.8), x, y); }, { passive: false });
  vue.addEventListener("dblclick", ev => { const [x, y] = local(ev); zoomer(P.e >= 4.5 ? 1 : P.e * 2, x, y); });
  placerPlan();
}
addEventListener("resize", () => { if (S.ecran === "plan") placerPlan(); });

// ---- Où aller pour trouver ce qui manque (PreparationRaid.kt) ----
function conseilRaid(ids) {
  const cherches = [...new Set(ids)].map(id => objets.get(id)).filter(Boolean);
  const sansButin = cherches.filter(o => !o.obtention?.cartes?.length).map(o => o.id);
  const parCarte = new Map();
  for (const o of cherches) for (const c of o.obtention?.cartes || []) { if (!parCarte.has(c.carte)) parCarte.set(c.carte, []); parCarte.get(c.carte).push([o.id, c.indice]); }
  const cartesC = [...parCarte].map(([carteId, l]) => {
    const pz = new Map();
    for (const o of cherches) for (const z of (o.obtention?.zones || []).filter(z => z.carte === carteId)) { if (!pz.has(z.zone)) pz.set(z.zone, []); pz.get(z.zone).push([o.id, z.indice]); }
    const zones = [...pz].map(([zone, zl]) => ({ zone, score: zl.reduce((s, x) => s + x[1], 0) / 100, objets: [...zl].sort((a, b) => b[1] - a[1]).map(x => x[0]) }))
      .sort((a, b) => b.objets.length - a.objets.length || b.score - a.score || a.zone.localeCompare(b.zone)).slice(0, 4);
    return { carteId, score: l.reduce((s, x) => s + x[1], 0) / 100, objets: [...l].sort((a, b) => b[1] - a[1]).map(x => x[0]), meilleurePour: l.filter(x => x[1] === 100).map(x => x[0]), zones };
  }).sort((a, b) => b.score - a.score || b.objets.length - a.objets.length || a.carteId.localeCompare(b.carteId));
  // Parcours : à chaque tour, la carte qui apporte le plus de chances sur les objets pas encore couverts.
  const restants = new Set(cartesC.flatMap(c => c.objets)), parcours = [];
  while (restants.size && parcours.length < 3) {
    let meilleur = null;
    for (const [carteId, l] of parCarte) {
      if (parcours.some(e => e.carteId === carteId)) continue;
      const apport = l.filter(x => restants.has(x[0])), somme = apport.reduce((s, x) => s + x[1], 0);
      if (!meilleur || somme > meilleur.somme || (somme === meilleur.somme && (apport.length > meilleur.apport.length || (apport.length === meilleur.apport.length && carteId < meilleur.carteId)))) meilleur = { carteId, apport, somme };
    }
    if (!meilleur || !meilleur.apport.length) break;
    parcours.push({ carteId: meilleur.carteId, objets: [...meilleur.apport].sort((a, b) => b[1] - a[1]).map(x => x[0]) });
    for (const [id] of meilleur.apport) restants.delete(id);
  }
  return { cartes: cartesC, sansButin, parcours };
}
function autreMoyen(o) {
  const ob = o.obtention || {};
  if (o.lieux.includes("ARC")) return "Sur les ARC détruits";
  const a = ob.achats?.[0];
  if (a) return `Chez ${a.commercant}${a.pieces ? ` (${a.pieces} pièces)` : a.valeurObjets ? " (en échange d'objets)" : ""}`;
  const f = ob.fabrications?.[0];
  if (f) return `Fabrication${NB}: ${f.etabli ? (f.niveau ? `${f.etabli} · niveau ${f.niveau}` : f.etabli) : "pendant un raid"}`;
  const r = sourcesRecyclage(o.id)[0];
  if (r) return `En recyclant${NB}: ${nomObjet(r.id)}`;
  if (ob.recompenses?.length) return `En récompense${NB}: ${ob.recompenses[0]}`;
  return "Aucune source connue dans les données du jeu.";
}
// ---- Onglet Raid (EcranRaid.kt) : ce qu'il te faut et où aller, sans rien préparer ----
function ecranOngletRaid() {
  const liste = aTrouver(), restants = liste.filter(x => !x.trouve), conseil = conseilRaid(restants.map(x => x.id));
  const res = S.rechercheAjout.trim() ? rechercher(S.rechercheAjout, 8) : [];
  const nomC = id => cartes.get(id)?.nom ?? NOM_A_VERIFIER;
  // Cartes détaillées : celles du parcours (les cartes à faire), sinon la meilleure.
  let detaillees = conseil.parcours.map(e => conseil.cartes.find(c => c.carteId === e.carteId)).filter(Boolean);
  if (!detaillees.length) detaillees = conseil.cartes.slice(0, 1);
  const autres = conseil.cartes.filter(c => !detaillees.includes(c)), avecButin = new Set(conseil.cartes.flatMap(c => c.objets)).size;
  const couverts = conseil.parcours.reduce((n, e) => n + e.objets.length, 0);
  return `${bandeau("Raid", "--rouge")}<h2>Ton prochain raid</h2>
  <p class="doux" style="margin:0">${restants.length ? `${pluriel(restants.length, "objet", "objets")} à trouver pour tes objectifs et ta liste. Voici où aller.` : "Rien à chercher pour l'instant."}</p>
  ${!restants.length ? `<div class="carte" style="background:var(--releve);display:flex;flex-direction:column;gap:8px;padding:16px"><span class="doux">Suis un objectif (un établi à améliorer, une quête, un projet) ou ajoute un objet ci-dessous${NB}: l'appli te dira sur quelle carte aller et où chercher.</span>
    <button class="bouton" style="--c:var(--vert);align-self:flex-start" data-action="onglet" data-onglet="OBJECTIFS">Choisir mes objectifs</button></div>` : ""}
  ${detaillees.length ? `<h4>Où aller</h4>
  ${conseil.parcours.length > 1 ? `<div class="carte" style="background:var(--releve);display:flex;flex-direction:column;gap:4px;padding:14px"><b style="color:var(--rouge);font-family:var(--titre)">Pour tout trouver</b>
    ${conseil.parcours.map((e, i) => `<span>${i + 1}. ${echap(nomC(e.carteId))} · ${i ? "+ " : ""}${pluriel(e.objets.length, "objet", "objets")}</span>`).join("")}
    ${couverts < avecButin ? `<span class="petit doux">${pluriel(avecButin - couverts, "autre objet", "autres objets")} sur d'autres cartes.</span>` : ""}</div>` : ""}
  ${detaillees.map(c => carteRaid(c, avecButin, c === conseil.cartes[0])).join("")}
  ${autres.length ? `<p class="doux" style="margin:0">Aussi${NB}: ${echap(autres.map(c => `${nomC(c.carteId)} (${pluriel(c.objets.length, "objet", "objets")})`).join(" · "))}</p>` : ""}
  <p class="petit discret" style="margin:0">Classement d'après les tables de butin du jeu (condition normale). Les taux de drop exacts ne sont pas publiés${NB}: le jeu tire le butin sur ses serveurs. Les conditions en cours sur chaque carte s'affichent dans l'appli Android.</p>` : ""}
  ${liste.length ? `<div class="ligne" style="margin-top:8px"><h4 class="flex" style="margin:0">Ce qu'il te faut</h4><button class="lien" data-action="raid">Saisir mon butin</button></div>
  ${liste.map(ligneATrouver).join("")}` : ""}
  <h4>Chercher autre chose</h4>
  <label class="recherche" style="--f:var(--rouge)"><svg class="ic" viewBox="0 0 24 24" style="color:var(--rouge)"><path d="${ONGLETS[1][3]}"/></svg><input id="recherche-ajout" type="search" placeholder="Ajouter un objet à chercher…" value="${echap(S.rechercheAjout)}" data-champ="rechercheAjout" autocomplete="off"></label>
  ${res.map(o => `<button class="carte ligne" style="padding:8px" data-action="raid-ajouter" data-id="${o.id}">${icone(o.id, 36)}<span class="flex">${echap(o.nom)}</span><b style="color:var(--rouge);font-size:13px">Ajouter</b></button>`).join("")}
  ${conseil.sansButin.length ? `<h4>Pas dans le butin</h4>${conseil.sansButin.map(id => `<button class="carte ligne" style="padding:10px;text-align:left" data-action="fiche" data-id="${id}">${icone(id, 36)}<span class="flex"><span class="nom">${echap(nomObjet(id))}</span><br><span class="petit doux">${echap(autreMoyen(objets.get(id)))}</span></span></button>`).join("")}` : ""}`;
}

// Un objet à trouver : combien on en a sur combien il en faut, pour quoi, et « +1 » quand on en trouve un.
// Un objet ajouté par le joueur se retire d'un geste.
function ligneATrouver(a) {
  const nom = echap(nomObjet(a.id));
  return `<div class="carte ligne" style="padding:8px 4px 8px 10px;gap:10px"><button class="ligne flex" style="text-align:left;gap:10px" data-action="fiche" data-id="${a.id}">${icone(a.id, 40)}
    <span class="flex"><span class="nom">${nom}</span><br><span class="petit" style="font-weight:600;color:var(${a.trouve ? "--vert" : "--texte-doux"})">${a.possede}/${a.voulu} · ${echap(a.ajoute ? "ajouté par toi" : a.pour.map(b => b.libelle).join(" · "))}</span></span></button>
    ${a.trouve ? `<span role="img" aria-label="Trouvé" style="color:var(--vert);font:700 22px var(--titre);padding:0 10px">✓</span>`
      : `<button class="rond plein" style="width:56px;height:40px;border-radius:20px;font-size:16px" data-action="qte" data-id="${a.id}" data-d="1" aria-label="J'en ai trouvé un${NB}: ${nom}">+1</button>`}
    ${a.ajoute ? `<button class="retour" data-action="raid-retirer" data-id="${a.id}" aria-label="Ne plus chercher${NB}: ${nom}">✕</button>` : ""}</div>`;
}

// Une carte conseillée : ce qu'on y trouve et les zones où chercher (CarteRaid, EcranRaid.kt).
function carteRaid(c, total, meilleure) {
  return `<div class="carte" style="display:flex;flex-direction:column;gap:6px;padding:14px">
    <div class="ligne"><span class="flex">${meilleure ? `<small style="color:var(--rouge);font-weight:700;letter-spacing:.08em">LE MIEUX</small><br>` : ""}<span style="font:700 19px var(--titre)">${echap(cartes.get(c.carteId)?.nom ?? NOM_A_VERIFIER)}</span></span><b style="font:700 19px var(--titre);color:var(--rouge)">${c.objets.length}/${total}</b></div>
    <span class="petit doux">${pluriel(c.objets.length, "objet à trouver", "objets à trouver")}${c.meilleurePour.length ? `, dont ${c.meilleurePour.length} à leur meilleur endroit` : ""}.</span>
    <div style="display:flex;gap:4px;overflow-x:auto">${c.objets.map(id => icone(id, 32)).join("")}</div>
    ${c.zones.length ? `<h5>Où chercher</h5>${c.zones.map(z => `<button class="carte ligne" style="background:var(--releve);padding:8px 10px;text-align:left" data-action="plan-zone" data-id="${c.carteId}" data-zone="${echap(z.zone)}"><span class="flex"><b>${echap(z.zone)}</b><br><span class="petit doux">${echap(z.objets.map(nomObjet).join(" · "))}</span></span><small style="color:var(--cyan)">Plan ›</small></button>`).join("")}` : ""}</div>`;
}

function ecranReglages() {
  return `${retour("Réglages", "--texte")}<h3>Réglages</h3>
  <div class="note-apercu doux">Ceci est l'<b>aperçu web</b> du Carnet du Raider, tenu à jour avec l'appli Android. Les mises à jour intégrées, le calendrier en direct et les alertes ne fonctionnent que dans l'appli Android.</div>
  <h4>Tes données dans l'aperçu</h4>
  <p class="petit doux" style="margin:0">${stockage === "compte" ? "Ta réserve et ta progression sont gardées avec ton compte claude.ai, visibles de toi seul." : "Ta réserve et ta progression sont gardées dans ce navigateur."} Elles sont séparées de celles de l'appli sur ton téléphone.</p>
  <button class="lien" style="--c:var(--rouge);align-self:flex-start;padding-left:0" data-action="effacer">Effacer mes données de l'aperçu</button>
  <h4>Sauvegarde</h4>
  <p class="petit doux" style="margin:0">Dans l'appli Android, tes données sont sauvegardées automatiquement dans un fichier chiffré avec ton mot de passe, rangé où tu veux (Google Drive pour les retrouver sur un autre téléphone). Propre à l'appli Android.</p>
  <h4>À propos</h4>
  <p class="petit discret" style="margin:0">Projet de fan, non officiel. ARC Raiders est une marque d'Embark Studios AB${NB}; cette appli n'est ni affiliée à Embark Studios ni approuvée par Embark Studios. Noms et icônes du jeu © Embark Studios AB.</p>`;
}

// ---- Validation en une touche, annulable (BandeauValidation) ----
function bandeauValidation() {
  const v = S.validation;
  if (!v) return "";
  return `<div class="bandeau-validation" role="status"><div><div class="flex" style="min-width:0"><b style="font:600 14px var(--titre)">Validé${NB}: ${echap(v.titre)}</b><br><span class="petit doux">${v.retires ? `${pluriel(v.retires, "objet retiré", "objets retirés")} de ta réserve.` : "Réserve inchangée."}</span></div>
  <button class="lien" data-action="annuler-validation">Annuler</button></div></div>`;
}
let minuterieValidation = null;
function valider(titre, cout, avancer) {
  const avant = JSON.stringify(M), retires = cout.reduce((s, q) => s + Math.min(possede(q.id), q.quantite), 0);
  retirer(cout); avancer(); retirerAtteints();
  S.validation = { titre, retires, avant };
  clearTimeout(minuterieValidation);
  minuterieValidation = setTimeout(() => { S.validation = null; rendre(); }, 8000);
}

// ---- Rendu ----
function rendre() {
  const champ = document.activeElement?.dataset?.champ, pos = document.activeElement?.selectionStart;
  const e = S.ecran;
  document.getElementById("contenu").innerHTML =
    e?.type === "fiche" ? ecranFiche(e.id) : e === "plan" ? ecranPlan() : e === "quetes" ? ecranQuetes() : e === "ajout" ? ecranAjout() : e === "raid" ? ecranRaid() : e === "reglages" ? ecranReglages()
    : { ACCUEIL: ecranAccueil, OBJETS: ecranObjets, RAID: ecranOngletRaid, CARTES: ecranCartes, OBJECTIFS: ecranObjectifs }[S.onglet]();
  document.getElementById("nav").innerHTML = ONGLETS.map(([k, t, c, d]) => `<button data-action="onglet" data-onglet="${k}" style="--c:var(${c})" ${S.onglet === k && !S.ecran ? 'aria-current="page"' : ""}><span class="pastille"><svg class="ic" viewBox="0 0 24 24"><path d="${d}"/></svg></span>${t}</button>`).join("");
  document.getElementById("dialogue").innerHTML = bandeauValidation();
  if (e === "plan") brancherPlan();
  document.getElementById("bouton-reglages").style.color = S.ecran === "reglages" ? "var(--or)" : "var(--texte-doux)";
  if (champ) { const el = document.querySelector(`[data-champ="${champ}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (_) {} } }
}
function ouvrir(ecran) { S.ecran = ecran; rendre(); window.scrollTo(0, 0); }

// ---- Actions ----
function changerQte(id, d) {
  const n = Math.min(Math.max(possede(id) + d, 0), 9999);
  if (n) M.reserve[id] = n; else delete M.reserve[id];
}
function retirer(cout) { for (const q of cout) changerQte(q.id, -q.quantite); }
function retirerAtteints() {
  const t = new Set(M.terminees);
  M.manuels = M.manuels.filter(o => o.type === "etabli" ? niveau(etablis.get(o.id)) < o.niveau
    : o.type === "projet" ? (M.etapesProjets[o.id] ?? 0) <= o.etape : !t.has(o.id));
}
function terminerQuete(id) { M.terminees = [...new Set([...M.terminees, ...precedentes(id), id])]; retirerAtteints(); }
function objectifDepuisCle(cle) { const [t, id, n] = cle.split(":"); return t === "etabli" ? { type: "etabli", id, niveau: +n } : { type: "quete", id }; }

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-action]");
  if (!b || b.disabled) return;
  const id = b.dataset.id;
  switch (b.dataset.action) {
    case "onglet": S.onglet = b.dataset.onglet; S.ecran = null; rendre(); window.scrollTo(0, 0); return;
    case "fiche": S.precedent = S.ecran; return ouvrir({ type: "fiche", id });
    case "fermer": S.ecran = S.ecran === "plan" && P.depuis ? P.depuis : S.ecran?.type === "fiche" && S.precedent ? S.precedent : null; P.depuis = null; S.precedent = null; S.raid = null; rendre(); return;
    case "raid-ajouter": M.raid = M.raid || {}; M.raid[id] = Math.min((M.raid[id] ?? 0) + 1, 9999); S.rechercheAjout = ""; break;
    case "raid-retirer": if (M.raid) delete M.raid[id]; break;
    case "raid-basculer": M.raid = M.raid || {}; if (id in M.raid) delete M.raid[id]; else M.raid[id] = 1; break;
    case "reglages": return ouvrir("reglages");
    case "quetes": S.choix = null; S.rechercheQuetes = ""; return ouvrir("quetes");
    case "ajout": return ouvrir("ajout");
    case "raid": {
      // Liste figée à l'ouverture : un objet qui atteint son compte ne disparaît pas sous le doigt.
      const l = aTrouver();
      S.raid = { avant: { ...M.reserve }, aTrouver: l.filter(x => !x.trouve).map(x => x.id), besoins: Object.fromEntries(l.map(x => [x.id, x.voulu])) };
      S.rechercheRaid = ""; return ouvrir("raid");
    }
    case "qte": changerQte(id, +b.dataset.d); break;
    case "annuler-raid": M.reserve = { ...S.raid.avant }; break;
    case "region": M.region = b.dataset.region; break;
    case "niveau-moins": { const e = etablis.get(id); M.niveaux[id] = Math.max(niveau(e) - 1, niveauDepart(e)); retirerAtteints(); break; }
    case "niveau-plus": { const e = etablis.get(id); M.niveaux[id] = Math.min(niveau(e) + 1, niveauMax(e)); retirerAtteints(); break; }
    case "valider-etabli": { const e = etablis.get(id), p = prochainNiveau(e); valider(`${e.nom} · niveau ${p.niveau}`, p.cout, () => { M.niveaux[id] = p.niveau; }); break; }
    case "valider-quete": { const q = quetes.get(id); valider(q.nom, q.objets, () => terminerQuete(id)); break; }
    case "valider-etape": { const p = projets.get(id), e = prochaineEtape(p); valider(`${p.nom} · ${nomEtape(p, e)}`, p.etapes[e].cout, () => { M.etapesProjets[id] = e + 1; }); break; }
    case "etape-moins": M.etapesProjets[id] = Math.max((M.etapesProjets[id] ?? 0) - 1, 0); retirerAtteints(); break;
    case "suivre-projet": M.projetsSuivis = (M.projetsSuivis || []).includes(id) ? M.projetsSuivis.filter(x => x !== id) : [...(M.projetsSuivis || []), id]; break;
    case "annuler-validation": if (S.validation) { charger(S.validation.avant); S.validation = null; } break;
    case "plan": Object.assign(P, { id, e: 1, dx: 0, dy: 0, depuis: null }); S.recherchePlan = ""; return ouvrir("plan");
    case "plan-chercher": S.recherchePlan = id; rendre(); return;
    case "plan-zone": Object.assign(P, { id, e: 1, dx: 0, dy: 0, depuis: S.ecran }); S.recherchePlan = b.dataset.zone; return ouvrir("plan");
    case "plan-zones": P.zones = !P.zones; rendre(); return;
    case "plan-sorties": P.sorties = !P.sorties; rendre(); return;
    case "plan-entier": Object.assign(P, { e: 1, dx: 0, dy: 0 }); rendre(); return;
    case "suivre": M.suivis = (M.suivis || []).includes(id) ? M.suivis.filter(x => x !== id) : [...(M.suivis || []), id]; break;
    case "suivre-tous": M.suivis = (M.suivis || []).length === D.etablis.length ? [] : D.etablis.map(e => e.id); break;
    case "cocher": S.choix.has(id) ? S.choix.delete(id) : S.choix.add(id); rendre(); return;
    case "valider-quetes": {
      const avant = new Set([...S.choix].flatMap(x => [...precedentes(x)])), apres = new Set([...S.choix].flatMap(x => [...suivantes(x), x]));
      M.terminees = [...new Set([...M.terminees, ...avant])].filter(x => !apres.has(x));
      M.quetesIndiquees = true; retirerAtteints(); S.ecran = null; S.onglet = "OBJECTIFS"; break;
    }
    case "ajouter-objectif": M.manuels.push(objectifDepuisCle(b.dataset.cle)); S.ecran = null; break;
    case "retirer-objectif": M.manuels = M.manuels.filter(o => cleObjectif(o) !== b.dataset.cle); break;
    case "effacer": Object.assign(M, { reserve: {}, niveaux: {}, terminees: [], suivis: [], manuels: [], quetesIndiquees: false, region: "EUROPE", etapesProjets: {}, projetsSuivis: [], raid: {} }); break;
    default: return;
  }
  enregistrer();
  rendre();
});
document.addEventListener("input", ev => {
  const c = ev.target.dataset?.champ;
  if (!c) return;
  S[c] = ev.target.value;
  rendre();
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && S.ecran) { S.ecran = null; rendre(); } });

// ---- Sauvegarde : compte claude.ai (privé) si disponible, sinon ce navigateur ----
let stockage = "navigateur", docCompte = null, minuterie = null, ecriture = Promise.resolve();
function enregistrer() {
  const copie = JSON.parse(JSON.stringify(M));
  try { localStorage.setItem("carnet", JSON.stringify(copie)); } catch (_) {}
  if (!docCompte) return;
  clearTimeout(minuterie);
  minuterie = setTimeout(() => { ecriture = ecriture.then(() => docCompte.set({ etat: JSON.stringify(copie) })).catch(() => {}); }, 700);
}
function charger(texte) { try { Object.assign(M, JSON.parse(texte)); } catch (_) {} }
try { const t = localStorage.getItem("carnet"); if (t) charger(t); } catch (_) {}
rendre();

(async () => {
  try {
    const [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]);
    const id = db && user ? await user.id() : null;
    if (!id) return;
    docCompte = db.collection("data/users/" + id).doc("carnet");
    const snap = await docCompte.get();
    stockage = "compte";
    if (snap.exists && snap.data()?.etat) { charger(snap.data().etat); rendre(); }
    else enregistrer();
  } catch (_) { /* aperçu utilisable sans compte : données dans ce navigateur */ }
})();

fetch("icones.json").then(r => r.ok ? r.json() : null).then(j => { if (j) { icones = j; rendre(); } }).catch(() => {});
</script>
