<title>Le Carnet du Raider</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Prompt:wght@600;700;800&display=swap">
<style>
/* Style « Signal » de l'appli Android : toujours sombre, une couleur par domaine
   (or : objets, cyan : cartes, vert : objectifs, rouge : raid et ARC, violet : builds). Colonne de téléphone centrée. */
:root {
  --fond: #141417; --surface: #1E1E23; --releve: #28282F; --trait: #34343C;
  --texte: #F3EEE4; --texte-doux: #ABA69C; --texte-discret: #8A867E; --sur-couleur: #141417;

  --commun: #B4B4B4; --rare: #4FA3F7; --epique: #D46BE0;
  --titre: "Prompt", "Segoe UI", system-ui, sans-serif;
  --corps: "Barlow", "Segoe UI", system-ui, sans-serif;
  --coupee: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--fond); color: var(--texte); }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--fond); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
.app { max-width: 460px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; position: relative; }
.entete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--fond);
  display: flex; align-items: center; gap: 12px; padding-block: 10px 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.entete h1 { font: 700 clamp(17px, 5.4vw, 20px)/1.2 var(--titre); margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contenu { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-block: 8px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 460px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 12px; color: var(--texte-doux); font-size: 12px; white-space: nowrap; }
.nav .pastille { width: 48px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
.nav button[aria-current="page"] { color: var(--c); }

h2 { font: 800 30px/1.1 var(--titre); margin: 0; text-wrap: balance; }

.doux { color: var(--texte-doux); } .discret { color: var(--texte-discret); } .petit { font-size: 13px; }
/* Bandeau en tête de chaque onglet (BandeauSection.kt) : couleur de la section, code, nom, motif. */
.section { position: relative; flex: none; height: 132px; overflow: hidden; background: var(--c); color: var(--sur-couleur);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 34px), calc(100% - 34px) 100%, 0 100%); }

.bandeau { align-self: flex-start; font: 700 11px/1 var(--titre); letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--sur-couleur); background: var(--c, var(--texte)); padding: 6px 10px; border-radius: 99px; }
.carte { background: var(--surface); border-radius: 6px; padding: 12px 14px; }
.ligne { display: flex; align-items: center; gap: 12px; }
.ligne > .flex, .flex { flex: 1; min-width: 0; }
.nom { font-weight: 600; font-size: 16px; }
button.carte { text-align: left; width: 100%; }
button.carte:hover { background: var(--releve); }
.recherche { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--trait);
  border-radius: 6px; padding: 12px 16px; }
.recherche:focus-within { border-color: var(--f, var(--or)); }
.recherche input { flex: 1; min-width: 0; background: none; border: 0; color: var(--texte); font: inherit; font-size: 16px; outline: none; }
.icone { flex: none; display: grid; place-items: center; border-radius: 22%; overflow: hidden;
  background: linear-gradient(180deg, color-mix(in srgb, var(--r) 8%, transparent), color-mix(in srgb, var(--r) 32%, transparent));
  border: 1.5px solid color-mix(in srgb, var(--r) 60%, transparent); }
.icone img { width: 86%; height: 86%; object-fit: contain; }
.puce { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border-radius: 99px; padding: 5px 10px; font-size: 13px; font-weight: 600; }
.puce i { width: 8px; height: 8px; border-radius: 50%; background: var(--r); }
.bouton { border-radius: 99px; padding: 11px 18px; font: 700 15px/1 var(--titre); background: var(--c, var(--or)); color: var(--sur-couleur); }
.bouton.large { width: 100%; border-radius: 6px; padding: 17px; }
.bouton.contour { background: none; color: var(--c, var(--or)); border: 2px solid var(--c, var(--or)); }
.lien { color: var(--c, var(--or)); font-weight: 600; padding: 8px 6px; }
.rond { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font: 700 20px/1 var(--titre); background: var(--surface); flex: none; }
.rond.plein { background: var(--c, var(--or)); color: var(--sur-couleur); }
.rond:disabled { opacity: .35; cursor: default; }
.compteur { display: flex; align-items: center; gap: 6px; flex: none; }
.compteur b { width: 44px; text-align: center; font: 700 20px var(--titre); font-variant-numeric: tabular-nums; }
.barre { height: 6px; border-radius: 99px; background: var(--trait); overflow: hidden; }
.barre i { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--or)); }
.prochain { display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: left; border-radius: 6px; padding: 16px 18px; background: var(--surface); }
.prochain.plein { border-radius: 0; clip-path: var(--coupee); }
.prochain.plein { background: var(--rouge); color: var(--sur-couleur); }
.prochain:hover { filter: brightness(1.08); }
.prochain small { font: 700 11px var(--titre); letter-spacing: 2px; }
.prochain strong { font: 700 22px/1.2 var(--titre); }
/* « Meilleure carte » et « Ton prochain raid » sur une capture en jeu de la carte (FondEnJeu, FondCarte.kt) :
   « ombre latérale ». */
.prochain.plein.photo { background: linear-gradient(90deg, rgba(20,20,23,.94) 0%, rgba(20,20,23,.72) 52%, rgba(20,20,23,.1) 100%), var(--photo) center / cover, var(--fond); color: var(--texte); padding: 18px; }
.prochain.plein.photo small { color: var(--rouge); }
.verdict { background: var(--v, var(--or)); color: var(--sur-couleur); clip-path: var(--coupee); padding: 20px; display: flex; flex-direction: column; gap: 6px; }
.verdict.neutre { color: var(--texte); }
.verdict small { font: 700 11px var(--titre); letter-spacing: 1.5px; }
.verdict h3 { font-size: 30px; } .verdict hr { border: 0; border-top: 1px solid color-mix(in srgb, currentColor 30%, transparent); margin: 6px 0; width: 100%; }
.pv { font: 700 11px/1 var(--titre); letter-spacing: 1px; text-transform: uppercase; padding: 4px 8px; border-radius: 3px; white-space: nowrap; border: 1.5px solid var(--p); color: var(--p); }
.usage b { font: 600 14px var(--titre); color: var(--cyan); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.chip { border: 1px solid var(--trait); border-radius: 8px; padding: 7px 12px; color: var(--texte-doux); white-space: nowrap; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--c, var(--cyan)); color: var(--sur-couleur); border-color: transparent; }
.retour { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.retour:hover { background: var(--surface); }
.case { width: 20px; height: 20px; border-radius: 4px; border: 2px solid var(--texte-doux); flex: none; display: grid; place-items: center; }
.case.coche { background: var(--vert); border-color: var(--vert); color: var(--sur-couleur); font-weight: 700; font-size: 14px; }
.note-apercu { border: 1px dashed var(--trait); border-radius: 16px; padding: 10px 14px; }
.valider { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 9px 14px; font: 700 14px/1 var(--titre); background: var(--vert); color: var(--sur-couleur); align-self: flex-start; }
.bandeau-validation { position: fixed; left: 0; right: 0; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 6; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bandeau-validation > div { pointer-events: auto; max-width: 428px; margin: 0 auto; background: var(--vert); color: var(--sur-couleur); clip-path: var(--coupee); padding: 8px 8px 8px 16px; display: flex; align-items: center; gap: 8px; }
.bandeau-validation .lien { color: var(--sur-couleur); font-weight: 700; }
.apercus { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.apercus button { flex: none; width: 132px; background: var(--surface); border-radius: 6px; overflow: hidden; text-align: left; }
.apercus img { display: block; width: 132px; height: 96px; object-fit: cover; background: var(--releve); }
.apercus span { display: block; padding: 8px 10px; font-size: 13px; font-weight: 600; }
.plan-vue { position: relative; width: min(100%, 70vh); aspect-ratio: 1; margin: 0 auto; border-radius: 16px; overflow: hidden; background: var(--fond); touch-action: none; cursor: grab; user-select: none; }
.plan-vue img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; pointer-events: none; }
.plan-vue .etq { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; background: rgba(20,20,23,.72); border-radius: 6px; padding: 2px 6px; font-size: 12px; font-weight: 600; pointer-events: none; }
.plan-vue .etq.grande { font: 700 14px var(--titre); }
h5 { margin: 6px 0 0; font: 600 14px var(--titre); color: var(--or); }
.indice { display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: left; padding: 4px 0; }
.indice > i { display: block; height: 4px; border-radius: 2px; background: var(--releve); overflow: hidden; }
.indice > i > i { display: block; height: 100%; background: var(--or); }
.indice b { font-variant-numeric: tabular-nums; color: var(--or); margin-left: 8px; }
.indice small { margin-left: 8px; }
.plan-vue .arc { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--rouge); border: 2px solid var(--fond); pointer-events: none; }
.plan-vue .sortie { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--cyan); border: 3px solid var(--fond); pointer-events: none; }
.reste { display: flex; flex-direction: column; align-items: flex-end; padding-right: 8px; flex: none; }
.reste b { font: 700 20px/1.1 var(--titre); color: var(--or); font-variant-numeric: tabular-nums; }
.reste small { font-size: 11px; color: var(--texte-doux); }
.celebration { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; overflow: hidden; cursor: pointer;
  background: color-mix(in srgb, var(--fond) 95%, transparent); animation: apparaitre .3s ease-out both;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); }
.celebration:focus { outline: none; }
.celebration-in { position: relative; width: min(100%, 420px); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.celebration h2 { font-size: 34px; }
.celebration .sous { margin: 0; font: 600 18px var(--titre); }
.atteints { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 8px; }
.atteint { text-align: left; padding: 10px; animation: rebond .55s cubic-bezier(.34, 1.56, .64, 1) both; }
.coche-icone { position: relative; flex: none; display: grid; }
.coche-icone i { position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--fond);
  background: var(--vert); color: var(--sur-couleur); font: 700 11px/16px var(--titre); font-style: normal; text-align: center; }
.pop { animation: rebond .6s .3s cubic-bezier(.34, 1.56, .64, 1) both; }
.gerbe { position: absolute; left: 50%; top: 30%; width: 0; height: 0; }
.gerbe i { position: absolute; width: 8px; height: 22px; margin: -11px 0 0 -4px; background: var(--c); animation: gerbe 1.8s cubic-bezier(.2, .7, .4, 1) both; }
.choix-en-cours { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: var(--releve); border-radius: 6px; padding: 12px 6px 12px 14px; }
.grille-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grille-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grille-3 .pf { min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.choix-en-cours:hover { filter: brightness(1.1); }
.choix-en-cours b { font: 600 14px/1.3 var(--titre); }
.case-build { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 6px; padding: 8px; text-align: left; min-width: 0; }
.case-build:hover { background: var(--releve); }
.case-build .vide { width: 44px; height: 44px; flex: none; border: 1.5px solid var(--trait); border-radius: 4px; }
.champ { width: 100%; background: var(--fond); color: var(--texte); border: 1px solid var(--trait); border-radius: 10px; padding: 12px 14px; font: inherit; font-size: 16px; }
.champ:focus { outline: none; border-color: var(--violet); }
.banniere { position: relative; width: 100%; height: 88px; display: grid; place-items: center; overflow: hidden; }
.banniere::before { content: ""; position: absolute; inset: 0 -40px; background: repeating-linear-gradient(70deg, transparent 0 14px, rgba(20,20,23,.12) 14px 18px), var(--vert);
  clip-path: polygon(40px 0, 100% 0, calc(100% - 40px) 100%, 0 100%); animation: balayage .45s cubic-bezier(.4, 0, .2, 1) both, rayures 1.2s .45s linear both; }
.banniere h2 { position: relative; color: var(--sur-couleur); font-size: 28px; white-space: nowrap; animation: resserrer .6s .3s cubic-bezier(.4, 0, .2, 1) both; }
.chip.fin:not([aria-pressed="true"]) { color: var(--vert); }
/* Projet ou établi terminé (CarteChoix, EcranObjectifs.kt) : une ligne sobre, « ✓ Terminé » et « Modifier ».
   Au passage à « Terminé », le balayage : une fine ligne verte traverse la carte et le fond se teinte derrière
   elle, puis la carte se replie en sa ligne, la teinte s'efface et « ✓ Terminé » apparaît. */
.carte.choix, .carte.ligne-fin { position: relative; overflow: hidden; }
.carte.ligne-fin { padding: 4px 6px 4px 14px; display: flex; flex-direction: column; gap: 8px; }
.carte.balaie { animation: balaie-teinte .48s .12s linear both; }
.carte.balaie::after { content: ""; position: absolute; top: 0; bottom: 0; left: -56px; width: 56px; pointer-events: none;
  background: linear-gradient(90deg, rgba(108,203,95,0), rgba(108,203,95,.16)); border-right: 2px solid rgba(108,203,95,.75); animation: balaie-ligne .68s cubic-bezier(.45, 0, .25, 1) both; }
.carte.repli { animation: repli .32s cubic-bezier(.4, 0, .2, 1) both; }
.carte.repli .fin { animation: apparaitre .25s .12s ease-out both; }
/* Fin explicite : le vert à 12 % sur la surface (Chromium anime mal vers un color-mix). */
@keyframes balaie-teinte { from { background-color: var(--surface); } to { background-color: #27332A; } }
@keyframes balaie-ligne { from { left: -56px; } to { left: 100%; } }
@keyframes repli { from { max-height: 170px; background-color: #27332A; } to { max-height: 52px; background-color: var(--surface); } }
.tampon { flex: none; margin-right: 6px; font: 700 15px/1 var(--titre); letter-spacing: 2px; color: var(--vert); border: 2px solid var(--vert); border-radius: 6px; padding: 4px 8px;
  transform: rotate(-12deg); animation: tampon .45s cubic-bezier(.34, 1.56, .64, 1) both; }
.objectif-termine { border-left: 6px solid var(--vert); padding-left: 12px; }
@keyframes balayage { from { clip-path: polygon(40px 0, 40px 0, 0 100%, 0 100%); } }
@keyframes rayures { from { background-position: 0 0, 0 0; } to { background-position: 36px 0, 0 0; } }
@keyframes resserrer { from { opacity: 0; letter-spacing: 10px; } to { opacity: 1; letter-spacing: 2px; } }
@keyframes tampon { from { opacity: 0; transform: rotate(-12deg) scale(2.2); } }
@keyframes apparaitre { from { opacity: 0; } }
@keyframes rebond { from { opacity: 0; transform: scale(.7); } }
@keyframes gerbe { from { transform: translate(0, 0) rotate(0deg) skewX(-20deg); opacity: 1; }
  to { transform: translate(var(--dx), calc(var(--dy) + 35vh)) rotate(var(--r)) skewX(-20deg); opacity: 0; } }
/* Motifs des bandeaux, en boucle (BandeauSection.kt) : reflet, inventaire, recherche, repère, impulsion, scan. */
.m-reflet { transform: translateX(250px); animation: m-reflet 4.5s cubic-bezier(.45, 0, .25, 1) infinite; }
@keyframes m-reflet { 0% { transform: translateX(-80px); } 22%, 100% { transform: translateX(250px); } }
.m-case { opacity: 0; animation: m-case 4.5s linear infinite; }
@keyframes m-case { 0% { opacity: 0; } 5% { opacity: .4; } 16%, 100% { opacity: 0; } }
.m-cherche { animation: m-cherche 7s ease-in-out infinite; }
@keyframes m-cherche { 0% { transform: none; } 16% { transform: translate(-14px, 9px); } 32% { transform: translate(-7px, -11px); } 48% { transform: translate(11px, -5px); } 64% { transform: translate(13px, 9px); } 78%, 100% { transform: none; } }
.m-serre { transform-box: view-box; transform-origin: 130px 62px; animation: m-serre 7s ease-in-out infinite; }
@keyframes m-serre { 0%, 76% { transform: none; } 83% { transform: scale(.88); } 90%, 100% { transform: none; } }
.m-pouls { transform-box: fill-box; transform-origin: center; animation: m-pouls 7s ease-in-out infinite; }
@keyframes m-pouls { 0%, 78% { transform: none; } 84% { transform: scale(1.8); } 90%, 100% { transform: none; } }
.m-flotte { animation: m-flotte 1.5s ease-in-out infinite alternate; }
@keyframes m-flotte { to { transform: translateY(-3px); } }
.m-onde { transform-box: fill-box; transform-origin: center; opacity: 0; animation: m-onde 3s cubic-bezier(.2, .7, .3, 1) .4s infinite; }
@keyframes m-onde { 0% { transform: none; opacity: .7; } 40%, 100% { transform: scale(4.5); opacity: 0; } }
.m-impulsion { transform: translateX(210px); animation: m-impulsion 3.6s infinite; }
@keyframes m-impulsion { 0% { transform: translateX(-70px); animation-timing-function: cubic-bezier(.4, 0, .6, 1); } 16%, 100% { transform: translateX(210px); } }
.m-c1 { animation: m-eclat-25 3.6s ease-out 90ms infinite; }
.m-c2 { animation: m-eclat-50 3.6s ease-out 170ms infinite; }
.m-c3 { animation: m-pousse 3.6s ease-out 250ms infinite; }
@keyframes m-eclat-25 { 0%, 5% { fill-opacity: .25; transform: none; } 10% { fill-opacity: .85; transform: translateX(6px); } 22%, 100% { fill-opacity: .25; transform: none; } }
@keyframes m-eclat-50 { 0%, 5% { fill-opacity: .5; transform: none; } 10% { fill-opacity: .95; transform: translateX(6px); } 22%, 100% { fill-opacity: .5; transform: none; } }
@keyframes m-pousse { 0%, 5% { transform: none; } 10% { transform: translateX(6px); } 22%, 100% { transform: none; } }
.m-scan { opacity: 0; animation: m-scan 3.4s cubic-bezier(.45, 0, .25, 1) infinite; }
@keyframes m-scan { 0% { transform: translateY(-4px); opacity: 0; } 8% { opacity: 1; } 68% { transform: translateY(132px); opacity: 1; } 70%, 100% { transform: translateY(132px); opacity: 0; } }
/* Bandeau qui se replie quand la page défile (EcranDeSection, BandeauSection.kt). */

.section h2, .section .code, .section .sous, .section > div { transition: font-size .22s ease, opacity .22s ease, max-height .22s ease, padding .22s ease; }

<script>
"use strict";
// Aperçu web du Carnet du Raider : mêmes données du jeu (noms français officiels), mêmes règles
// que l'appli Android (core/), réécrites ici en JavaScript.
const D = JSON.parse(document.getElementById("donnees-jeu").textContent);
const NB = " ";
const NOM_A_VERIFIER = "Nom à vérifier en jeu";
const RARETES = { COMMUN: ["Commun", "--commun"], INHABITUEL: ["Inhabituel", "--vert"], RARE: ["Rare", "--rare"], EPIQUE: ["Épique", "--epique"], LEGENDAIRE: ["Légendaire", "--or"] };
const echap = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pluriel = (n, s, p) => `${n} ${n > 1 ? p : s}`;
const normaliser = t => t.trim().toLowerCase().normalize("NFD").replace(/\p{Mn}+/gu, "").replace(/’/g, "'").replace(/[\u00a0\u202f]/g, " ");

// ---- Catalogue (core/Catalogue.kt) ----
const objets = new Map(D.objets.map(o => [o.id, o]));
const etablis = new Map(D.etablis.map(e => [e.id, e]));
const quetes = new Map(D.quetes.map(q => [q.id, q]));
const index = D.objets.map(o => [o, normaliser(o.nom)]);
const tous = [...index].sort((a, b) => a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : a[0].nom.localeCompare(b[0].nom)).map(x => x[0]);
const nomObjet = id => objets.get(id)?.nom ?? NOM_A_VERIFIER;
function rechercher(saisie, limite) {
  const cle = normaliser(saisie);
  if (!cle) return [];
  return index.filter(([, n]) => n.includes(cle))
    .sort((a, b) => (!a[1].startsWith(cle)) - (!b[1].startsWith(cle)) || a[0].nom.length - b[0].nom.length || a[0].nom.localeCompare(b[0].nom))
    .slice(0, limite).map(x => x[0]);
}
const valeurRecyclage = o => o.recyclage.reduce((s, q) => s + (objets.get(q.id)?.valeur ?? 0) * q.quantite, 0);

// ---- Mémoire du joueur (comme Memoire.kt), gardée pour ce compte ----
// Tout est fait d'office, sauf ce qu'il indique en cours : quêtes, niveau en cours des établis (suivis),
// étape en cours des projets et Expéditions (projetsSuivis). À l'installation, rien n'est en cours.
const ETAT_VIDE = () => ({ apports: {}, butin: {}, niveaux: {}, terminees: [], suivis: [], quetesIndiquees: false, region: "EUROPE", etapesProjets: {}, projetsSuivis: [], builds: [], modele: 2 });
const M = ETAT_VIDE();
const projets = new Map((D.projets || []).map(p => [p.id, p]));
const cartes = new Map(D.cartes.map(c => [c.id, c]));
const estExpedition = p => p.id.startsWith("expedition_project");

// ---- Progression (core/Progression.kt) ----
const histoire = D.quetes.filter(q => q.histoire);
const suites = new Map();
for (const q of histoire) for (const r of q.requiert) suites.set(r, [...(suites.get(r) || []), q.id]);
const niveauDepart = e => Math.min(...e.niveaux.map(n => n.niveau)) - 1;
const niveauMax = e => Math.max(...e.niveaux.map(n => n.niveau));
const niveau = e => Math.min(Math.max(M.niveaux[e.id] ?? niveauDepart(e), niveauDepart(e)), niveauMax(e));
const prochainNiveau = e => e.niveaux.filter(n => n.niveau > niveau(e)).sort((a, b) => a.niveau - b.niveau)[0] ?? null;
// Niveau en cours de l'établi, s'il est indiqué en cours (et pas au maximum).
const niveauEnCours = e => M.suivis.includes(e.id) ? prochainNiveau(e)?.niveau ?? null : null;
const quetesEnCours = () => { if (!M.quetesIndiquees) return []; const t = new Set(M.terminees); return histoire.filter(q => !t.has(q.id) && q.requiert.every(r => t.has(r))); };
function parcourir(depart, voisins) {
  const vus = new Set(), aVoir = [...voisins(depart)];
  while (aVoir.length) { const id = aVoir.shift(); if (!vus.has(id)) { vus.add(id); aVoir.push(...voisins(id)); } }
  vus.delete(depart); return vus;
}
const precedentes = id => parcourir(id, x => quetes.get(x)?.requiert ?? []);
const suivantes = id => parcourir(id, x => suites.get(x) ?? []);
const cleObjectif = o => o.type === "etabli" ? `etabli:${o.id}:${o.niveau}` : o.type === "projet" ? `projet:${o.id}:${o.etape}` : o.type === "butin" ? `butin:${o.id}` : `quete:${o.id}`;
const prochaineEtape = p => { const n = M.etapesProjets[p.id] ?? 0; return n < p.etapes.length ? n : null; };
const etapeEnCours = p => M.projetsSuivis.includes(p.id) ? prochaineEtape(p) : null;
const nomEtape = (p, i) => p?.etapes[i]?.nom ?? `étape ${i + 1}`;
// Les objectifs : niveau en cours des établis indiqués, quêtes en cours (avec ou sans objets), étape en cours des projets.
function objectifs() {
  const liste = [];
  for (const e of D.etablis) { const n = niveauEnCours(e); if (n != null) liste.push({ type: "etabli", id: e.id, niveau: n }); }
  for (const q of quetesEnCours()) liste.push({ type: "quete", id: q.id });
  for (const p of D.projets || []) { const e = etapeEnCours(p); if (e != null) liste.push({ type: "projet", id: p.id, etape: e }); }
  return liste;
}
// Quêtes cochées en cours : tout le reste est fait d'office, sauf ce qui vient après elles ; une quête cochée
// qui mène à une autre quête cochée est faite (SuiviProgression.indiquerQuetesEnCours).
function indiquerQuetes(enCours) {
  const cochees = new Set([...enCours].filter(id => histoire.some(q => q.id === id)));
  const avant = new Set([...cochees].flatMap(x => [...precedentes(x)]));
  const vraiment = [...cochees].filter(x => !avant.has(x)), apres = new Set(vraiment.flatMap(x => [...suivantes(x)]));
  M.terminees = histoire.map(q => q.id).filter(id => !vraiment.includes(id) && !apres.has(id));
  M.quetesIndiquees = true;
}
// Terminé : l'établi est au niveau maximum, ou le projet a fait toutes ses étapes.
const etabliTermine = e => e.niveaux.length > 0 && !prochainNiveau(e);
const projetTermine = p => p.etapes.length > 0 && prochaineEtape(p) == null;
function indiquerEtabliTermine(e) { M.niveaux[e.id] = niveauMax(e); M.suivis = M.suivis.filter(x => x !== e.id); }
function indiquerProjetTermine(p) { M.etapesProjets[p.id] = p.etapes.length; M.projetsSuivis = M.projetsSuivis.filter(x => x !== p.id); }
function indiquerNiveau(e, n) {
  // « Aucun » : rien en cours ; s'il était terminé, il ne l'est plus.
  if (n == null) { if (etabliTermine(e)) delete M.niveaux[e.id]; M.suivis = M.suivis.filter(x => x !== e.id); return; }
  M.niveaux[e.id] = Math.min(Math.max(n - 1, niveauDepart(e)), niveauMax(e));
  if (!M.suivis.includes(e.id)) M.suivis.push(e.id);
}
function indiquerEtape(p, etape) {
  if (etape == null) { if (projetTermine(p)) delete M.etapesProjets[p.id]; M.projetsSuivis = M.projetsSuivis.filter(x => x !== p.id); return; }
  M.etapesProjets[p.id] = Math.min(Math.max(etape, 0), p.etapes.length);
  if (!M.projetsSuivis.includes(p.id)) M.projetsSuivis.push(p.id);
}

// ---- Liste de courses (core/ListeDeCourses.kt) : pas de réserve, seulement ce qui a été rapporté de raid
// pour chaque objectif (M.apports : clé de l'objectif → objets rapportés) ----
const libelle = o => o.type === "etabli" ? `${etablis.get(o.id)?.nom ?? NOM_A_VERIFIER} · niveau ${o.niveau}`
  : o.type === "butin" ? BUTIN
  : o.type === "projet" ? `${projets.get(o.id)?.nom ?? NOM_A_VERIFIER} · ${nomEtape(projets.get(o.id), o.etape)}`
  : `Quête «${NB}${quetes.get(o.id)?.nom ?? NOM_A_VERIFIER}${NB}»`;
const besoins = o => o.type === "etabli" ? (etablis.get(o.id)?.niveaux.find(n => n.niveau === o.niveau)?.cout ?? [])
  : o.type === "butin" ? [{ id: o.id, quantite: o.quantite }]
  : o.type === "projet" ? (projets.get(o.id)?.etapes[o.etape]?.cout ?? []) : (quetes.get(o.id)?.objets ?? []);
const apporteDe = (o, id, apports = M.apports) => apports?.[cleObjectif(o)]?.[id] ?? 0;
const besoinsPourObjet = (id, objs, apports = M.apports) => objs.map(o => {
  const quantite = besoins(o).filter(q => q.id === id).reduce((s, q) => s + q.quantite, 0), apporte = apporteDe(o, id, apports);
  return { o, libelle: libelle(o), quantite, apporte, manque: Math.max(0, quantite - apporte) };
}).filter(b => b.quantite > 0);
function listeDeCourses(objs = objectifs(), apports = M.apports) {
  const ids = [...new Set(objs.flatMap(o => besoins(o).map(q => q.id)))];
  const lignes = ids.map(id => {
    const pour = besoinsPourObjet(id, objs, apports), somme = f => pour.reduce((s, b) => s + f(b), 0);
    const l = { id, nom: nomObjet(id), pour, besoin: somme(b => b.quantite), apporte: somme(b => Math.min(b.apporte, b.quantite)), manquant: somme(b => b.manque) };
    return { ...l, complet: l.manquant === 0 };
  });
  lignes.sort((a, b) => a.complet - b.complet || b.manquant - a.manquant || a.nom.localeCompare(b.nom));
  const total = lignes.reduce((s, l) => s + l.besoin, 0);
  return { lignes, manquants: lignes.reduce((s, l) => s + l.manquant, 0), progression: total ? lignes.reduce((s, l) => s + l.apporte, 0) / total : 1 };
}
// Ce qui manque encore à un objectif (identifiant → quantité) ; complet quand il ne lui manque rien.
function manqueObjectif(o, apports = M.apports) {
  const m = {};
  for (const q of besoins(o)) m[q.id] = (m[q.id] ?? 0) + q.quantite;
  for (const id of Object.keys(m)) { m[id] -= apports?.[cleObjectif(o)]?.[id] ?? 0; if (m[id] <= 0) delete m[id]; }
  return m;
}
const complet = (o, apports = M.apports) => besoins(o).length > 0 && !Object.keys(manqueObjectif(o, apports)).length;
// ---- Butin recherché (core/ButinRecherche.kt) : des objets à rapporter pour soi, sans objectif du jeu
// (M.butin : objet → quantité voulue). Ils s'ajoutent à la liste du raid, après les objectifs du jeu ----
const BUTIN = "Butin recherché", BUTIN_MAX = 999;
const objetsRecherches = () => Object.entries(M.butin || {}).filter(([, n]) => n > 0).map(([id, n]) => ({ type: "butin", id, quantite: n }));
const objectifsDuRaid = () => [...objectifs(), ...objetsRecherches()];
const rapportesButin = id => M.apports?.[`butin:${id}`]?.[id] ?? 0;
function changerButin(id, n) {
  M.butin = M.butin || {};
  if (n <= 0) { delete M.butin[id]; delete M.apports[`butin:${id}`]; }
  else M.butin[id] = Math.min(Math.max(n, rapportesButin(id) + 1), BUTIN_MAX);
}
// Les objets dont tout a été rapporté quittent la liste, avec ce qui avait été rapporté pour eux.
function terminerButin() {
  for (const [id, n] of Object.entries(M.butin || {})) if (rapportesButin(id) >= n) { delete M.butin[id]; delete M.apports[`butin:${id}`]; }
}
// Toute la liste du raid, trouvés compris : objectifs en cours et butin recherché, les plus en retard d'abord.
function listeDuRaid(apports = M.apports) {
  return listeDeCourses(objectifsDuRaid(), apports).lignes.map(l => etatATrouver({ id: l.id, trouves: l.apporte, voulu: l.besoin, pour: l.pour }));
}
const etatATrouver = x => ({ ...x, reste: Math.max(0, x.voulu - x.trouves), trouve: x.trouves >= x.voulu });
const aTrouver = () => listeDuRaid().filter(x => !x.trouve);
const pourQui = a => a.pour.map(b => b.libelle).join(" · ");

// ---- Répartition du butin (Planificateur.repartir) : les objectifs du jeu d'abord, le plus près d'être
// terminé en premier, puis le butin recherché ; ce qui dépasse n'est gardé nulle part ----
function repartir(objs, avant, saisis) {
  const apports = JSON.parse(JSON.stringify(avant || {}));
  const total = d => Object.values(d.manque).reduce((s, n) => s + n, 0);
  // Ordre fixé avant la répartition : le plus près d'être terminé d'abord, puis l'ordre de la liste.
  const ordre = [...new Map(objs.map(o => [cleObjectif(o), o])).values()].map(o => ({ cle: cleObjectif(o), manque: manqueObjectif(o, avant), butin: o.type === "butin" }))
    .map((d, i) => ({ d, i, t: total(d) })).sort((a, b) => a.d.butin - b.d.butin || a.t - b.t || a.i - b.i).map(x => x.d);
  for (const [id, quantite] of Object.entries(saisis)) {
    let reste = quantite;
    for (const d of ordre) {
      if (reste <= 0) break;
      const pris = Math.min(reste, d.manque[id] ?? 0);
      if (pris <= 0) continue;
      d.manque[id] -= pris;
      reste -= pris;
      apports[d.cle] = apports[d.cle] || {}; apports[d.cle][id] = (apports[d.cle][id] ?? 0) + pris;
    }
  }
  return apports;
}

// ---- Objectifs terminés d'eux-mêmes (SuiviProgression.terminerLesComplets) : tout a été rapporté, et c'est
// la prochaine chose à faire ; la suite s'ajoute (niveau suivant, quête suivante, étape suivante) ----
function atteignable(o) {
  if (o.type === "etabli") { const e = etablis.get(o.id); return !!e && prochainNiveau(e)?.niveau === o.niveau; }
  if (o.type === "projet") { const p = projets.get(o.id); return !!p && prochaineEtape(p) === o.etape; }
  const q = quetes.get(o.id), t = new Set(M.terminees);
  return !!q && !t.has(q.id) && q.requiert.every(r => t.has(r));
}
function terminerObjectif(o) {
  if (o.type === "etabli") { const e = etablis.get(o.id); if (e) M.niveaux[o.id] = Math.min(Math.max(niveau(e), o.niveau), niveauMax(e)); }
  else if (o.type === "projet") { const p = projets.get(o.id); if (p) M.etapesProjets[o.id] = Math.min(Math.max(M.etapesProjets[o.id] ?? 0, o.etape + 1), p.etapes.length); }
  else M.terminees = [...new Set([...M.terminees, ...precedentes(o.id), o.id])];
}
function terminerLesComplets() {
  const termines = [];
  for (;;) {
    const suivant = objectifs().find(o => !termines.some(x => cleObjectif(x) === cleObjectif(o)) && atteignable(o) && complet(o));
    if (!suivant) break;
    terminerObjectif(suivant);
    termines.push(suivant);
  }
  for (const o of termines) delete M.apports[cleObjectif(o)];
  return termines;
}

// ---- Retour de raid (core/RetourDeRaid.kt) : le seul endroit où l'on note des objets ----
function noter(id, d) {
  const R = S.raid;
  if (!R) return;
  const max = R.liste.find(x => x.id === id)?.reste ?? 0, n = Math.min(Math.max((R.saisis[id] ?? 0) + d, 0), max);
  if (n) R.saisis[id] = n; else delete R.saisis[id];
  M.apports = repartir(objectifsDuRaid(), R.avant, R.saisis);
}
function bilanRaid(avant, apres, termines) {
  const maintenant = new Map(apres.map(x => [x.id, x]));
  const atteints = avant.filter(a => !a.trouve).map(a => maintenant.get(a.id) ?? etatATrouver({ ...a, trouves: a.voulu })).filter(x => x.trouve);
  return { atteints, termines, termine: avant.some(a => !a.trouve) && apres.every(x => x.trouve) };
}
// Retour de raid quitté (Valider, retour, autre onglet) : ce qui est complet se termine (la suite s'ajoute), et
// l'animation montre le bilan ; « Annuler » remet tout comme avant.
function validerRetour() {
  const R = S.raid;
  if (!R) return;
  S.raid = null;
  const notes = Object.values(R.saisis).reduce((s, n) => s + n, 0);
  const avant = JSON.stringify({ ...M, apports: R.avant });
  const apres = listeDuRaid(), termines = terminerLesComplets();
  terminerButin();
  const bilan = bilanRaid(R.liste, apres, termines);
  if (bilan.atteints.length || termines.length) S.celebration = bilan;
  if (notes || termines.length) montrerValidation({ titre: "Retour de raid", avant, objetsNotes: notes, termines });
  enregistrer();
}

// ---- À quoi peut servir un objet (core/Usages.kt) : données du jeu, plus établis, quêtes et projets qui le
// demandent. C'est une explication : seuls les objectifs en cours et les builds décident de le garder ----
const UTILISATIONS_VIDES = { fabrication: [], recherches: [], avantPoste: [], echanges: [], echangesValeur: [], amplification: [], aApprendre: false, debloque: [], meubles: [], apparence: false, cle: false, equipement: false };
function usages(id) {
  const o = objets.get(id), ut = { ...UTILISATIONS_VIDES, ...(o?.utilisations || {}) };
  const qte = cout => cout.filter(q => q.id === id).reduce((s, q) => s + q.quantite, 0);
  const ameliorations = D.etablis.flatMap(e => e.niveaux.map(n => ({ etabli: e, niveau: n.niveau, quantite: qte(n.cout) }))).filter(x => x.quantite > 0);
  const quetesU = D.quetes.map(q => ({ quete: q, quantite: qte(q.objets) })).filter(x => x.quantite > 0);
  const projetsU = (D.projets || []).flatMap(p => p.etapes.map((e, i) => ({ projet: p, etape: i, quantite: qte(e.cout) }))).filter(x => x.quantite > 0);
  const aucun = Object.entries(UTILISATIONS_VIDES).every(([k, v]) => Array.isArray(v) ? !ut[k].length : !ut[k]) && !ameliorations.length && !quetesU.length && !projetsU.length;
  return { description: o?.description ?? null, ut, ameliorations, quetes: quetesU, projets: projetsU, aucun };
}
// Résumé court, du plus utile au moins utile (UsagesObjet.resume).
function resumeUsages(u) {
  const ut = u.ut;
  return [[ut.cle, "clé"], [ut.equipement, "équipement"], [u.ameliorations.length, "établis"], [u.quetes.length, "quêtes"], [u.projets.length, "projets"],
    [ut.fabrication.length, "fabrication"], [ut.amplification.length, "amplification"], [ut.aApprendre, "à apprendre"], [ut.apparence, "apparence"],
    [ut.recherches.length, "recherche"], [ut.avantPoste.length, "Avant-poste"], [ut.echanges.length || ut.echangesValeur.length, "échanges"]].filter(x => x[0]).map(x => x[1]);
}

// ---- Mes builds (core/Builds.kt) : six builds, un objet par case ; leurs objets et tout ce qu'il faut pour
// les fabriquer ou les améliorer (de proche en proche) sont à garder ----
const NOMBRE_BUILDS = 6;
const CASES = [["MODULE", "Module", "MODULE"], ["BOUCLIER", "Bouclier", "BOUCLIER"], ["ARME_1", "Arme 1", "ARME"], ["ARME_2", "Arme 2", "ARME"],
  ["SOINS", "Soins", "SOINS"], ["GRENADES", "Grenades", "GRENADE"],
  // Six « Autres » (CaseBuild.AUTRE_1 à 6) ; la première garde la clé de l'ancienne case « Divers ».
  ...[1, 2, 3, 4, 5, 6].map(n => [n === 1 ? "DIVERS" : `AUTRE_${n}`, `Autre ${n}`, "DIVERS"])];
const builds = () => {
  const l = Array.from({ length: NOMBRE_BUILDS }, (_, i) => ({ nom: "", objets: {}, prefere: false, ...(M.builds?.[i] || {}) }));
  // Un seul build préféré (Builds.completer) : le premier marqué.
  const p = l.findIndex(b => b.prefere);
  return l.map((b, i) => ({ ...b, prefere: i === p }));
};
// Le préféré d'abord, puis les autres dans l'ordre (Builds.ordre) ; ouvert à l'arrivée sur l'onglet (Builds.ouvert).
const ordreBuilds = l => { const p = l.findIndex(b => b.prefere); return p < 0 ? l.map((_, i) => i) : [p, ...l.map((_, i) => i).filter(i => i !== p)]; };
// Ce qu'il faut pour fabriquer tout le build, avec les quantités (Builds.aFabriquer) : première recette, ou coût de
// l'amélioration plus l'arme d'avant ; du plus demandé au moins demandé.
function aFabriquer(b) {
  const total = new Map();
  const ajouter = (id, prof) => {
    const ob = objets.get(id)?.obtention || {};
    let ingr;
    if (ob.amelioration && prof < 8) { ajouter(ob.amelioration.depuis, prof + 1); ingr = ob.amelioration.ingredients; }
    else ingr = ob.fabrications?.[0]?.ingredients || [];
    for (const q of ingr) total.set(q.id, (total.get(q.id) || 0) + q.quantite);
  };
  for (const [cle] of CASES) if (b.objets[cle]) ajouter(b.objets[cle], 0);
  return [...total].sort((a, x) => x[1] - a[1] || normaliser(nomObjet(a[0])).localeCompare(normaliser(nomObjet(x[0]))));
}
const nomBuild = (b, i) => b.nom.trim() || `Build ${i + 1}`;
const choixCase = cle => { const em = CASES.find(c => c[0] === cle)[2]; return tous.filter(o => o.emplacement === em); };
function materiaux(id) {
  const directs = x => { const ob = objets.get(x)?.obtention || {}; return [...(ob.fabrications || []).flatMap(f => f.ingredients.map(q => q.id)), ...(ob.amelioration ? [ob.amelioration.depuis, ...ob.amelioration.ingredients.map(q => q.id)] : [])]; };
  const vus = new Set(), aVoir = directs(id);
  while (aVoir.length) { const x = aVoir.shift(); if (x !== id && !vus.has(x)) { vus.add(x); aVoir.push(...directs(x)); } }
  return vus;
}
// Objets à garder pour les builds : identifiant → [{ build, objet, direct }].
function aGarderBuilds(liste = builds()) {
  const m = new Map(), ajouter = (id, u) => { const l = m.get(id) || []; if (!l.some(x => x.build === u.build && x.objet === u.objet && x.direct === u.direct)) l.push(u); m.set(id, l); };
  liste.forEach((b, i) => {
    const nom = nomBuild(b, i);
    for (const objet of [...new Set(CASES.map(c => b.objets[c[0]]).filter(Boolean))]) {
      ajouter(objet, { build: nom, objet, direct: true });
      for (const x of materiaux(objet)) ajouter(x, { build: nom, objet, direct: false });
    }
  });
  return m;
}

// Verdict (core/Verdict.kt) : utile seulement pour un objectif en cours (s'il en manque) ou pour un build ;
// sinon à vendre ou à recycler, selon ce qui rapporte le plus.
function meilleureSortie(o) { return !o?.recyclage.length ? "VENDRE" : valeurRecyclage(o) > o.valeur ? "RECYCLER" : "VENDRE"; }
function verdict(id, objs = objectifsDuRaid(), pourBuilds = aGarderBuilds()) {
  const pour = besoinsPourObjet(id, objs), manque = pour.reduce((s, b) => s + b.manque, 0), b = pourBuilds.get(id) || [];
  if (manque > 0) return { type: "garder", manquant: manque, besoin: pour.reduce((s, x) => s + x.quantite, 0), pour, builds: b };
  if (b.length) return { type: "build", builds: b };
  return { type: "inutile", sortie: meilleureSortie(objets.get(id)) };
}

  <button class="carte ligne" data-action="onglet" data-onglet="OBJETS" style="padding:15px 18px">
